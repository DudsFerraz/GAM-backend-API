---
- name: Deploy an approved GAM release pair
  hosts: gam_production
  remote_user: "{{ steady_state_user }}"
  become: true
  # The full-site baseline already gathered host facts. Avoid an implicit task
  # between inherited lock acquisition and the guarded imported pre-tasks.
  gather_facts: false

  vars:
    production_root: /opt/gam
    compose_file: "{{ production_root }}/compose.yml"
    compose_env_file: "{{ production_root }}/runtime/production.env"
    release_manifest_source: "{{ playbook_dir }}/../release-manifest.yml"
    release_record_file: "{{ production_root }}/release-records/deployments.jsonl"
    deployment_lock_directory: /run/gam-production-deploy.lock
    backup_success_marker: "{{ production_root }}/backups/latest-successful"
    backup_max_age_seconds: 86400
    frontend_root: "{{ production_root }}/frontend"
    frontend_release_root: "{{ frontend_root }}/releases"
    frontend_current_link: "{{ frontend_root }}/current"
    frontend_previous_link: "{{ frontend_root }}/previous"
    controller_release_root: >-
      {{ lookup('env', 'GAM_RELEASE_STAGING_ROOT')
      | default('/tmp/gam-production-release-assets', true) }}
    controller_release_directory: "{{ controller_release_root }}/{{ release_id }}"
    frontend_archive_source: "{{ controller_release_directory }}/{{ selected_release.frontend.artifact }}"
    frontend_checksum_source: "{{ controller_release_directory }}/{{ selected_release.frontend.artifact }}.sha256"
    github_token: "{{ lookup('env', 'GH_TOKEN') }}"
    gam_public_origin: "{{ lookup('env', 'GAM_PUBLIC_ORIGIN') }}"
    gam_operator_cidrs: []
    commissioning_enabled: true
    first_launch: false
    developer_approval: "{{ lookup('env', 'GAM_DEPLOYMENT_APPROVAL') | default('', true) }}"
    developer_approval_record: "{{ lookup('env', 'GAM_DEPLOYMENT_APPROVAL_RECORD') | default('', true) }}"
    backend_private_health_command: >-
      wget -qO- http://127.0.0.1:8080/health

  pre_tasks:
    # site.yml owns the "Acquire exclusive deployment lock" task and rejects
    # "another production deployment" when its atomic
    # mkdir "{{ deployment_lock_directory }}" cannot succeed. It then runs
    # "Mark deployment lock as acquired" before importing this playbook, so
    # this play continues the same transaction instead of acquiring a second lock.
    - name: Verify inherited Developer approval and uninterrupted full-site deployment lock ownership
      block:
        - name: Assert inherited Developer approval and deployment lock ownership
          ansible.builtin.assert:
            that:
              - developer_approval | lower == 'approved'
              - developer_approval_record | length > 0
              - deployment_lock_acquired | default(false) | bool
            fail_msg: The approved full-site deployment must retain its Developer approval record and exclusive lock before release convergence.
      rescue:
        - name: Validate inherited deployment lock ownership after ownership validation failure
          ansible.builtin.shell: |
            set -eu
            lock="{{ deployment_lock_directory }}"
            expected_token="{{ deployment_lock_owner_token | default('') }}"
            if [ ! -e "$lock" ]; then
              printf '%s\n' absent
            elif [ -n "$expected_token" ] &&
                 [ "$(sed -n '1p' "$lock/owner" 2>/dev/null || true)" = "owner_token=$expected_token" ]; then
              printf '%s\n' owned
            else
              printf '%s\n' foreign
            fi
          args:
            executable: /bin/sh
          changed_when: false
          register: inherited_lock_ownership_after_validation_failure
          when: deployment_lock_acquired | default(false) | bool

        - name: Release inherited deployment lock after ownership validation failure
          ansible.builtin.file:
            path: "{{ deployment_lock_directory }}"
            state: absent
          changed_when: false
          when:
            - deployment_lock_acquired | default(false) | bool
            - >-
              (deployment_lock_owner_token | default('') | length == 0) or
              (inherited_lock_ownership_after_validation_failure.stdout | default('') | trim == 'owned')

        - name: Stop after inherited deployment ownership validation failure
          ansible.builtin.fail:
            msg: Imported release convergence requires the approved full-site deployment lock.

    - name: Validate imported release inputs under the inherited deployment lock
      block:
        - name: Load the release-manifest model
          ansible.builtin.include_vars:
            file: "{{ release_manifest_source }}"
            name: selected_release

        - name: Validate release policy and identifier before deriving paths
          ansible.builtin.assert:
            that:
              - selected_release.compatibility.database_change is defined
              - selected_release.compatibility.database_rollback_compatible is defined
              - selected_release.compatibility.database_change is boolean
              - selected_release.compatibility.database_rollback_compatible is boolean
              - selected_release.compatibility.pair is defined
              - selected_release.compatibility.pair is match('^[a-z0-9][a-z0-9._-]{0,127}$')
            fail_msg: The release pair and database rollback policy must be explicit and safe before deployment.

        - name: Derive release transaction state
          ansible.builtin.set_fact:
            release_pair: "{{ selected_release.compatibility.pair }}"
            release_id: >-
              {{ selected_release.compatibility.pair }}-{{
                (
                  selected_release.format_version ~ '|' ~
                  selected_release.backend.image ~ '|' ~
                  selected_release.backend.digest ~ '|' ~
                  selected_release.backend.release_commit ~ '|' ~
                  selected_release.frontend.repository ~ '|' ~
                  selected_release.frontend.tag ~ '|' ~
                  selected_release.frontend.artifact ~ '|' ~
                  selected_release.frontend.sha256 ~ '|' ~
                  selected_release.frontend.release_commit
                ) | hash('sha256')
              }}
            database_change_required: >-
              {{ selected_release.compatibility.database_change | default(false) | bool }}
            database_rollback_compatible: >-
              {{ selected_release.compatibility.database_rollback_compatible |
                 default(not (selected_release.compatibility.database_change | default(false) | bool)) |
                 bool }}
            database_migration_applied: false
            failed_release_record_failed: false
            failed_release_record_error: ""
            failed_same_release_record_failed: false
            failed_same_release_record_error: ""
            maintenance_response_enabled: false
            release_changed: false
            release_transaction_failed: true
            same_release_transaction_failed: true
            rollback_current_link_switched: false
            active_release_compose_override: "{{ frontend_current_link }}/compose.override.yml"

        - name: Validate immutable release-manifest identity
          ansible.builtin.assert:
            that:
              - selected_release.format_version is integer
              - selected_release.format_version == 1
              - selected_release.backend.image is match('^ghcr\\.io/[A-Za-z0-9._/-]+@sha256:[0-9a-f]{64}$')
              - selected_release.backend.digest is match('^sha256:[0-9a-f]{64}$')
              - selected_release.backend.image.split('@') | length == 2
              - selected_release.backend.image.split('@')[1] == selected_release.backend.digest
              - selected_release.frontend.repository is match('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
              - selected_release.frontend.tag is match('^v[0-9]+\\.[0-9]+\\.[0-9]+$')
              - selected_release.frontend.artifact == 'gam-frontend-' ~ selected_release.frontend.tag ~ '.tar.gz'
              - selected_release.frontend.sha256 is match('^[0-9a-f]{64}$')
              - selected_release.backend.release_commit is match('^[0-9a-f]{40}$')
              - selected_release.frontend.release_commit is match('^[0-9a-f]{40}$')
              - selected_release.rollback.minimum_days is integer
              - selected_release.rollback.minimum_days >= 14
              - selected_release.rollback.minimum_verified_releases is integer
              - selected_release.rollback.minimum_verified_releases >= 2
              - selected_release.rollback.retain_backend_digest is sameas true
              - selected_release.rollback.retain_frontend_archive is sameas true
              - selected_release.rollback.retain_frontend_checksum is sameas true
              - selected_release.rollback.retain_manifest is sameas true
              - selected_release.rollback.retain_fingerprinted_assets is sameas true
              - selected_release.previous.retained is sameas true
            fail_msg: Release identity is not an immutable, rollback-retainable pair.

        - name: Require deployment inputs without selecting an official domain
          ansible.builtin.assert:
            that:
              - gam_public_origin | length > 0
              - gam_operator_cidrs | length > 0
              - github_token | length > 0
            fail_msg: GAM_PUBLIC_ORIGIN, the operator CIDR allowlist, and GH_TOKEN are explicit deployment inputs.
          no_log: true

        - name: Require published non-prerelease immutable frontend release metadata
          ansible.builtin.assert:
            that:
              - selected_release.frontend.published | bool
              - not selected_release.frontend.prerelease | bool
              - selected_release.frontend.immutable | bool
            fail_msg: The selected frontend release must be published, non-prerelease, and immutable.

        - name: Inspect the active release before acquiring the deployment lock
          ansible.builtin.stat:
            path: "{{ frontend_current_link }}"
            follow: false
          register: active_release_link

        - name: Select whether the immutable release transaction is required
          ansible.builtin.set_fact:
            release_transaction_required: >-
              {{
                not (active_release_link.stat.islnk | default(false)) or
                (active_release_link.stat.lnk_source | default('')) !=
                (frontend_release_root ~ '/' ~ release_id)
              }}
      rescue:
        - name: Validate inherited deployment lock ownership after release-input validation failure
          ansible.builtin.shell: |
            set -eu
            lock="{{ deployment_lock_directory }}"
            expected_token="{{ deployment_lock_owner_token | default('') }}"
            if [ ! -e "$lock" ]; then
              printf '%s\n' absent
            elif [ -n "$expected_token" ] &&
                 [ "$(sed -n '1p' "$lock/owner" 2>/dev/null || true)" = "owner_token=$expected_token" ]; then
              printf '%s\n' owned
            else
              printf '%s\n' foreign
            fi
          args:
            executable: /bin/sh
          changed_when: false
          register: inherited_lock_ownership_after_release_input_failure
          when: deployment_lock_acquired | default(false) | bool

        - name: Release inherited deployment lock after release-input validation failure
          ansible.builtin.file:
            path: "{{ deployment_lock_directory }}"
            state: absent
          changed_when: false
          when:
            - deployment_lock_acquired | default(false) | bool
            - >-
              (deployment_lock_owner_token | default('') | length == 0) or
              (inherited_lock_ownership_after_release_input_failure.stdout | default('') | trim == 'owned')

        - name: Stop after imported release-input validation failure
          ansible.builtin.fail:
            msg: Imported release inputs failed validation; the inherited deployment lock was released.

  tasks:
    - name: Read the managed Compose runtime environment before convergence
      ansible.builtin.slurp:
        src: "{{ compose_env_file }}"
      register: managed_production_env
      failed_when: false
      changed_when: false

    - name: Preserve the commissioning gate in the managed runtime environment
      ansible.builtin.set_fact:
        managed_commissioning_gate_enabled: >-
          {{
            managed_production_env.content | default('') | b64decode
            | regex_findall('(?m)^GAM_COMMISSIONING_ENABLED=(true|false)$')
            | first
            | default(commissioning_enabled | bool | ternary('true', 'false'), true)
          }}

    - name: Select whether the already-active runtime requires disruptive convergence
      ansible.builtin.set_fact:
        same_release_runtime_convergence_required: >-
          {{
            production_compose_configuration_install.changed | default(false) | bool or
            production_secret_input_install.changed | default(false) | bool or
            (managed_production_env.content | default('') | b64decode) !=
            ('GAM_PUBLIC_ORIGIN=' ~ gam_public_origin ~ '\n' ~
             'GAM_OPERATOR_CIDRS=' ~ (gam_operator_cidrs | join(' ')) ~ '\n' ~
             'GAM_COMMISSIONING_ENABLED=' ~ managed_commissioning_gate_enabled ~ '\n' ~
             'GAM_MAINTENANCE_ENABLED=false\n' ~
             'POSTGRES_DB=gam_api\n' ~
             'POSTGRES_USER=gam\n')
          }}

    - name: Run the release transaction
      block:
        - name: Write exclusive deployment lock owner
          ansible.builtin.shell: |
            set -eu
            printf 'owner_token=%s\npid=%s release=%s\n' \
              "{{ deployment_lock_owner_token }}" "$$" "{{ release_id }}" \
              > "{{ deployment_lock_directory }}/owner"
          args:
            executable: /bin/sh
          changed_when: true

        - name: Create release and operation directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: "0750"
          loop:
            - "{{ production_root }}/runtime"
            - "{{ production_root }}/release-records"
            - "{{ production_root }}/backups"
            - "{{ frontend_release_root }}"

        - name: Converge the managed production Compose runtime environment
          ansible.builtin.copy:
            dest: "{{ compose_env_file }}"
            owner: root
            group: root
            mode: "0640"
            content: |
              GAM_PUBLIC_ORIGIN={{ gam_public_origin }}
              GAM_OPERATOR_CIDRS={{ gam_operator_cidrs | join(' ') }}
              GAM_COMMISSIONING_ENABLED={{ managed_commissioning_gate_enabled }}
              GAM_MAINTENANCE_ENABLED=false
              POSTGRES_DB=gam_api
              POSTGRES_USER=gam

        - name: Inspect the latest successful backup marker
          ansible.builtin.stat:
            path: "{{ backup_success_marker }}"
          register: backup_marker

        - name: Enforce backup freshness before a database change
          ansible.builtin.assert:
            that:
              - >-
                (not database_change_required | bool) or backup_marker.stat.exists
              - >-
                (not database_change_required | bool) or backup_marker.stat.isreg
              - >-
                (not database_change_required | bool) or
                ((ansible_date_time.epoch | int - backup_marker.stat.mtime | int)
                <= backup_max_age_seconds)
            fail_msg: A database-changing release requires a successful backup no older than 24 hours.

        - name: Prepare the versioned release directory before database validation
          ansible.builtin.file:
            path: "{{ frontend_release_root }}/{{ release_id }}/frontend"
            state: directory
            owner: root
            group: root
            mode: "0750"

        - name: Create the rollback Compose override for this pair
          ansible.builtin.copy:
            dest: "{{ frontend_release_root }}/{{ release_id }}/compose.override.yml"
            owner: root
            group: root
            mode: "0640"
            content: |
              services:
                backend:
                  image: {{ selected_release.backend.image }}

        - name: Select the new release override for transition handlers
          ansible.builtin.set_fact:
            active_release_compose_override: "{{ frontend_release_root }}/{{ release_id }}/compose.override.yml"

        - name: Converge the production PostgreSQL prerequisite through the approved release sequence
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --env-file
              - "{{ compose_env_file }}"
              - -f
              - "{{ compose_file }}"
              - up
              - --detach
              - --wait
              - postgres
          register: production_postgresql_compose_convergence
          changed_when: >-
            (production_postgresql_compose_convergence.stdout ~ '\n'
            ~ production_postgresql_compose_convergence.stderr)
            is search('(?im)\b(created|recreated|started|pulled|built)\b')

        - name: Flyway gate
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --env-file
              - "{{ compose_env_file }}"
              - -f
              - "{{ compose_file }}"
              - -f
              - "{{ active_release_compose_override }}"
              - run
              - --rm
              - --no-deps
              - backend
              - flyway
              - validate
          environment:
            GAM_FLYWAY_GATE: validate
          when: database_change_required | bool
          changed_when: false

        - name: Create the controller release staging directory
          ansible.builtin.file:
            path: "{{ controller_release_directory }}"
            state: directory
            mode: "0700"
          delegate_to: localhost
          become: false

        - name: Verify selected immutable GitHub Release metadata on the controller
          ansible.builtin.command:
            argv:
              - gh
              - api
              - --method
              - GET
              - "repos/{{ selected_release.frontend.repository }}/releases/tags/{{ selected_release.frontend.tag }}"
          environment:
            GH_TOKEN: "{{ github_token }}"
          delegate_to: localhost
          become: false
          register: github_release_metadata_result
          changed_when: false
          check_mode: false
          no_log: true

        - name: Validate selected immutable GitHub Release metadata
          ansible.builtin.assert:
            that:
              - (github_release_metadata_result.stdout | from_json).tag_name == selected_release.frontend.tag
              - not (github_release_metadata_result.stdout | from_json).draft | bool
              - not (github_release_metadata_result.stdout | from_json).prerelease | bool
              - (github_release_metadata_result.stdout | from_json).immutable | default(false) | bool
            fail_msg: The selected frontend release must exist as a published non-prerelease immutable GitHub Release.

        - name: Download the selected immutable GitHub Release assets on the controller
          ansible.builtin.command:
            argv:
              - gh
              - release
              - download
              - "{{ selected_release.frontend.tag }}"
              - --repo
              - "{{ selected_release.frontend.repository }}"
              - --pattern
              - "{{ selected_release.frontend.artifact }}"
              - --pattern
              - "{{ selected_release.frontend.artifact }}.sha256"
              - --dir
              - "{{ controller_release_directory }}"
              - --clobber
          environment:
            GH_TOKEN: "{{ github_token }}"
          delegate_to: localhost
          become: false
          no_log: true

        - name: Compute the controller-downloaded frontend archive digest
          ansible.builtin.command:
            cmd: sha256sum "{{ frontend_archive_source }}"
          delegate_to: localhost
          register: frontend_archive_digest
          changed_when: false
          check_mode: false

        - name: Verify frontend release metadata and archive checksum bytes
          ansible.builtin.set_fact:
            frontend_checksum_sidecar: "{{ lookup('ansible.builtin.file', frontend_checksum_source, rstrip=false) }}"

        - name: Verify frontend release metadata and archive checksum
          ansible.builtin.assert:
            that:
              - (frontend_checksum_source | basename) == selected_release.frontend.artifact ~ '.sha256'
              - >-
                frontend_checksum_sidecar ==
                (selected_release.frontend.sha256 ~ '  ' ~ selected_release.frontend.artifact ~ '\n')
              - frontend_checksum_sidecar is match('^[0-9a-f]{64}  ' ~ selected_release.frontend.artifact ~ '\n$')
              - frontend_archive_digest.stdout.split()[0] == selected_release.frontend.sha256
            fail_msg: Frontend archive, sidecar, and release-manifest checksums disagree.

        - name: Verify frontend archive structure before transfer
          ansible.builtin.shell: |
            set -eu
            archive="{{ frontend_archive_source }}"
            entries="$(tar -tzf "$archive")"
            printf '%s\n' "$entries" | grep -Fxq 'index.html'
            if printf '%s\n' "$entries" | grep -Eq '(^/|(^|/)\.\./|^\.{1,2}$)'; then
              echo 'unsafe frontend archive path' >&2
              exit 1
            fi
            if tar -tvzf "$archive" | awk '$1 ~ /^[lbhcps]/ {bad=1} END {exit bad}'; then
              :
            else
              echo 'frontend archive contains a link, device, or pipe entry' >&2
              exit 1
            fi
          args:
            executable: /bin/sh
          delegate_to: localhost
          changed_when: false

        - name: Transfer the verified controller-downloaded frontend archive
          ansible.builtin.copy:
            src: "{{ frontend_archive_source }}"
            dest: "{{ frontend_release_root }}/{{ release_id }}/{{ selected_release.frontend.artifact }}"
            owner: root
            group: root
            mode: "0640"

        - name: Transfer the verified frontend checksum sidecar
          ansible.builtin.copy:
            src: "{{ frontend_checksum_source }}"
            dest: "{{ frontend_release_root }}/{{ release_id }}/{{ selected_release.frontend.artifact }}.sha256"
            owner: root
            group: root
            mode: "0640"

        - name: Record the selected manifest beside retained rollback artifacts
          ansible.builtin.copy:
            src: "{{ release_manifest_source }}"
            dest: "{{ frontend_release_root }}/{{ release_id }}/release-manifest.yml"
            owner: root
            group: root
            mode: "0640"

        - name: Verify the transferred frontend archive again
          ansible.builtin.command:
            cmd: sha256sum "{{ frontend_release_root }}/{{ release_id }}/{{ selected_release.frontend.artifact }}"
          register: transferred_frontend_digest
          changed_when: false
          check_mode: false

        - name: Assert transferred frontend archive remains immutable
          ansible.builtin.assert:
            that:
              - transferred_frontend_digest.stdout.split()[0] == selected_release.frontend.sha256
            fail_msg: Transferred frontend archive does not match the selected release-manifest digest.

        - name: Read current commissioning gate state before maintenance
          ansible.builtin.slurp:
            src: "{{ compose_env_file }}"
          register: current_production_env
          failed_when: false
          changed_when: false

        - name: Preserve current commissioning gate state during maintenance
          ansible.builtin.set_fact:
            preserved_commissioning_gate_enabled: >-
              {{
                current_production_env.content | default('') | b64decode
                | regex_findall('(?m)^GAM_COMMISSIONING_ENABLED=(true|false)$')
                | first
                | default(commissioning_enabled | bool | ternary('true', 'false'), true)
              }}

        - name: Enable maintenance response while preserving current commissioning state
          ansible.builtin.copy:
            dest: "{{ compose_env_file }}"
            owner: root
            group: root
            mode: "0640"
            content: |
              GAM_PUBLIC_ORIGIN={{ gam_public_origin }}
              GAM_OPERATOR_CIDRS={{ gam_operator_cidrs | join(' ') }}
              GAM_COMMISSIONING_ENABLED={{ (first_launch | bool) | ternary('true', preserved_commissioning_gate_enabled) }}
              GAM_MAINTENANCE_ENABLED=true
              POSTGRES_DB=gam_api
              POSTGRES_USER=gam
          when: not ansible_check_mode
          notify: Reload Caddy after maintenance transition

        - name: Mark maintenance response as enabled for the transaction
          ansible.builtin.set_fact:
            maintenance_response_enabled: true

        - name: Apply maintenance response before replacement
          ansible.builtin.meta: flush_handlers

        - name: Force commissioning gate enabled before first-launch rollout
          ansible.builtin.lineinfile:
            path: "{{ compose_env_file }}"
            regexp: '^GAM_COMMISSIONING_ENABLED='
            line: GAM_COMMISSIONING_ENABLED=true
          when: first_launch | bool
          notify: Reload Caddy after maintenance transition

        - name: Apply first-launch commissioning gate before rollout
          ansible.builtin.meta: flush_handlers
          when: first_launch | bool

        - name: Inspect current release manifest before replacement
          ansible.builtin.stat:
            path: "{{ frontend_current_link }}/release-manifest.yml"
          register: current_release_manifest

        - name: Retain the previous compatible pair
          ansible.builtin.shell: |
            set -eu
            if [ -L "{{ frontend_current_link }}" ]; then
              previous_target="$(readlink -f "{{ frontend_current_link }}")"
              rm -f "{{ frontend_previous_link }}"
              ln -s "$previous_target" "{{ frontend_previous_link }}"
            fi
          args:
            executable: /bin/sh
          changed_when: true

        - name: Extract the verified frontend release
          ansible.builtin.unarchive:
            src: "{{ frontend_release_root }}/{{ release_id }}/{{ selected_release.frontend.artifact }}"
            dest: "{{ frontend_release_root }}/{{ release_id }}/frontend"
            remote_src: true
            extra_opts:
              - --no-same-owner
              - --no-same-permissions

        - name: Switch the entry document to the selected fingerprinted assets
          ansible.builtin.file:
            src: "{{ frontend_release_root }}/{{ release_id }}"
            dest: "{{ frontend_current_link }}"
            state: link
            force: true

        - name: Mark release as changed after current entry switch
          ansible.builtin.set_fact:
            release_changed: true

        - name: Apply migration and release sequence
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --env-file
              - "{{ compose_env_file }}"
              - -f
              - "{{ compose_file }}"
              - -f
              - "{{ frontend_release_root }}/{{ release_id }}/compose.override.yml"
              - up
              - -d
              - --remove-orphans
              - backend
              - caddy
          register: rollout_result

        - name: Mark a database migration as applied when this pair changes schema
          ansible.builtin.set_fact:
            database_migration_applied: "{{ database_change_required | bool }}"

        - name: Validate Caddy configuration after rollout
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --env-file
              - "{{ compose_env_file }}"
              - -f
              - "{{ compose_file }}"
              - exec
              - -T
              - caddy
              - caddy
              - validate
              - --config
              - /etc/caddy/Caddyfile
              - --adapter
              - caddyfile
          changed_when: false

        - name: Verify database connectivity
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --env-file
              - "{{ compose_env_file }}"
              - -f
              - "{{ compose_file }}"
              - exec
              - -T
              - postgres
              - pg_isready
              - -U
              - gam
              - -d
              - gam_api
          changed_when: false

        - name: Verify private backend health
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --env-file
              - "{{ compose_env_file }}"
              - -f
              - "{{ compose_file }}"
              - exec
              - -T
              - backend
              - /bin/sh
              - -ec
              - "{{ backend_private_health_command }}"
          changed_when: false

        - name: Verify production release before approved transitions
          ansible.builtin.assert:
            that:
              - rollout_result.rc | int == 0
            fail_msg: The selected production release did not complete its rollout command.

        - name: Disable maintenance response after rollout checks
          ansible.builtin.lineinfile:
            path: "{{ compose_env_file }}"
            regexp: '^GAM_MAINTENANCE_ENABLED='
            line: GAM_MAINTENANCE_ENABLED=false
          notify: Reload Caddy after maintenance transition

        - name: Apply maintenance response transition
          ansible.builtin.meta: flush_handlers

        - name: Disable commissioning gate after approved launch
          ansible.builtin.lineinfile:
            path: "{{ compose_env_file }}"
            regexp: '^GAM_COMMISSIONING_ENABLED='
            line: GAM_COMMISSIONING_ENABLED=false
          when: first_launch | bool
          notify: Reload Caddy after maintenance transition

        - name: Apply approved commissioning transition
          ansible.builtin.meta: flush_handlers
          when: first_launch | bool

        - name: Record commissioning launch transition
          ansible.builtin.lineinfile:
            path: "{{ release_record_file }}"
            create: true
            owner: root
            group: root
            mode: "0640"
            insertafter: EOF
            line: >-
              {{ {'event': 'commissioning_gate', 'result': 'disabled',
                  'pair': release_pair, 'release_id': release_id,
                  'approval_record': developer_approval_record,
                  'developer_approval': developer_approval} | to_json }}
          when: first_launch | bool

        - name: Verify public production health after approved transition
          ansible.builtin.uri:
            url: "{{ gam_public_origin }}/api/health"
            method: GET
            headers:
              Accept: application/json
            return_content: true
            status_code: 200
            validate_certs: true
          delegate_to: localhost
          register: public_health
          # Ansible flattens Content-Type and Cache-Control into lowercase result keys.
          failed_when: >-
            public_health.status != 200 or
            public_health.content != '{"status":"UP"}' or
            (public_health.content_type | default('') | lower) != 'application/json' or
            (public_health.cache_control | default('') | lower) != 'no-store'

        - name: Record release result
          ansible.builtin.lineinfile:
            path: "{{ release_record_file }}"
            create: true
            owner: root
            group: root
            mode: "0640"
            insertafter: EOF
            line: >-
              {{ {'event': 'production_release', 'result': 'success',
                  'pair': release_pair, 'release_id': release_id,
                  'backend_image': selected_release.backend.image,
                  'backend_release_commit': selected_release.backend.release_commit,
                  'frontend_repository': selected_release.frontend.repository,
                  'frontend_tag': selected_release.frontend.tag,
                  'frontend_artifact': selected_release.frontend.artifact,
                  'frontend_sha256': selected_release.frontend.sha256,
                  'frontend_release_commit': selected_release.frontend.release_commit,
                  'developer_approval': developer_approval,
                  'approval_record': developer_approval_record,
                  'database_change': database_change_required | bool,
                  'verified_public_health': true} | to_json }}

        - name: Mark maintenance response as disabled after verification
          ansible.builtin.set_fact:
            maintenance_response_enabled: false

        - name: Mark the new-release transaction as successful
          ansible.builtin.set_fact:
            release_transaction_failed: false

      rescue:
        - name: Stop when exclusive deployment lock was not acquired
          ansible.builtin.fail:
            msg: The exclusive deployment lock is owned by another deployment.
          when: not deployment_lock_acquired | bool

        - name: Re-enable maintenance response after a failed release
          ansible.builtin.lineinfile:
            path: "{{ compose_env_file }}"
            regexp: '^GAM_MAINTENANCE_ENABLED='
            line: GAM_MAINTENANCE_ENABLED=true
          when:
            - deployment_lock_acquired | bool
            - maintenance_response_enabled | bool
            - release_changed | bool
          notify: Reload Caddy after maintenance transition

        - name: Restore normal response after preflight failure
          ansible.builtin.lineinfile:
            path: "{{ compose_env_file }}"
            regexp: '^GAM_MAINTENANCE_ENABLED='
            line: GAM_MAINTENANCE_ENABLED=false
          when:
            - deployment_lock_acquired | bool
            - maintenance_response_enabled | bool
            - not release_changed | bool
          notify: Reload Caddy after maintenance transition

        - name: Apply failed-release maintenance transition
          ansible.builtin.meta: flush_handlers
          when: deployment_lock_acquired | bool

        - name: Re-enable commissioning gate after first-launch verification failure
          ansible.builtin.lineinfile:
            path: "{{ compose_env_file }}"
            regexp: '^GAM_COMMISSIONING_ENABLED='
            line: GAM_COMMISSIONING_ENABLED=true
          when:
            - deployment_lock_acquired | bool
            - first_launch | bool
          notify: Reload Caddy after maintenance transition

        - name: Apply first-launch commissioning transition
          ansible.builtin.meta: flush_handlers
          when:
            - deployment_lock_acquired | bool
            - first_launch | bool

        - name: Record failed release result
          block:
            - name: Write failed release result
              ansible.builtin.lineinfile:
                path: "{{ release_record_file }}"
                create: true
                owner: root
                group: root
                mode: "0640"
                insertafter: EOF
                line: >-
                  {{ {'event': 'production_release', 'result': 'failed',
                      'pair': release_pair, 'release_id': release_id,
                      'backend_image': selected_release.backend.image,
                      'backend_release_commit': selected_release.backend.release_commit,
                      'frontend_repository': selected_release.frontend.repository,
                      'frontend_tag': selected_release.frontend.tag,
                      'frontend_artifact': selected_release.frontend.artifact,
                      'frontend_sha256': selected_release.frontend.sha256,
                      'frontend_release_commit': selected_release.frontend.release_commit,
                      'developer_approval': developer_approval,
                      'approval_record': developer_approval_record,
                      'database_change': database_change_required | bool,
                      'database_migration_applied': database_migration_applied | bool} | to_json }}
              register: failed_release_record_write
          rescue:
            - name: Capture failed release recording failure for terminal reporting
              ansible.builtin.set_fact:
                failed_release_record_failed: true
                failed_release_record_error: >-
                  {{ ansible_failed_result.msg | default('failed-release audit record could not be written') }}
          when: deployment_lock_acquired | bool

        - name: Stop after preflight failure before release change
          ansible.builtin.fail:
            msg: Release preflight failed before the current release changed; the previous pair remains active and no rollback was attempted.
          when:
            - deployment_lock_acquired | bool
            - not release_changed | bool

        - name: Inspect previous compatible pair for rollback
          ansible.builtin.stat:
            path: "{{ frontend_previous_link }}/release-manifest.yml"
          register: previous_release_manifest
          when: deployment_lock_acquired | bool

        - name: database-compatible application rollback
          block:
            - name: Restore previous compatible frontend release
              ansible.builtin.file:
                src: "{{ frontend_previous_link }}"
                dest: "{{ frontend_current_link }}"
                state: link
                force: true

            - name: Select the previous release override for transition handlers
              ansible.builtin.set_fact:
                rollback_current_link_switched: true
                active_release_compose_override: "{{ frontend_previous_link }}/compose.override.yml"

            - name: Roll back with the previous compatible backend digest
              ansible.builtin.command:
                argv:
                  - docker
                  - compose
                  - --env-file
                  - "{{ compose_env_file }}"
                  - -f
                  - "{{ compose_file }}"
                  - -f
                  - "{{ frontend_previous_link }}/compose.override.yml"
                  - up
                  - -d
                  - backend
                  - caddy

            - name: Disable maintenance response after compatible rollback
              ansible.builtin.lineinfile:
                path: "{{ compose_env_file }}"
                regexp: '^GAM_MAINTENANCE_ENABLED='
                line: GAM_MAINTENANCE_ENABLED=false
              notify: Reload Caddy after maintenance transition

            - name: Apply compatible rollback maintenance transition
              ansible.builtin.meta: flush_handlers

            - name: Verify compatible application rollback
              ansible.builtin.uri:
                url: "{{ gam_public_origin }}/api/health"
                method: GET
                return_content: true
                status_code: 200
                validate_certs: true
              delegate_to: localhost
              # Ansible flattens Content-Type and Cache-Control into lowercase result keys.
              failed_when: >-
                rollback_health.content != '{"status":"UP"}' or
                (rollback_health.content_type | default('') | lower) != 'application/json' or
                (rollback_health.cache_control | default('') | lower) != 'no-store'
              register: rollback_health

            - name: Mark maintenance response as disabled after compatible rollback
              ansible.builtin.set_fact:
                maintenance_response_enabled: false
          rescue:
            - name: Align active release override after rollback failure
              ansible.builtin.set_fact:
                active_release_compose_override: >-
                  {{ (rollback_current_link_switched | bool)
                     | ternary(
                         frontend_previous_link ~ '/compose.override.yml',
                         frontend_release_root ~ '/' ~ release_id ~ '/compose.override.yml'
                       ) }}

            - name: Keep maintenance response after rollback verification failure
              ansible.builtin.lineinfile:
                path: "{{ compose_env_file }}"
                regexp: '^GAM_MAINTENANCE_ENABLED='
                line: GAM_MAINTENANCE_ENABLED=true
              notify: Reload Caddy after maintenance transition

            - name: Apply rollback-failure maintenance transition
              ansible.builtin.meta: flush_handlers

            - name: Stop after compatible rollback verification failure
              ansible.builtin.fail:
                msg: Compatible application rollback did not restore the public health contract.
          when:
            - database_rollback_compatible | bool
            - deployment_lock_acquired | bool
            - release_changed | bool
            - previous_release_manifest.stat.exists | default(false)

        - name: Surface failed-release recording failure after rescue actions
          ansible.builtin.fail:
            msg: >-
              The deployment failed and compatible rescue actions completed, but the
              failed-release audit record could not be written:
              {{ failed_release_record_error }}
          when:
            - deployment_lock_acquired | bool
            - failed_release_record_failed | bool

        - name: database-incompatible failure retains maintenance response
          ansible.builtin.fail:
            msg: >-
              Release verification failed after a database-incompatible migration;
              maintenance remains enabled for a Developer-selected forward fix or
              verified backup-based recovery. No automatic database downgrade is attempted.
          when: not database_rollback_compatible | bool

        - name: Stop after an unavailable previous compatible pair
          ansible.builtin.fail:
            msg: No previous compatible pair exists for an application rollback; maintenance remains enabled.
          when:
            - deployment_lock_acquired | bool
            - database_rollback_compatible | bool
            - not (previous_release_manifest.stat.exists | default(false))

      always:
        - name: Remove deployment lock after a failed new-release transaction
          ansible.builtin.shell: |
            set -eu
            lock="{{ deployment_lock_directory }}"
            expected_token="{{ deployment_lock_owner_token | default('') }}"
            if [ ! -e "$lock" ]; then
              exit 0
            fi
            if [ -n "$expected_token" ]; then
              current_owner="$(sed -n '1p' "$lock/owner" 2>/dev/null || true)"
              if [ "$current_owner" != "owner_token=$expected_token" ]; then
                exit 0
              fi
            fi
            rm -rf -- "$lock"
          args:
            executable: /bin/sh
          changed_when: false
          when: >-
            deployment_lock_acquired | bool and release_transaction_failed | bool
      when: release_transaction_required | bool

    - name: Converge the already-active immutable release under the deployment lock
      block:
        - name: Write same-release deployment lock owner
          ansible.builtin.shell: |
            set -eu
            printf 'owner_token=%s\npid=%s release=%s\n' \
              "{{ deployment_lock_owner_token }}" "$$" "{{ release_id }}" \
              > "{{ deployment_lock_directory }}/owner"
          args:
            executable: /bin/sh
          changed_when: false

        - name: Inspect the retained same-release manifest
          ansible.builtin.stat:
            path: "{{ frontend_current_link }}/release-manifest.yml"
          register: retained_same_release_manifest

        - name: Read the retained same-release manifest
          ansible.builtin.slurp:
            src: "{{ frontend_current_link }}/release-manifest.yml"
          register: retained_same_release_manifest_content
          when: retained_same_release_manifest.stat.isreg | default(false)

        - name: Verify the retained same-release manifest selects the active pair
          ansible.builtin.assert:
            that:
              - retained_same_release_manifest.stat.isreg | default(false)
              - >-
                (retained_same_release_manifest_content.content | b64decode | from_yaml)
                == selected_release
            fail_msg: The retained release-manifest.yml does not select the already-active immutable pair.

        - name: Read the retained same-release Compose override
          ansible.builtin.slurp:
            src: "{{ frontend_current_link }}/compose.override.yml"
          register: retained_same_release_compose_override

        - name: Verify the retained Compose override selects the approved backend image
          ansible.builtin.assert:
            that:
              - >-
                (retained_same_release_compose_override.content | b64decode | from_yaml) ==
                {'services': {'backend': {'image': selected_release.backend.image}}}
            fail_msg: The retained compose.override.yml does not select the approved immutable backend image.

        - name: Read the retained frontend checksum sidecar
          ansible.builtin.slurp:
            src: "{{ frontend_current_link }}/{{ selected_release.frontend.artifact }}.sha256"
          register: retained_frontend_checksum_sidecar

        - name: Compute the retained frontend archive digest
          ansible.builtin.command:
            cmd: sha256sum "{{ frontend_current_link }}/{{ selected_release.frontend.artifact }}"
          register: retained_frontend_archive_digest
          changed_when: false
          check_mode: false

        - name: Verify the retained frontend checksum sidecar and independently computed digest
          ansible.builtin.assert:
            that:
              - >-
                (retained_frontend_checksum_sidecar.content | b64decode) ==
                (selected_release.frontend.sha256 ~ '  ' ~ selected_release.frontend.artifact ~ '\n')
              - retained_frontend_archive_digest.stdout.split()[0] == selected_release.frontend.sha256
            fail_msg: The retained frontend archive, .sha256 sidecar, and release manifest disagree.

        - name: Verify retained frontend archive structure before service restart
          ansible.builtin.shell: |
            set -eu
            archive="{{ frontend_current_link }}/{{ selected_release.frontend.artifact }}"
            entries="$(tar -tzf "$archive")"
            printf '%s\n' "$entries" | grep -Fxq 'index.html'
            if printf '%s\n' "$entries" | grep -Eq '(^/|(^|/)\.\./|^\.{1,2}$)'; then
              echo 'unsafe retained frontend archive path' >&2
              exit 1
            fi
            if tar -tvzf "$archive" | awk '$1 ~ /^[lbhcps]/ {bad=1} END {exit bad}'; then
              :
            else
              echo 'retained frontend archive contains a link, device, or pipe entry' >&2
              exit 1
            fi
          args:
            executable: /bin/sh
          changed_when: false

        - name: Verify the retained frontend tree matches the selected immutable archive
          ansible.builtin.shell: |
            set -eu
            verification_directory="$(mktemp -d)"
            trap 'rm -rf "$verification_directory"' EXIT HUP INT TERM
            tar -xzf "{{ frontend_current_link }}/{{ selected_release.frontend.artifact }}" \
              -C "$verification_directory" \
              --no-same-owner \
              --no-same-permissions
            diff -qr "{{ frontend_current_link }}/frontend" "$verification_directory"
          args:
            executable: /bin/sh
          changed_when: false

        - name: Enable maintenance before same-release runtime convergence
          ansible.builtin.copy:
            dest: "{{ compose_env_file }}"
            owner: root
            group: root
            mode: "0640"
            content: |
              GAM_PUBLIC_ORIGIN={{ gam_public_origin }}
              GAM_OPERATOR_CIDRS={{ gam_operator_cidrs | join(' ') }}
              GAM_COMMISSIONING_ENABLED={{ managed_commissioning_gate_enabled }}
              GAM_MAINTENANCE_ENABLED=true
              POSTGRES_DB=gam_api
              POSTGRES_USER=gam
          when: same_release_runtime_convergence_required | bool

        - name: Converge running services for the already-active immutable release
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --env-file
              - "{{ compose_env_file }}"
              - -f
              - "{{ compose_file }}"
              - -f
              - "{{ frontend_current_link }}/compose.override.yml"
              - up
              - -d
              - --remove-orphans
              - postgres
              - backend
              - caddy
          register: active_release_compose_convergence
          changed_when: >-
            (active_release_compose_convergence.stdout ~ '\n'
            ~ active_release_compose_convergence.stderr)
            is search('(?im)\b(created|recreated|started|pulled|built|removed)\b')
          when: same_release_runtime_convergence_required | bool

        - name: Recreate Caddy when its versioned configuration changed during replay
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --env-file
              - "{{ compose_env_file }}"
              - -f
              - "{{ compose_file }}"
              - -f
              - "{{ frontend_current_link }}/compose.override.yml"
              - up
              - -d
              - --force-recreate
              - caddy
          when:
            - same_release_runtime_convergence_required | bool
            - production_compose_configuration_install is defined
            - production_compose_configuration_install.changed | default(false) | bool

        - name: Verify the already-active immutable release during replay
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --env-file
              - "{{ compose_env_file }}"
              - -f
              - "{{ compose_file }}"
              - -f
              - "{{ frontend_current_link }}/compose.override.yml"
              - exec
              - -T
              - backend
              - /bin/sh
              - -ec
              - "{{ backend_private_health_command }}"
          changed_when: false

        - name: Disable maintenance after same-release health verification
          ansible.builtin.lineinfile:
            path: "{{ compose_env_file }}"
            regexp: '^GAM_MAINTENANCE_ENABLED='
            line: GAM_MAINTENANCE_ENABLED=false
          notify: Reload Caddy after maintenance transition

        - name: Apply successful same-release maintenance transition
          ansible.builtin.meta: flush_handlers

        - name: Verify public health after same-release maintenance transition
          ansible.builtin.uri:
            url: "{{ gam_public_origin }}/api/health"
            method: GET
            headers:
              Accept: application/json
            return_content: true
            status_code: 200
            validate_certs: true
          delegate_to: localhost
          register: active_release_public_health
          failed_when: >-
            active_release_public_health.status != 200 or
            active_release_public_health.content != '{"status":"UP"}' or
            (active_release_public_health.content_type | default('') | lower) != 'application/json' or
            (active_release_public_health.cache_control | default('') | lower) != 'no-store'

        - name: Record successful same-release convergence
          ansible.builtin.lineinfile:
            path: "{{ release_record_file }}"
            create: true
            owner: root
            group: root
            mode: "0640"
            insertafter: EOF
            line: >-
              {{ {'event': 'production_release', 'result': 'success',
                  'convergence': 'same_release', 'pair': release_pair,
                  'release_id': release_id,
                  'backend_image': selected_release.backend.image,
                  'frontend_artifact': selected_release.frontend.artifact,
                  'frontend_sha256': selected_release.frontend.sha256,
                  'developer_approval': developer_approval,
                  'approval_record': developer_approval_record,
                  'verified_public_health': true} | to_json }}

        - name: Mark the same-release transaction as successful
          ansible.builtin.set_fact:
            same_release_transaction_failed: false
      rescue:
        - name: Rebuild the approved same-release override for rescue actions
          ansible.builtin.copy:
            dest: "{{ frontend_release_root }}/{{ release_id }}/compose.override.yml"
            owner: root
            group: root
            mode: "0640"
            content: |
              services:
                backend:
                  image: {{ selected_release.backend.image }}

        - name: Select the rebuilt same-release override for rescue actions
          ansible.builtin.set_fact:
            active_release_compose_override: >-
              {{ frontend_release_root ~ '/' ~ release_id ~ '/compose.override.yml' }}

        - name: Retain maintenance after same-release convergence failure
          ansible.builtin.lineinfile:
            path: "{{ compose_env_file }}"
            regexp: '^GAM_MAINTENANCE_ENABLED='
            line: GAM_MAINTENANCE_ENABLED=true
          notify: Reload Caddy after maintenance transition

        - name: Apply failed same-release maintenance transition
          ansible.builtin.meta: flush_handlers

        - name: Record failed same-release convergence without blocking recovery
          block:
            - name: Write failed same-release convergence result
              ansible.builtin.lineinfile:
                path: "{{ release_record_file }}"
                create: true
                owner: root
                group: root
                mode: "0640"
                insertafter: EOF
                line: >-
                  {{ {'event': 'production_release', 'result': 'failed',
                      'convergence': 'same_release', 'pair': release_pair,
                      'release_id': release_id,
                      'backend_image': selected_release.backend.image,
                      'frontend_artifact': selected_release.frontend.artifact,
                      'frontend_sha256': selected_release.frontend.sha256,
                      'developer_approval': developer_approval,
                      'approval_record': developer_approval_record,
                      'database_change': database_change_required | bool} | to_json }}
          rescue:
            - name: Capture failed same-release recording failure for terminal reporting
              ansible.builtin.set_fact:
                failed_same_release_record_failed: true
                failed_same_release_record_error: >-
                  {{ ansible_failed_result.msg
                     | default('same-release audit record could not be written') }}

        - name: Inspect the previous compatible pair after same-release failure
          ansible.builtin.stat:
            path: "{{ frontend_previous_link }}/release-manifest.yml"
          register: previous_same_release_manifest

        - name: Restore the previous compatible pair after same-release failure
          block:
            - name: Read the previous release manifest before same-release rollback
              ansible.builtin.slurp:
                src: "{{ frontend_previous_link }}/release-manifest.yml"
              register: previous_same_release_manifest_content

            - name: Parse the previous release manifest before same-release rollback
              ansible.builtin.set_fact:
                previous_selected_release: >-
                  {{ previous_same_release_manifest_content.content | b64decode | from_yaml }}

            - name: Verify previous release manifest identity before same-release rollback
              ansible.builtin.assert:
                that:
                  - previous_selected_release.format_version is integer
                  - previous_selected_release.format_version == 1
                  - previous_selected_release.backend.image is match('^ghcr\\.io/[A-Za-z0-9._/-]+@sha256:[0-9a-f]{64}$')
                  - previous_selected_release.backend.digest is match('^sha256:[0-9a-f]{64}$')
                  - previous_selected_release.backend.image.split('@') | length == 2
                  - previous_selected_release.backend.image.split('@')[1] == previous_selected_release.backend.digest
                  - previous_selected_release.backend.release_commit is match('^[0-9a-f]{40}$')
                  - previous_selected_release.frontend.repository is match('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
                  - previous_selected_release.frontend.tag is match('^v[0-9]+\\.[0-9]+\\.[0-9]+$')
                  - >-
                    previous_selected_release.frontend.artifact ==
                    'gam-frontend-' ~ previous_selected_release.frontend.tag ~ '.tar.gz'
                  - previous_selected_release.frontend.sha256 is match('^[0-9a-f]{64}$')
                  - previous_selected_release.frontend.release_commit is match('^[0-9a-f]{40}$')
                  - previous_selected_release.rollback.minimum_days is integer
                  - previous_selected_release.rollback.minimum_days >= 14
                  - previous_selected_release.rollback.minimum_verified_releases is integer
                  - previous_selected_release.rollback.minimum_verified_releases >= 2
                  - previous_selected_release.rollback.retain_backend_digest is sameas true
                  - previous_selected_release.rollback.retain_frontend_archive is sameas true
                  - previous_selected_release.rollback.retain_frontend_checksum is sameas true
                  - previous_selected_release.rollback.retain_manifest is sameas true
                  - previous_selected_release.rollback.retain_fingerprinted_assets is sameas true
                fail_msg: The retained previous release-manifest.yml does not identify an immutable rollback pair.

            - name: Read the previous Compose override before same-release rollback
              ansible.builtin.slurp:
                src: "{{ frontend_previous_link }}/compose.override.yml"
              register: previous_same_release_compose_override

            - name: Verify the previous Compose override backend binding
              ansible.builtin.assert:
                that:
                  - >-
                    (previous_same_release_compose_override.content | b64decode | from_yaml) ==
                    {'services': {'backend': {'image': previous_selected_release.backend.image}}}
                fail_msg: The previous compose.override.yml does not select the retained backend image.

            - name: Read the previous frontend checksum sidecar
              ansible.builtin.slurp:
                src: >-
                  {{ frontend_previous_link }}/{{ previous_selected_release.frontend.artifact }}.sha256
              register: previous_same_release_frontend_checksum_sidecar

            - name: Compute the previous frontend archive digest independently
              ansible.builtin.command:
                cmd: >-
                  sha256sum "{{ frontend_previous_link }}/{{ previous_selected_release.frontend.artifact }}"
              register: previous_same_release_frontend_archive_digest
              changed_when: false
              check_mode: false

            - name: Verify the previous frontend checksum sidecar and archive digest
              ansible.builtin.assert:
                that:
                  - >-
                    (previous_same_release_frontend_checksum_sidecar.content | b64decode) ==
                    (previous_selected_release.frontend.sha256 ~ '  ' ~
                    previous_selected_release.frontend.artifact ~ '\n')
                  - >-
                    previous_same_release_frontend_archive_digest.stdout.split()[0] ==
                    previous_selected_release.frontend.sha256
                fail_msg: The retained previous archive, .sha256 sidecar, and release manifest disagree.

            - name: Verify previous frontend archive safety before same-release rollback
              ansible.builtin.shell: |
                set -eu
                archive="{{ frontend_previous_link }}/{{ previous_selected_release.frontend.artifact }}"
                entries="$(tar -tzf "$archive")"
                printf '%s\n' "$entries" | grep -Fxq 'index.html'
                if printf '%s\n' "$entries" | grep -Eq '(^/|(^|/)\.\./|^\.{1,2}$)'; then
                  echo 'unsafe previous frontend archive path' >&2
                  exit 1
                fi
                if tar -tvzf "$archive" | awk '$1 ~ /^[lbhcps]/ {bad=1} END {exit bad}'; then
                  :
                else
                  echo 'previous frontend archive contains a link, device, or pipe entry' >&2
                  exit 1
                fi
              args:
                executable: /bin/sh
              changed_when: false

            - name: Verify the previous frontend tree matches its immutable archive
              ansible.builtin.shell: |
                set -eu
                verification_directory="$(mktemp -d)"
                trap 'rm -rf "$verification_directory"' EXIT HUP INT TERM
                tar -xzf "{{ frontend_previous_link }}/{{ previous_selected_release.frontend.artifact }}" \
                  -C "$verification_directory" \
                  --no-same-owner \
                  --no-same-permissions
                diff -qr "{{ frontend_previous_link }}/frontend" "$verification_directory"
              args:
                executable: /bin/sh
              changed_when: false

            - name: Select previous compatible override after same-release failure
              ansible.builtin.set_fact:
                active_release_compose_override: "{{ frontend_previous_link }}/compose.override.yml"

            - name: Restore previous compatible frontend link after same-release failure
              ansible.builtin.file:
                src: "{{ frontend_previous_link }}"
                dest: "{{ frontend_current_link }}"
                state: link
                force: true

            - name: Restart the previous compatible pair after same-release failure
              ansible.builtin.command:
                argv:
                  - docker
                  - compose
                  - --env-file
                  - "{{ compose_env_file }}"
                  - -f
                  - "{{ compose_file }}"
                  - -f
                  - "{{ frontend_previous_link }}/compose.override.yml"
                  - up
                  - -d
                  - backend
                  - caddy

            - name: Disable maintenance after same-release compatible rollback
              ansible.builtin.lineinfile:
                path: "{{ compose_env_file }}"
                regexp: '^GAM_MAINTENANCE_ENABLED='
                line: GAM_MAINTENANCE_ENABLED=false
              notify: Reload Caddy after maintenance transition

            - name: Apply same-release compatible rollback transition
              ansible.builtin.meta: flush_handlers

            - name: Verify public health after same-release compatible rollback
              ansible.builtin.uri:
                url: "{{ gam_public_origin }}/api/health"
                method: GET
                headers:
                  Accept: application/json
                return_content: true
                status_code: 200
                validate_certs: true
              delegate_to: localhost
              register: same_release_rollback_health
              failed_when: >-
                same_release_rollback_health.status != 200 or
                same_release_rollback_health.content != '{"status":"UP"}' or
                (same_release_rollback_health.content_type | default('') | lower) != 'application/json' or
                (same_release_rollback_health.cache_control | default('') | lower) != 'no-store'
          rescue:
            - name: Re-enable maintenance after failed same-release compatible rollback
              ansible.builtin.lineinfile:
                path: "{{ compose_env_file }}"
                regexp: '^GAM_MAINTENANCE_ENABLED='
                line: GAM_MAINTENANCE_ENABLED=true
              notify: Reload Caddy after maintenance transition

            - name: Apply maintenance after failed same-release compatible rollback
              ansible.builtin.meta: flush_handlers

            - name: Stop after failed same-release compatible rollback
              ansible.builtin.fail:
                msg: >-
                  The previous compatible pair did not restore the public health contract;
                  maintenance remains enabled for Developer-directed recovery.
          when:
            - database_rollback_compatible | bool
            - previous_same_release_manifest.stat.isreg | default(false)

        - name: Stop after locked same-release convergence failure
          ansible.builtin.fail:
            msg: >-
              The already-active immutable release did not converge under the exclusive deployment lock;
              a compatible previous pair was restored when one was available, otherwise maintenance remains enabled.
              {{ ('The failed-result audit record also could not be written: '
                  ~ failed_same_release_record_error)
                 if failed_same_release_record_failed | bool else '' }}
      always:
        - name: Remove deployment lock after a failed same-release transaction
          ansible.builtin.shell: |
            set -eu
            lock="{{ deployment_lock_directory }}"
            expected_token="{{ deployment_lock_owner_token | default('') }}"
            if [ ! -e "$lock" ]; then
              exit 0
            fi
            if [ -n "$expected_token" ]; then
              current_owner="$(sed -n '1p' "$lock/owner" 2>/dev/null || true)"
              if [ "$current_owner" != "owner_token=$expected_token" ]; then
                exit 0
              fi
            fi
            rm -rf -- "$lock"
          args:
            executable: /bin/sh
          changed_when: false
          when: >-
            deployment_lock_acquired | bool and same_release_transaction_failed | bool
      when: not release_transaction_required | bool

  handlers:
    - name: Reload Caddy after maintenance transition
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --env-file
          - "{{ compose_env_file }}"
          - -f
          - "{{ compose_file }}"
          - -f
          - "{{ active_release_compose_override }}"
          - up
          - -d
          - --force-recreate
          - caddy
