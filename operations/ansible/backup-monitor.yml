---
- name: Require external AWS monitor inputs
  ansible.builtin.assert:
    that:
      - developer_backup_alert_topic_arn | length > 0
      - client_custodian_backup_alert_topic_arn | length > 0
      - backup_monitor_lambda_role_name | length > 0
      - backup_monitor_scheduler_role_name | length > 0

- name: Create external state table for unresolved monitor failures
  ansible.builtin.command:
    argv:
      - aws
      - dynamodb
      - describe-table
      - --table-name
      - gam-production-backup-monitor-state
      - --region
      - "{{ aws_region }}"
  register: monitor_state_probe
  changed_when: false
  failed_when: false

- name: Create external state table for unresolved monitor failures when absent
  ansible.builtin.command:
    argv:
      - aws
      - dynamodb
      - create-table
      - --table-name
      - gam-production-backup-monitor-state
      - --attribute-definitions
      - AttributeName=id,AttributeType=S
      - --key-schema
      - AttributeName=id,KeyType=HASH
      - --billing-mode
      - PAY_PER_REQUEST
      - --tags
      - Key=Project,Value=GAM
      - Key=Environment,Value=production
      - Key=Purpose,Value=backup-monitor
      - --region
      - "{{ aws_region }}"
  when: monitor_state_probe.rc != 0

- name: Render reproducible monitor machine-role policies
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/tmp/{{ item.dest }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - src: templates/monitor-lambda-trust-policy.json.j2
      dest: gam-monitor-lambda-trust-policy.json
    - src: templates/monitor-scheduler-trust-policy.json.j2
      dest: gam-monitor-scheduler-trust-policy.json
    - src: templates/monitor-lambda-policy.json.j2
      dest: gam-monitor-lambda-policy.json
    - src: templates/monitor-scheduler-policy.json.j2
      dest: gam-monitor-scheduler-policy.json

- name: Inspect the reproducible Lambda monitor role
  ansible.builtin.command:
    argv:
      - aws
      - iam
      - get-role
      - --role-name
      - "{{ backup_monitor_lambda_role_name }}"
  register: monitor_lambda_role_probe
  changed_when: false
  failed_when: false

- name: Create the Lambda monitor machine role when absent
  ansible.builtin.command:
    argv:
      - aws
      - iam
      - create-role
      - --role-name
      - "{{ backup_monitor_lambda_role_name }}"
      - --assume-role-policy-document
      - file:///tmp/gam-monitor-lambda-trust-policy.json
      - --tags
      - Key=Project,Value=GAM
      - Key=Environment,Value=production
      - Key=Purpose,Value=backup-monitor
  when: monitor_lambda_role_probe.rc != 0
  register: monitor_lambda_role_create
  changed_when: monitor_lambda_role_create.rc == 0

- name: Inspect the reproducible Scheduler monitor role
  ansible.builtin.command:
    argv:
      - aws
      - iam
      - get-role
      - --role-name
      - "{{ backup_monitor_scheduler_role_name }}"
  register: monitor_scheduler_role_probe
  changed_when: false
  failed_when: false

- name: Create the Scheduler monitor machine role when absent
  ansible.builtin.command:
    argv:
      - aws
      - iam
      - create-role
      - --role-name
      - "{{ backup_monitor_scheduler_role_name }}"
      - --assume-role-policy-document
      - file:///tmp/gam-monitor-scheduler-trust-policy.json
      - --tags
      - Key=Project,Value=GAM
      - Key=Environment,Value=production
      - Key=Purpose,Value=backup-monitor
  when: monitor_scheduler_role_probe.rc != 0
  register: monitor_scheduler_role_create
  changed_when: monitor_scheduler_role_create.rc == 0

- name: Attach the Lambda monitor machine policy
  ansible.builtin.command:
    argv:
      - aws
      - iam
      - put-role-policy
      - --role-name
      - "{{ backup_monitor_lambda_role_name }}"
      - --policy-name
      - gam-production-backup-monitor-lambda-policy
      - --policy-document
      - file:///tmp/gam-monitor-lambda-policy.json

- name: Attach the Scheduler monitor machine policy
  ansible.builtin.command:
    argv:
      - aws
      - iam
      - put-role-policy
      - --role-name
      - "{{ backup_monitor_scheduler_role_name }}"
      - --policy-name
      - gam-production-backup-monitor-scheduler-policy
      - --policy-document
      - file:///tmp/gam-monitor-scheduler-policy.json

- name: Render independent AWS monitor code
  ansible.builtin.copy:
    src: backup_monitor.py
    dest: /tmp/gam_backup_monitor.py
    mode: "0600"

- name: Package independent AWS monitor code
  community.general.archive:
    path: /tmp/gam_backup_monitor.py
    dest: /tmp/gam-backup-monitor.zip
    format: zip

- name: Inspect the independent Lambda function
  ansible.builtin.command:
    argv:
      - aws
      - lambda
      - get-function
      - --function-name
      - gam-production-backup-monitor
      - --region
      - "{{ aws_region }}"
  register: monitor_function_probe
  changed_when: false
  failed_when: false

- name: Create the independent Lambda function when absent
  ansible.builtin.command:
    argv:
      - aws
      - lambda
      - create-function
      - --function-name
      - gam-production-backup-monitor
      - --runtime
      - python3.12
      - --role
      - "{{ backup_monitor_lambda_role_arn }}"
      - --handler
      - gam_backup_monitor.lambda_handler
      - --code
      - ZipFile=fileb:///tmp/gam-backup-monitor.zip
      - --timeout
      - "30"
      - --tags
      - Project=GAM,Environment=production,Purpose=backup-monitor
      - --region
      - "{{ aws_region }}"
  when: monitor_function_probe.rc != 0

- name: Publish Lambda code for object metadata validation
  ansible.builtin.command:
    argv:
      - aws
      - lambda
      - update-function-code
      - --function-name
      - gam-production-backup-monitor
      - --zip-file
      - fileb:///tmp/gam-backup-monitor.zip
      - --region
      - "{{ aws_region }}"
  register: monitor_update
  changed_when: monitor_update.rc == 0
  failed_when: monitor_update.rc != 0

- name: Configure the independent Lambda environment
  ansible.builtin.command:
    argv:
      - aws
      - lambda
      - update-function-configuration
      - --function-name
      - gam-production-backup-monitor
      - --role
      - "{{ backup_monitor_lambda_role_arn }}"
      - --handler
      - gam_backup_monitor.lambda_handler
      - --runtime
      - python3.12
      - --timeout
      - "30"
      - --environment
      - "Variables={BACKUP_BUCKET={{ backup_bucket_name }},BACKUP_PREFIX={{ backup_prefix }},BACKUP_MONITOR_STATE_TABLE=gam-production-backup-monitor-state,AWS_REGION={{ aws_region }},BACKUP_TIMEZONE=America/Sao_Paulo,DEVELOPER_ALERT_TOPIC_ARN={{ developer_backup_alert_topic_arn }},CLIENT_CUSTODIAN_ALERT_TOPIC_ARN={{ client_custodian_backup_alert_topic_arn }}}"
      - --region
      - "{{ aws_region }}"

- name: Create daily EventBridge validation schedule at 04:30 America/Sao_Paulo
  ansible.builtin.command:
    argv:
      - aws
      - scheduler
      - create-schedule
      - --name
      - gam-production-backup-monitor-0430
      - --schedule-expression
      - "cron(30 4 * * ? *)"
      - --schedule-expression-timezone
      - America/Sao_Paulo
      - --flexible-time-window
      - Mode=OFF
      - --state
      - ENABLED
      - --description
      - "Project=GAM; Environment=production; Purpose=backup-monitor; daily validation"
      - --target
      - '{"Arn":"{{ backup_monitor_lambda_arn }}","RoleArn":"{{ backup_monitor_scheduler_role_arn }}","RetryPolicy":{"MaximumEventAgeInSeconds":86400,"MaximumRetryAttempts":3},"Input":"{\"phase\":\"daily\"}"}'
      - --region
      - "{{ aws_region }}"
  register: daily_schedule
  changed_when: daily_schedule.rc == 0
  failed_when: daily_schedule.rc != 0 and 'ConflictException' not in (daily_schedule.stderr | default(''))

- name: Create unresolved EventBridge escalation schedule at 12:00 America/Sao_Paulo
  ansible.builtin.command:
    argv:
      - aws
      - scheduler
      - create-schedule
      - --name
      - gam-production-backup-monitor-1200
      - --schedule-expression
      - "cron(0 12 * * ? *)"
      - --schedule-expression-timezone
      - America/Sao_Paulo
      - --flexible-time-window
      - Mode=OFF
      - --state
      - ENABLED
      - --description
      - "Project=GAM; Environment=production; Purpose=backup-monitor; unresolved escalation"
      - --target
      - '{"Arn":"{{ backup_monitor_lambda_arn }}","RoleArn":"{{ backup_monitor_scheduler_role_arn }}","RetryPolicy":{"MaximumEventAgeInSeconds":86400,"MaximumRetryAttempts":3},"Input":"{\"phase\":\"unresolved\"}"}'
      - --region
      - "{{ aws_region }}"
  register: escalation_schedule
  changed_when: escalation_schedule.rc == 0
  failed_when: escalation_schedule.rc != 0 and 'ConflictException' not in (escalation_schedule.stderr | default(''))

- name: Validate the daily monitor schedule remains ENABLED
  ansible.builtin.command:
    argv:
      - aws
      - scheduler
      - get-schedule
      - --name
      - gam-production-backup-monitor-0430
      - --output
      - json
      - --region
      - "{{ aws_region }}"
  register: daily_schedule_state
  changed_when: false
  failed_when: daily_schedule_state.rc != 0

- name: Validate the unresolved monitor schedule remains ENABLED
  ansible.builtin.command:
    argv:
      - aws
      - scheduler
      - get-schedule
      - --name
      - gam-production-backup-monitor-1200
      - --output
      - json
      - --region
      - "{{ aws_region }}"
  register: escalation_schedule_state
  changed_when: false
  failed_when: escalation_schedule_state.rc != 0

- name: Reconcile drifted daily monitor schedule configuration
  ansible.builtin.command:
    argv:
      - aws
      - scheduler
      - update-schedule
      - --name
      - gam-production-backup-monitor-0430
      - --schedule-expression
      - "cron(30 4 * * ? *)"
      - --schedule-expression-timezone
      - America/Sao_Paulo
      - --flexible-time-window
      - Mode=OFF
      - --state
      - ENABLED
      - --target
      - '{"Arn":"{{ backup_monitor_lambda_arn }}","RoleArn":"{{ backup_monitor_scheduler_role_arn }}","RetryPolicy":{"MaximumEventAgeInSeconds":86400,"MaximumRetryAttempts":3},"Input":"{\"phase\":\"daily\"}"}'
      - --region
      - "{{ aws_region }}"
  when:
    - daily_schedule_state.rc == 0
    - >-
      (daily_schedule_state.stdout | from_json).ScheduleExpression != 'cron(30 4 * * ? *)'
      or (daily_schedule_state.stdout | from_json).ScheduleExpressionTimezone != 'America/Sao_Paulo'
      or (daily_schedule_state.stdout | from_json).State != 'ENABLED'
      or (daily_schedule_state.stdout | from_json).Target.Arn != backup_monitor_lambda_arn
      or (daily_schedule_state.stdout | from_json).Target.Input != '{"phase":"daily"}'
      or (daily_schedule_state.stdout | from_json).Target.RetryPolicy.MaximumEventAgeInSeconds != 86400
      or (daily_schedule_state.stdout | from_json).Target.RetryPolicy.MaximumRetryAttempts != 3
  register: daily_schedule_reconciliation
  changed_when: daily_schedule_reconciliation.rc == 0
  failed_when: daily_schedule_reconciliation.rc != 0

- name: Reconcile drifted unresolved monitor schedule configuration
  ansible.builtin.command:
    argv:
      - aws
      - scheduler
      - update-schedule
      - --name
      - gam-production-backup-monitor-1200
      - --schedule-expression
      - "cron(0 12 * * ? *)"
      - --schedule-expression-timezone
      - America/Sao_Paulo
      - --flexible-time-window
      - Mode=OFF
      - --state
      - ENABLED
      - --target
      - '{"Arn":"{{ backup_monitor_lambda_arn }}","RoleArn":"{{ backup_monitor_scheduler_role_arn }}","RetryPolicy":{"MaximumEventAgeInSeconds":86400,"MaximumRetryAttempts":3},"Input":"{\"phase\":\"unresolved\"}"}'
      - --region
      - "{{ aws_region }}"
  when:
    - escalation_schedule_state.rc == 0
    - >-
      (escalation_schedule_state.stdout | from_json).ScheduleExpression != 'cron(0 12 * * ? *)'
      or (escalation_schedule_state.stdout | from_json).ScheduleExpressionTimezone != 'America/Sao_Paulo'
      or (escalation_schedule_state.stdout | from_json).State != 'ENABLED'
      or (escalation_schedule_state.stdout | from_json).Target.Arn != backup_monitor_lambda_arn
      or (escalation_schedule_state.stdout | from_json).Target.Input != '{"phase":"unresolved"}'
      or (escalation_schedule_state.stdout | from_json).Target.RetryPolicy.MaximumEventAgeInSeconds != 86400
      or (escalation_schedule_state.stdout | from_json).Target.RetryPolicy.MaximumRetryAttempts != 3
  register: escalation_schedule_reconciliation
  changed_when: escalation_schedule_reconciliation.rc == 0
  failed_when: escalation_schedule_reconciliation.rc != 0

- name: Validate the independent monitor Lambda machine role
  ansible.builtin.command:
    argv:
      - aws
      - iam
      - get-role
      - --role-name
      - "{{ backup_monitor_lambda_role_name }}"
  register: monitor_lambda_role_probe
  changed_when: false
  failed_when: >-
    monitor_lambda_role_probe.rc != 0 or
    (monitor_lambda_role_probe.stdout | from_json).Role.Arn !=
    backup_monitor_lambda_role_arn

- name: Validate the EventBridge scheduler machine role
  ansible.builtin.command:
    argv:
      - aws
      - iam
      - get-role
      - --role-name
      - "{{ backup_monitor_scheduler_role_name }}"
  register: monitor_scheduler_role_probe
  changed_when: false
  failed_when: >-
    monitor_scheduler_role_probe.rc != 0 or
    (monitor_scheduler_role_probe.stdout | from_json).Role.Arn !=
    backup_monitor_scheduler_role_arn

- name: Simulate the Lambda monitor machine-role policy actions
  ansible.builtin.shell: >-
    set -o errexit;
    aws iam simulate-principal-policy
    --policy-source-arn "{{ backup_monitor_lambda_role_arn }}"
    --action-names
    logs:CreateLogGroup logs:CreateLogStream logs:PutLogEvents
    dynamodb:GetItem dynamodb:PutItem dynamodb:DeleteItem
    s3:ListBucket s3:GetObject s3:GetObjectAttributes
    s3:GetObjectTagging s3:GetLifecycleConfiguration
    sns:Publish;
    : GAM_BACKUP_MONITOR_LAMBDA_ROLE_ARN
  register: monitor_lambda_policy_simulation
  changed_when: false
  failed_when: >-
    monitor_lambda_policy_simulation.rc != 0 or
    ((monitor_lambda_policy_simulation.stdout | from_json).EvaluationResults
    | selectattr('EvalDecision', 'ne', 'allowed') | list | length > 0)

- name: Simulate the scheduler machine-role policy actions
  ansible.builtin.shell: >-
    set -o errexit;
    aws iam simulate-principal-policy
    --policy-source-arn "{{ backup_monitor_scheduler_role_arn }}"
    --action-names lambda:InvokeFunction;
    : GAM_BACKUP_MONITOR_SCHEDULER_ROLE_ARN
  register: monitor_scheduler_policy_simulation
  changed_when: false
  failed_when: >-
    monitor_scheduler_policy_simulation.rc != 0 or
    ((monitor_scheduler_policy_simulation.stdout | from_json).EvaluationResults
    | selectattr('EvalDecision', 'ne', 'allowed') | list | length > 0)

- name: Apply scheduler cost allocation tags to the daily check
  ansible.builtin.command:
    argv:
      - aws
      - scheduler
      - tag-resource
      - --resource-arn
      - "arn:aws:scheduler:{{ aws_region }}:{{ aws_account_id }}:schedule/default/gam-production-backup-monitor-0430"
      - --tags
      - Key=Project,Value=GAM
      - Key=Environment,Value=production
      - Key=Purpose,Value=backup-monitor
  changed_when: true

- name: Apply scheduler cost allocation tags to the unresolved check
  ansible.builtin.command:
    argv:
      - aws
      - scheduler
      - tag-resource
      - --resource-arn
      - "arn:aws:scheduler:{{ aws_region }}:{{ aws_account_id }}:schedule/default/gam-production-backup-monitor-1200"
      - --tags
      - Key=Project,Value=GAM
      - Key=Environment,Value=production
      - Key=Purpose,Value=backup-monitor
  changed_when: true

- name: Alarm when the independent monitor itself fails
  ansible.builtin.command:
    argv:
      - aws
      - cloudwatch
      - put-metric-alarm
      - --alarm-name
      - gam-production-backup-monitor-failure
      - --namespace
      - AWS/Lambda
      - --metric-name
      - Errors
      - --dimensions
      - Name=FunctionName,Value=gam-production-backup-monitor
      - --statistic
      - Sum
      - --period
      - "300"
      - --evaluation-periods
      - "1"
      - --threshold
      - "1"
      - --comparison-operator
      - GreaterThanOrEqualToThreshold
      - --alarm-actions
      - "{{ developer_backup_alert_topic_arn }}"
      - --region
      - "{{ aws_region }}"

- name: Alarm when the monitor has zero successful invocations
  ansible.builtin.command:
    argv:
      - aws
      - cloudwatch
      - put-metric-alarm
      - --alarm-name
      - gam-production-backup-monitor-zero-invocations
      - --namespace
      - AWS/Lambda
      - --metric-name
      - Invocations
      - --dimensions
      - Name=FunctionName,Value=gam-production-backup-monitor
      - --statistic
      - Sum
      - --period
      # 12:00 to the next day's 04:30 invocation is the longest normal gap.
      - "59400"
      - --evaluation-periods
      - "1"
      - --threshold
      - "1"
      - --comparison-operator
      - LessThanThreshold
      - --treat-missing-data
      - breaching
      - --alarm-actions
      - "{{ developer_backup_alert_topic_arn }}"
      - --region
      - "{{ aws_region }}"

- name: Alarm when scheduler permission failures occur
  ansible.builtin.command:
    argv:
      - aws
      - cloudwatch
      - put-metric-alarm
      - --alarm-name
      - gam-production-backup-monitor-permission-failure
      - --namespace
      - AWS/Scheduler
      - --metric-name
      - TargetErrorCount
      - --dimensions
      - Name=ScheduleGroup,Value=default
      - --statistic
      - Sum
      - --period
      - "300"
      - --evaluation-periods
      - "1"
      - --threshold
      - "1"
      - --comparison-operator
      - GreaterThanOrEqualToThreshold
      - --alarm-actions
      - "{{ developer_backup_alert_topic_arn }}"
      - --region
      - "{{ aws_region }}"
