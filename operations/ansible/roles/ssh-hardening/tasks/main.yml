---
- name: Ensure the SSH server is installed
  ansible.builtin.apt:
    name: openssh-server
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install the restricted SSH configuration
  ansible.builtin.copy:
    dest: "{{ ssh_hardening_config_path }}"
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by the GAM Ubuntu 24.04 host baseline.
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      AllowUsers {{ operations_user_name }}
      X11Forwarding no
      AllowTcpForwarding no
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH service

- name: Require the active SSH connection context
  ansible.builtin.assert:
    that:
      - ansible_env.SSH_CONNECTION is defined
      - ansible_env.SSH_CONNECTION.split() | length >= 4
    fail_msg: The active SSH client address is required to evaluate conditional sshd configuration.

- name: Record the active SSH client address
  ansible.builtin.set_fact:
    ssh_hardening_connection_address: "{{ ansible_env.SSH_CONNECTION.split() | first }}"

- name: Read the effective merged SSH server configuration for gamops
  ansible.builtin.command: >-
    /usr/sbin/sshd -T -C user={{ operations_user_name }},host={{ ssh_hardening_connection_address }},addr={{ ssh_hardening_connection_address }}
  register: ssh_hardening_effective_configuration
  changed_when: false

- name: Verify the effective restricted SSH configuration
  ansible.builtin.assert:
    that:
      - "ssh_hardening_effective_configuration.stdout is search('(?m)^permitrootlogin no$')"
      - "ssh_hardening_effective_configuration.stdout is search('(?m)^passwordauthentication no$')"
      - "ssh_hardening_effective_configuration.stdout is search('(?m)^kbdinteractiveauthentication no$')"
      - "ssh_hardening_effective_configuration.stdout is search('(?m)^pubkeyauthentication yes$')"
      - ssh_hardening_effective_configuration.stdout is search('(?m)^allowusers\\s+' ~ (operations_user_name | regex_escape) ~ '$')
    fail_msg: The effective merged SSH configuration does not enforce the restricted operations path.
