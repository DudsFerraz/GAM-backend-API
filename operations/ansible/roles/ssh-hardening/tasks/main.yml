---
- name: Ensure the SSH server is installed
  ansible.builtin.apt:
    name: openssh-server
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install the restricted SSH configuration
  ansible.builtin.copy:
    dest: "{{ ssh_hardening_config_path }}"
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by the GAM Ubuntu 24.04 host baseline.
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      AllowUsers {{ operations_user_name }}
      X11Forwarding no
      AllowTcpForwarding no
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH service
