---
- import_playbook: playbooks/production-host-baseline.yml

- name: Provision AWS recovery resources and independent backup monitoring
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - group_vars/production.yml
  tasks:
    - name: Apply the AWS backup bucket, audit, and cost governance contract
      ansible.builtin.include_tasks: aws-resources.yml

    - name: Require nonempty machine writer credentials before production activation
      ansible.builtin.assert:
        that:
          - >-
            (backup_writer_access_key is defined
            and backup_writer_access_key is not skipped
            and (backup_writer_access_key.stdout | from_json).AccessKey.AccessKeyId | default('') | length > 0)
            or lookup('env', 'GAM_BACKUP_ACCESS_KEY_ID') | length > 0
          - >-
            (backup_writer_access_key is defined
            and backup_writer_access_key is not skipped
            and (backup_writer_access_key.stdout | from_json).AccessKey.SecretAccessKey | default('') | length > 0)
            or lookup('env', 'GAM_BACKUP_SECRET_ACCESS_KEY') | length > 0
        fail_msg: >-
          GAM_BACKUP_ACCESS_KEY_ID and GAM_BACKUP_SECRET_ACCESS_KEY must be
          nonempty after the machine writer bootstrap before activation.

    - name: Apply the AWS EventBridge and Lambda backup monitor contract
      ansible.builtin.include_tasks: backup-monitor.yml

- name: Provision GAM production backup, recovery, AWS, and monitoring behavior
  hosts: production
  become: true
  vars_files:
    - group_vars/production.yml
  pre_tasks:
    - name: Default the protected PostgreSQL target credential-state path
      ansible.builtin.set_fact:
        better_stack_postgresql_target_credentials_fingerprint_file: >-
          {{ ansible_user_dir | default(lookup('env', 'HOME'), true)
          }}/.local/state/gam/better-stack/postgresql-target-credentials.sha256
      when: better_stack_postgresql_target_credentials_fingerprint_file is not defined
      no_log: true

    - name: Require parameterized deployment inputs
      ansible.builtin.assert:
        that:
          - aws_account_id | length > 0
          - vps_public_source_ip | length > 0
          - production_origin | length > 0
          - developer_age_recipient | length > 0
          - client_age_recipient | length > 0
          - better_stack_api_url | length > 0
          - better_stack_api_token | length > 0
          - better_stack_collector_install_url | length > 0
          - better_stack_collector_install_checksum | length > 0
          - better_stack_proxy_target_host | length > 0
          - better_stack_proxy_target_service | length > 0
          - better_stack_proxy_target_endpoint | length > 0
          - better_stack_backend_target_host | length > 0
          - better_stack_backend_target_service | length > 0
          - better_stack_backend_target_endpoint | length > 0
          - better_stack_postgresql_target_host | length > 0
          - better_stack_postgresql_target_port | int > 0
          - better_stack_postgresql_target_username | length > 0
          - better_stack_postgresql_target_password | length > 0
          - postgres_tls_certificate_source_file | length > 0
          - postgres_tls_private_key_source_file | length > 0
        fail_msg: >-
          AWS account, VPS public source IP, production origin, and both public
          encryption recipients, Better Stack API token, service target
          connection inputs, PostgreSQL TLS certificate and key, and the
          verified vendor installer source must be supplied outside version
          control.
      no_log: true

    - name: Install production recovery dependencies
      ansible.builtin.package:
        name:
          - age
          - awscli
          - jq
          - openssl
          - postgresql-client-18
        state: present

  tasks:
    - name: Create the restricted PostgreSQL TLS directory
      ansible.builtin.file:
        path: "{{ postgres_tls_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Install the PostgreSQL TLS certificate from external custody
      ansible.builtin.copy:
        src: "{{ postgres_tls_certificate_source_file }}"
        dest: "{{ postgres_tls_directory }}/server.crt"
        owner: root
        group: root
        mode: "0644"
      no_log: true

    - name: Install the PostgreSQL TLS private key from external custody
      ansible.builtin.copy:
        src: "{{ postgres_tls_private_key_source_file }}"
        dest: "{{ postgres_tls_directory }}/server.key"
        owner: root
        group: "{{ postgres_container_group_id }}"
        mode: "0640"
      no_log: true

    - name: Read the PostgreSQL certificate public key
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ postgres_tls_directory }}/server.crt"
          - -pubkey
          - -noout
          - -checkend
          - "0"
      register: postgres_tls_certificate_public_key
      changed_when: false
      no_log: true

    - name: Read the PostgreSQL private key public component
      ansible.builtin.command:
        argv:
          - openssl
          - pkey
          - -in
          - "{{ postgres_tls_directory }}/server.key"
          - -pubout
      register: postgres_tls_private_key_public_key
      changed_when: false
      no_log: true

    - name: Verify the PostgreSQL TLS certificate and private key match
      ansible.builtin.assert:
        that:
          - >-
            postgres_tls_certificate_public_key.stdout | trim
            == postgres_tls_private_key_public_key.stdout | trim
        fail_msg: The PostgreSQL TLS certificate and private key do not match.
      no_log: true

    - name: Create the machine backup service group on a clean host
      ansible.builtin.group:
        name: "{{ backup_service_group }}"
        system: true

    - name: Create the non-login machine backup service user on a clean host
      ansible.builtin.user:
        name: "{{ backup_service_user }}"
        group: "{{ backup_service_group }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create backup runtime directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default(backup_service_user) }}"
        group: "{{ item.group | default(backup_service_group) }}"
        mode: "{{ item.mode | default('0700') }}"
      loop:
        - path: "{{ backup_state_directory }}"
        - path: "{{ backup_runtime_directory }}"
        - path: /etc/gam
          owner: root
          group: root
          mode: "0750"

    - name: Install backup environment inputs
      ansible.builtin.template:
        src: templates/backup.env.j2
        dest: "{{ backup_environment_file }}"
        owner: root
        group: "{{ backup_service_group }}"
        mode: "0640"

    - name: Install restricted machine backup-writer credentials
      ansible.builtin.template:
        src: templates/backup-writer.credentials.j2
        dest: "{{ backup_writer_credentials_file }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when:
        - lookup('env', 'GAM_BACKUP_ACCESS_KEY_ID') | length > 0
        - lookup('env', 'GAM_BACKUP_SECRET_ACCESS_KEY') | length > 0

    - name: Install versioned backup and restoration procedures
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0750"
      loop:
        - src: ../recovery/backup/backup.sh
          dest: /usr/local/libexec/gam-backup
        - src: ../recovery/restore/restore.sh
          dest: /usr/local/libexec/gam-restore
        - src: ../recovery/verify-restoration/verify-restoration.sh
          dest: /usr/local/libexec/gam-verify-restoration

    - name: Install persistent daily backup timer
      ansible.builtin.template:
        src: templates/gam-backup.service.j2
        dest: /etc/systemd/system/gam-backup.service
        owner: root
        group: root
        mode: "0644"

    - name: Install persistent daily backup schedule
      ansible.builtin.template:
        src: templates/gam-backup.timer.j2
        dest: /etc/systemd/system/gam-backup.timer
        owner: root
        group: root
        mode: "0644"

    - name: Enable daily backup schedule with reboot catch-up
      ansible.builtin.systemd:
        name: gam-backup.timer
        daemon_reload: true
        enabled: true
        state: started

    - name: Install the Better Stack metrics-only verification contract
      ansible.builtin.template:
        src: templates/better-stack-monitoring.yml.j2
        dest: /etc/gam/better-stack-monitoring-contract.yml
        owner: root
        group: root
        mode: "0600"

    - name: Discover Better Stack collectors by stable provider name
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors?name={{ better_stack_collector_name | urlencode }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      register: better_stack_existing_collectors
      no_log: true

    - name: Read remaining pages from filtered Better Stack collector discovery
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors?name={{ better_stack_collector_name | urlencode }}&page={{ item }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop: >-
        {{ range(2, (
        better_stack_existing_collectors.json.pagination.last
        | default('page=1', true) | string
        | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)')
        | first | default('1', true) | int) + 1) | list }}
      register: better_stack_existing_collector_pages
      no_log: true

    - name: Merge every filtered Better Stack collector discovery page
      ansible.builtin.set_fact:
        better_stack_existing_collectors:
          json:
            data: >-
              {{ ([better_stack_existing_collectors.json.data | default([])]
              + (better_stack_existing_collector_pages.results | default([])
              | map(attribute='json.data') | list)) | flatten | list }}
      no_log: true

    - name: Create the Better Stack production metrics collector
      ansible.builtin.uri:
        url: "{# production default: https://telemetry.betterstack.com/api/v1/collectors #}{{ better_stack_telemetry_api_url }}/api/v1/collectors"
        method: POST
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          name: "{{ better_stack_collector_name }}"
          platform: docker
          configuration:
            components:
              logs_docker: false
              logs_host: false
              logs_kubernetes: false
              logs_collector_internals: false
              ebpf_tracing_basic: false
              ebpf_tracing_full: false
              traces_opentelemetry: false
              ebpf_metrics: true
              ebpf_red_metrics: true
              metrics_databases: true
        status_code: [201]
        return_content: true
      register: better_stack_collector_created
      when: >-
        not (better_stack_existing_collectors.json.data | default([])
        | selectattr('attributes.name', 'equalto', better_stack_collector_name)
        | list)
      no_log: true

    - name: Stop new collector commissioning for approved external secret custody
      ansible.builtin.fail:
        msg: >-
          Better Stack created the production collector. Transfer its generated
          secret into approved external custody as BETTER_STACK_COLLECTOR_SECRET,
          then rerun this playbook before Docker startup.
      when: better_stack_collector_created is not skipped

    - name: Require the externally restored Better Stack collector secret on replay
      ansible.builtin.assert:
        that:
          - better_stack_collector_secret | length > 0
        fail_msg: >-
          BETTER_STACK_COLLECTOR_SECRET must be restored from approved external
          custody before rerunning collector commissioning and Docker startup.
      when: better_stack_collector_created is skipped
      no_log: true

    - name: Read back Better Stack collectors after creation
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors?name={{ better_stack_collector_name | urlencode }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      register: better_stack_collectors_readback
      no_log: true

    - name: Read remaining pages from filtered Better Stack collector readback
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors?name={{ better_stack_collector_name | urlencode }}&page={{ item }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop: >-
        {{ range(2, (
        better_stack_collectors_readback.json.pagination.last
        | default('page=1', true) | string
        | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)')
        | first | default('1', true) | int) + 1) | list }}
      register: better_stack_collector_readback_pages
      no_log: true

    - name: Merge every filtered Better Stack collector readback page
      ansible.builtin.set_fact:
        better_stack_collectors_readback:
          json:
            data: >-
              {{ ([better_stack_collectors_readback.json.data | default([])]
              + (better_stack_collector_readback_pages.results | default([])
              | map(attribute='json.data') | list)) | flatten | list }}
      no_log: true

    - name: Select the Better Stack production metrics collector
      ansible.builtin.set_fact:
        better_stack_collector_id: >-
          {{ (better_stack_collectors_readback.json.data | default([])
          | selectattr('attributes.name', 'equalto', better_stack_collector_name)
          | map(attribute='id') | first) }}
        better_stack_collector_provider_resource: >-
          {{ (better_stack_collectors_readback.json.data | default([])
          | selectattr('attributes.name', 'equalto', better_stack_collector_name)
          | first) }}
      no_log: true

    - name: Read the selected Better Stack collector identity
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      register: better_stack_collector_identity_readback
      no_log: true

    - name: Verify one Better Stack production metrics collector was selected
      ansible.builtin.assert:
        that:
          - >-
            better_stack_collectors_readback.json.data | default([])
            | selectattr('attributes.name', 'equalto', better_stack_collector_name)
            | list | length == 1
          - better_stack_collector_id | string | length > 0
          - better_stack_collector_identity_readback.json.data.id | string == better_stack_collector_id | string
          - >-
            better_stack_collector_identity_readback.json.data.attributes.secret
            | default('') == better_stack_collector_secret
        fail_msg: >-
          Better Stack collector discovery must resolve exactly one provider
          resource with the declared production name and the dedicated secret
          restored from approved external custody.
      no_log: true

    - name: Discover Better Stack dashboards by stable provider name
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/dashboards?query={{ better_stack_dashboard_name | urlencode }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      register: better_stack_existing_dashboards
      no_log: true

    - name: Read remaining pages from filtered Better Stack dashboard discovery
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/dashboards?query={{ better_stack_dashboard_name | urlencode }}&page={{ item }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop: >-
        {{ range(2, (
        better_stack_existing_dashboards.json.pagination.last
        | default('page=1', true) | string
        | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)')
        | first | default('1', true) | int) + 1) | list }}
      register: better_stack_existing_dashboard_pages
      no_log: true

    - name: Merge every filtered Better Stack dashboard discovery page
      ansible.builtin.set_fact:
        better_stack_existing_dashboards:
          json:
            data: >-
              {{ ([better_stack_existing_dashboards.json.data | default([])]
              + (better_stack_existing_dashboard_pages.results | default([])
              | map(attribute='json.data') | list)) | flatten | list }}
      no_log: true

    - name: Verify exactly one Better Stack production dashboard candidate
      ansible.builtin.assert:
        that:
          - >-
            better_stack_existing_dashboards.json.data | default([])
            | selectattr('attributes.name', 'equalto', better_stack_dashboard_name)
            | list | length <= 1
        fail_msg: >-
          Better Stack dashboard discovery must not resolve duplicate provider
          resources with the declared production name before mutation.

    - name: Discover the Better Stack collector source for dashboard binding
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors?name={{ better_stack_collector_name | urlencode }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      register: better_stack_dashboard_collector_sources
      no_log: true

    - name: Read remaining Better Stack collector source pages for dashboard binding
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors?name={{ better_stack_collector_name | urlencode }}&page={{ item }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop: >-
        {{ range(2, (
        better_stack_dashboard_collector_sources.json.pagination.last
        | default('page=1', true) | string
        | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)')
        | first | default('1', true) | int) + 1) | list }}
      register: better_stack_dashboard_collector_source_pages
      no_log: true

    - name: Merge every Better Stack collector source page for dashboard binding
      ansible.builtin.set_fact:
        better_stack_dashboard_collector_sources:
          json:
            data: >-
              {{ ([better_stack_dashboard_collector_sources.json.data | default([])]
              + (better_stack_dashboard_collector_source_pages.results | default([])
              | map(attribute='json.data') | list)) | flatten | list }}
      no_log: true

    - name: Select exactly one Better Stack collector source for dashboard binding
      ansible.builtin.assert:
        that:
          - >-
            better_stack_dashboard_collector_sources.json.data | default([])
            | selectattr('attributes.name', 'equalto', better_stack_collector_name)
            | list | length == 1
        fail_msg: >-
          Better Stack dashboard source binding must resolve exactly one
          collector with the declared production name.

    - name: Bind the Better Stack dashboard source to the selected collector
      ansible.builtin.set_fact:
        better_stack_dashboard_source_id: >-
          {{ (better_stack_dashboard_collector_sources.json.data | default([])
          | selectattr('attributes.name', 'equalto', better_stack_collector_name)
          | map(attribute='attributes.source_id') | first) | string }}
      no_log: true

    - name: Create the Better Stack production dashboard
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/dashboards"
        method: POST
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          name: "{{ better_stack_dashboard_name }}"
          refresh_interval: 300
          date_range_from: now-3h
          date_range_to: now
          variables:
            - name: source
              variable_type: source
              values:
                - "{{ better_stack_dashboard_source_id }}"
              default_values:
                - "{{ better_stack_dashboard_source_id }}"
        status_code: [201]
      when: >-
        not (better_stack_existing_dashboards.json.data | default([])
        | selectattr('attributes.name', 'equalto', better_stack_dashboard_name)
        | list)
      no_log: true

    - name: Read back Better Stack dashboards after creation
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/dashboards?query={{ better_stack_dashboard_name | urlencode }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      register: better_stack_dashboards_readback
      no_log: true

    - name: Read remaining pages from filtered Better Stack dashboard readback
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/dashboards?query={{ better_stack_dashboard_name | urlencode }}&page={{ item }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop: >-
        {{ range(2, (
        better_stack_dashboards_readback.json.pagination.last
        | default('page=1', true) | string
        | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)')
        | first | default('1', true) | int) + 1) | list }}
      register: better_stack_dashboard_readback_pages
      no_log: true

    - name: Merge every filtered Better Stack dashboard readback page
      ansible.builtin.set_fact:
        better_stack_dashboards_readback:
          json:
            data: >-
              {{ ([better_stack_dashboards_readback.json.data | default([])]
              + (better_stack_dashboard_readback_pages.results | default([])
              | map(attribute='json.data') | list)) | flatten | list }}
      no_log: true

    - name: Verify exactly one Better Stack production dashboard candidate after creation
      ansible.builtin.assert:
        that:
          - >-
            better_stack_dashboards_readback.json.data | default([])
            | selectattr('attributes.name', 'equalto', better_stack_dashboard_name)
            | list | length == 1
        fail_msg: >-
          Better Stack dashboard discovery must resolve exactly one provider
          resource with the declared production name before selecting its ID.

    - name: Select the Better Stack production dashboard
      ansible.builtin.set_fact:
        better_stack_dashboard_id: >-
          {{ (better_stack_dashboards_readback.json.data | default([])
          | selectattr('attributes.name', 'equalto', better_stack_dashboard_name)
          | map(attribute='id') | first) }}
        better_stack_dashboard_provider_resource: >-
          {{ (better_stack_dashboards_readback.json.data | default([])
          | selectattr('attributes.name', 'equalto', better_stack_dashboard_name)
          | first) }}

    - name: Read the selected Better Stack production dashboard detail
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/dashboards/{{ better_stack_dashboard_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      register: better_stack_dashboard_detail
      no_log: true

    - name: Use Better Stack dashboard detail for reconciliation decisions
      ansible.builtin.set_fact:
        better_stack_dashboard_provider_resource: "{{ better_stack_dashboard_detail.json.data }}"
      no_log: true

    - name: Reconcile the Better Stack production dashboard name
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/dashboards/{{ better_stack_dashboard_id }}"
        method: PATCH
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          name: "{{ better_stack_dashboard_name }}"
          refresh_interval: 300
          date_range_from: now-3h
          date_range_to: now
          variables:
            - name: source
              variable_type: source
              values:
                - "{{ better_stack_dashboard_source_id }}"
              default_values:
                - "{{ better_stack_dashboard_source_id }}"
        status_code: [200, 204]
      when: >-
        better_stack_dashboard_provider_resource.attributes.name | default('') != better_stack_dashboard_name
        or better_stack_dashboard_provider_resource.attributes.refresh_interval | int != 300
        or better_stack_dashboard_provider_resource.attributes.date_range_from | default('') != 'now-3h'
        or better_stack_dashboard_provider_resource.attributes.date_range_to | default('') != 'now'
        or better_stack_dashboard_provider_resource.attributes.variables | default([]) != [{
          'name': 'source',
          'variable_type': 'source',
          'values': [better_stack_dashboard_source_id],
          'default_values': [better_stack_dashboard_source_id]
        }]
      no_log: true

    - name: Read back the reconciled Better Stack production dashboard
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/dashboards/{{ better_stack_dashboard_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      register: better_stack_dashboard_readback
      no_log: true

    - name: Verify the Better Stack production dashboard provider state
      ansible.builtin.assert:
        that:
          - better_stack_dashboard_readback.json.data.id | string == better_stack_dashboard_id | string
          - better_stack_dashboard_readback.json.data.attributes.name == better_stack_dashboard_name
          - better_stack_dashboard_readback.json.data.attributes.refresh_interval | int == 300
          - better_stack_dashboard_readback.json.data.attributes.date_range_from == 'now-3h'
          - better_stack_dashboard_readback.json.data.attributes.date_range_to == 'now'
          - >-
            better_stack_dashboard_readback.json.data.attributes.variables | default([]) == [{
              'name': 'source',
              'variable_type': 'source',
              'values': [better_stack_dashboard_source_id],
              'default_values': [better_stack_dashboard_source_id]
            }]
        fail_msg: >-
          Better Stack dashboard readback must match the selected production
          dashboard identity and declared name.

    - name: Discover Better Stack charts on the production dashboard
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/dashboards/{{ better_stack_dashboard_id }}/charts?per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      register: better_stack_existing_charts
      no_log: true

    - name: Read remaining pages from existing Better Stack chart pagination
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/dashboards/{{ better_stack_dashboard_id }}/charts?page={{ item }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop: >-
        {{ range(2, (
        better_stack_existing_charts.json.pagination.last
        | default('page=1', true) | string
        | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)')
        | first | default('1', true) | int) + 1) | list }}
      register: better_stack_existing_chart_pages
      no_log: true

    - name: Merge every Better Stack chart discovery page
      ansible.builtin.set_fact:
        better_stack_existing_charts:
          json:
            data: >-
              {{ ([better_stack_existing_charts.json.data | default([])]
              + (better_stack_existing_chart_pages.results | default([])
              | map(attribute='json.data') | list)) | flatten | list }}
      no_log: true

    - name: Reject duplicate Better Stack production charts before mutation
      ansible.builtin.assert:
        that:
          - >-
            better_stack_existing_charts.json.data | default([])
            | selectattr('attributes.name', 'equalto', item.name)
            | list | length <= 1
        fail_msg: >-
          Better Stack chart discovery must resolve at most one provider
          resource for each declared production chart before mutation.
      loop: "{{ better_stack_chart_contracts }}"
      no_log: true

    - name: Reconcile Better Stack metric targets before chart mutation
      when: better_stack_collector_id is defined
      no_log: true
      block:
        - name: Default the protected PostgreSQL target credential-state path before chart mutation
          ansible.builtin.set_fact:
            better_stack_postgresql_target_credentials_fingerprint_file: >-
              {{ ansible_user_dir | default(lookup('env', 'HOME'), true)
              }}/.local/state/gam/better-stack/postgresql-target-credentials.sha256
          when: better_stack_postgresql_target_credentials_fingerprint_file is not defined
          no_log: true

        - name: Hold one exclusive lock while reconciling pre-chart Better Stack targets
          block:
            - name: Inspect the exclusive reconciliation lock clock before chart mutation
              ansible.builtin.command: date +%s%N
              register: better_stack_prechart_lock_clock
              changed_when: false

            - name: Generate a unique pre-chart reconciliation invocation nonce
              ansible.builtin.command:
                argv: [python3, -c, "import secrets; print(secrets.token_hex(16))"]
              register: better_stack_prechart_lock_nonce
              changed_when: false
              no_log: true

            - name: Bind the unique nonce to the pre-chart reconciliation clock token
              ansible.builtin.set_fact:
                better_stack_prechart_lock_clock:
                  stdout: "{{ better_stack_prechart_lock_clock.stdout }}-{{ better_stack_prechart_lock_nonce.stdout }}"
              no_log: true

            - name: Inspect a prior exclusive reconciliation lock before chart mutation
              ansible.builtin.stat:
                path: /tmp/gam-better-stack-target-reconciliation.lock
              register: better_stack_prechart_lock_directory

            - name: Inspect the prior reconciliation lock owner lease before chart mutation
              ansible.builtin.stat:
                path: /tmp/gam-better-stack-target-reconciliation.lock/owner.json
              register: better_stack_prechart_lock_owner_file
              when: better_stack_prechart_lock_directory.stat.exists

            - name: Read the prior reconciliation lock owner lease before chart mutation
              ansible.builtin.slurp:
                src: /tmp/gam-better-stack-target-reconciliation.lock/owner.json
              register: better_stack_prechart_lock_owner_content
              when:
                - better_stack_prechart_lock_directory.stat.exists
                - better_stack_prechart_lock_owner_file.stat.exists | default(false)

            - name: Determine whether the prior reconciliation lock owner is abandoned or its lease expired
              ansible.builtin.set_fact:
                better_stack_prechart_lock_stale: >-
                  {% set owner = (better_stack_prechart_lock_owner_content.content
                    | default('') | b64decode | trim) %}
                  {% set lease = (owner | from_json) if owner is match('^\\{') else {} %}
                  {{ better_stack_prechart_lock_directory.stat.exists and (
                    (better_stack_prechart_lock_owner_file.stat.exists | default(false)
                    and lease.lease_expires_epoch | default(0) | int
                    < better_stack_prechart_lock_clock.stdout[0:10] | int)
                    or (not (better_stack_prechart_lock_owner_file.stat.exists | default(false))
                    and (better_stack_prechart_lock_clock.stdout[0:10] | int
                    - better_stack_prechart_lock_directory.stat.mtime | default(0) | int) > 60)) }}

            - name: Re-read the stale pre-chart reconciliation lock owner before removal
              ansible.builtin.slurp:
                src: /tmp/gam-better-stack-target-reconciliation.lock/owner.json
              register: better_stack_prechart_lock_owner_recheck
              failed_when: false
              when: better_stack_prechart_lock_stale | string | trim | bool

            - name: Re-inspect the stale pre-chart reconciliation lock before removal
              ansible.builtin.stat:
                path: /tmp/gam-better-stack-target-reconciliation.lock/owner.json
              register: better_stack_prechart_lock_owner_recheck_stat
              when: better_stack_prechart_lock_stale | string | trim | bool

            - name: Confirm the same stale pre-chart owner remains before removal
              ansible.builtin.set_fact:
                better_stack_prechart_lock_still_owned_by_observed_stale_owner: >-
                  {{ ((better_stack_prechart_lock_owner_file.stat.exists | default(false))
                  and better_stack_prechart_lock_owner_recheck.content is defined
                  and (better_stack_prechart_lock_owner_recheck.content | b64decode | from_json).owner_token | default('')
                  == (better_stack_prechart_lock_owner_content.content | default('') | b64decode | from_json).owner_token | default(''))
                  or (not (better_stack_prechart_lock_owner_file.stat.exists | default(false))
                  and not (better_stack_prechart_lock_owner_recheck_stat.stat.exists | default(false))) }}
              when: better_stack_prechart_lock_stale | string | trim | bool

            - name: Atomically claim and remove only the observed stale pre-chart reconciliation lock
              ansible.builtin.command:
                argv:
                  - python3
                  - -c
                  - >-
                    import fcntl, json, os, shutil, sys;
                    path, expected, quarantine = sys.argv[1:];
                    guard_fd = os.open(path + '.guard', os.O_CREAT | os.O_RDWR, 0o600);
                    os.fchmod(guard_fd, 0o600);
                    fcntl.flock(guard_fd, fcntl.LOCK_EX);
                    directory_fd = os.open(path, os.O_RDONLY | os.O_DIRECTORY);
                    owned_inode = os.fstat(directory_fd).st_ino;
                    owner_path = os.path.join(path, 'owner.json');
                    current = json.load(open(owner_path, encoding='utf-8')).get('owner_token', '') if os.path.exists(owner_path) else '__missing__';
                    sys.exit(3) if current != expected else None;
                    os.rename(path, quarantine);
                    moved_inode = os.stat(quarantine, follow_symlinks=False).st_ino;
                    os.close(directory_fd);
                    shutil.rmtree(quarantine) if moved_inode != owned_inode and os.path.exists(path) else (os.rename(quarantine, path) if moved_inode != owned_inode else None);
                    sys.exit(3) if moved_inode != owned_inode else None;
                    remove_owned_lock = shutil.rmtree;
                    remove_owned_lock(quarantine)
                  - /tmp/gam-better-stack-target-reconciliation.lock
                  - >-
                    {{ (better_stack_prechart_lock_owner_content.content | b64decode | from_json).owner_token
                    if better_stack_prechart_lock_owner_file.stat.exists | default(false)
                    else '__missing__' }}
                  - "/tmp/gam-better-stack-target-reconciliation.lock.stale-{{ better_stack_prechart_lock_nonce.stdout }}"
              register: better_stack_prechart_stale_lock_removal
              when:
                - better_stack_prechart_lock_stale | string | trim | bool
                - better_stack_prechart_lock_still_owned_by_observed_stale_owner | default(false) | bool
              changed_when: better_stack_prechart_stale_lock_removal.rc == 0
              failed_when: better_stack_prechart_stale_lock_removal.rc not in [0, 3]
              no_log: true

            - name: Acquire the exclusive reconciliation lock before chart mutation
              ansible.builtin.command:
                argv:
                  - python3
                  - -c
                  - >-
                    import fcntl, os, sys;
                    path = sys.argv[1];
                    guard_fd = os.open(path + '.guard', os.O_CREAT | os.O_RDWR, 0o600);
                    os.fchmod(guard_fd, 0o600);
                    fcntl.flock(guard_fd, fcntl.LOCK_EX);
                    os.mkdir(path, 0o700)
                  - /tmp/gam-better-stack-target-reconciliation.lock
              register: better_stack_prechart_target_lock
              changed_when: false
              failed_when: false
              retries: 60
              delay: 1
              until: better_stack_prechart_target_lock.rc == 0

            - name: Require the pre-chart target reconciliation lock
              ansible.builtin.assert:
                that: better_stack_prechart_target_lock.rc == 0

            - name: Record the pre-chart reconciliation lock owner and lease
              ansible.builtin.copy:
                content: >-
                  {{ {'owner_token': inventory_hostname ~ ':' ~ better_stack_prechart_lock_clock.stdout ~ ':prechart',
                  'lease_expires_epoch': (better_stack_prechart_lock_clock.stdout[0:10] | int) + 3600} | to_nice_json }}
                dest: /tmp/gam-better-stack-target-reconciliation.lock/owner.json
                mode: "0600"
              changed_when: false

            - name: Read Better Stack metric targets required by production charts
              ansible.builtin.uri:
                url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets?per_page=100"
                method: GET
                headers:
                  Authorization: "Bearer {{ better_stack_api_token }}"
                  Content-Type: application/json
                status_code: [200]
                return_content: true
              register: better_stack_chart_collector_targets

            - name: Read remaining Better Stack target discovery pages before chart mutation
              ansible.builtin.uri:
                url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets?page={{ item }}&per_page=100"
                method: GET
                headers:
                  Authorization: "Bearer {{ better_stack_api_token }}"
                  Content-Type: application/json
                status_code: [200]
                return_content: true
              loop: >-
                {{ range(2, (better_stack_chart_collector_targets.json.pagination.last
                | default('page=1', true) | string
                | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)')
                | first | default('1', true) | int) + 1) | list }}
              register: better_stack_existing_collector_target_pages

            - name: Merge every Better Stack target discovery page before chart mutation
              ansible.builtin.set_fact:
                better_stack_existing_collector_targets:
                  json:
                    data: >-
                      {{ ([better_stack_chart_collector_targets.json.data | default([])]
                      + (better_stack_existing_collector_target_pages.results | default([])
                      | map(attribute='json.data') | list)) | flatten | list }}

            - name: Validate every managed Better Stack target input before chart mutation
              ansible.builtin.assert:
                that:
                  - better_stack_proxy_target_host | length > 0
                  - better_stack_proxy_target_service | length > 0
                  - better_stack_proxy_target_endpoint is match('^https?://[^/]+/.+')
                  - better_stack_backend_target_host | length > 0
                  - better_stack_backend_target_service | length > 0
                  - better_stack_backend_target_endpoint is match('^https?://[^/]+/.+')
                  - better_stack_postgresql_target_host | length > 0
                  - better_stack_postgresql_target_port | int > 0
                  - better_stack_postgresql_target_username | length > 0
                  - better_stack_postgresql_target_password | length > 0
                fail_msg: >-
                  Every managed Better Stack target must have a nonempty identity,
                  Prometheus endpoints must be absolute HTTP(S) URLs with paths,
                  and PostgreSQL credentials and port must be valid before mutation.
              no_log: true

            - name: Reject duplicate Better Stack targets before chart mutation
              ansible.builtin.assert:
                that:
                  - >-
                    better_stack_existing_collector_targets.json.data
                    | selectattr('attributes', 'defined')
                    | selectattr('attributes.kind', 'defined')
                    | selectattr('attributes.kind', 'equalto', item.kind)
                    | selectattr('attributes.host', 'defined')
                    | selectattr('attributes.host', 'equalto', item.host)
                    | list | length <= 1
              loop:
                - {kind: prometheus, host: "{{ better_stack_proxy_target_host }}"}
                - {kind: prometheus, host: "{{ better_stack_backend_target_host }}"}
                - {kind: postgres, host: "{{ better_stack_postgresql_target_host }}"}

            - name: Create Better Stack proxy Prometheus target before chart mutation
              ansible.builtin.uri:
                url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets"
                method: POST
                headers:
                  Authorization: "Bearer {{ better_stack_api_token }}"
                  Content-Type: application/json
                body_format: json
                body:
                  kind: prometheus
                  host: "{{ better_stack_proxy_target_host }}"
                  service: "{{ better_stack_proxy_target_service }}"
                  endpoint: "{{ better_stack_proxy_target_endpoint }}"
                status_code: [201]
              when: >-
                better_stack_existing_collector_targets.json.data
                | selectattr('attributes', 'defined')
                | selectattr('attributes.kind', 'defined')
                | selectattr('attributes.kind', 'equalto', 'prometheus')
                | selectattr('attributes.service', 'defined')
                | selectattr('attributes.service', 'equalto', better_stack_proxy_target_service)
                | list | length == 0

            - name: Create Better Stack backend Prometheus target before chart mutation
              ansible.builtin.uri:
                url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets"
                method: POST
                headers:
                  Authorization: "Bearer {{ better_stack_api_token }}"
                  Content-Type: application/json
                body_format: json
                body:
                  kind: prometheus
                  host: "{{ better_stack_backend_target_host }}"
                  service: "{{ better_stack_backend_target_service }}"
                  endpoint: "{{ better_stack_backend_target_endpoint }}"
                status_code: [201]
              when: >-
                better_stack_existing_collector_targets.json.data
                | selectattr('attributes', 'defined')
                | selectattr('attributes.kind', 'defined')
                | selectattr('attributes.kind', 'equalto', 'prometheus')
                | selectattr('attributes.service', 'defined')
                | selectattr('attributes.service', 'equalto', better_stack_backend_target_service)
                | list | length == 0

            - name: Ensure the protected PostgreSQL target credential-state directory exists before chart mutation
              ansible.builtin.file:
                path: "{{ better_stack_postgresql_target_credentials_fingerprint_file | dirname }}"
                state: directory
                mode: "0700"

            - name: Derive the desired PostgreSQL target credential fingerprint before chart mutation
              ansible.builtin.set_fact:
                better_stack_postgresql_target_credentials_desired_fingerprint: >-
                  {{ (better_stack_postgresql_target_username ~ ':' ~ better_stack_postgresql_target_password) | hash('sha256') }}
              no_log: true

            - name: Inspect protected PostgreSQL target credential state before chart mutation
              ansible.builtin.stat:
                path: "{{ better_stack_postgresql_target_credentials_fingerprint_file }}"
              register: better_stack_postgresql_target_credentials_state_stat
              no_log: true

            - name: Read protected PostgreSQL target credential state before chart mutation
              ansible.builtin.slurp:
                src: "{{ better_stack_postgresql_target_credentials_fingerprint_file }}"
              register: better_stack_postgresql_target_credentials_state_file
              when: better_stack_postgresql_target_credentials_state_stat.stat.exists
              no_log: true

            - name: Decode protected PostgreSQL target credential state before chart mutation
              ansible.builtin.set_fact:
                better_stack_postgresql_target_credentials_persisted_state: >-
                  {%- set raw = (better_stack_postgresql_target_credentials_state_file.content
                    | default('') | b64decode | trim) -%}
                  {%- set fingerprints = raw | regex_findall('"credential_fingerprint"\\s*:\\s*"([0-9a-fA-F]{64})"') -%}
                  {%- set target_ids = raw | regex_findall('"postgresql_target_id"\\s*:\\s*"([^"\\r\\n]+)"') -%}
                  {%- if fingerprints | length == 1 and target_ids | length == 1 -%}
                  {{ {'credential_fingerprint': fingerprints | first, 'postgresql_target_id': target_ids | first} }}
                  {%- elif raw is match('^[0-9a-fA-F]{64}$') -%}{{ {'credential_fingerprint': raw} }}
                  {%- else -%}{{ {} }}{%- endif -%}
              no_log: true

            - name: Determine whether PostgreSQL target credentials and identity are current before chart mutation
              ansible.builtin.set_fact:
                better_stack_postgresql_target_credentials_current: >-
                  {{ better_stack_postgresql_target_credentials_persisted_state.credential_fingerprint | default('')
                  == better_stack_postgresql_target_credentials_desired_fingerprint
                  and (better_stack_postgresql_target_credentials_persisted_state.postgresql_target_id | default('') | string)
                  == (better_stack_existing_collector_targets.json.data
                  | selectattr('attributes', 'defined')
                  | selectattr('attributes.kind', 'defined')
                  | selectattr('attributes.kind', 'equalto', 'postgres')
                  | map(attribute='id') | first | default('') | string) }}
              no_log: true

            - name: Create Better Stack database target before chart mutation
              ansible.builtin.uri:
                url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets"
                method: POST
                headers:
                  Authorization: "Bearer {{ better_stack_api_token }}"
                  Content-Type: application/json
                body_format: json
                body:
                  kind: postgres
                  host: "{{ better_stack_postgresql_target_host }}"
                  port: "{{ better_stack_postgresql_target_port | int }}"
                  username: "{{ better_stack_postgresql_target_username | string }}"
                  password: "{{ better_stack_postgresql_target_password | string }}"
                  ssl_mode: require
                status_code: [201]
                return_content: true
              register: better_stack_postgresql_target_creation_prechart
              when: >-
                better_stack_existing_collector_targets.json.data
                | selectattr('attributes', 'defined')
                | selectattr('attributes.kind', 'defined')
                | selectattr('attributes.kind', 'equalto', 'postgres')
                | list | length == 0
              no_log: true

            - name: Patch Better Stack database target credentials or identity before chart mutation
              ansible.builtin.uri:
                url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets/{{ item.id }}"
                method: PATCH
                headers:
                  Authorization: "Bearer {{ better_stack_api_token }}"
                  Content-Type: application/json
                body_format: json
                body:
                  host: "{{ better_stack_postgresql_target_host }}"
                  port: "{{ better_stack_postgresql_target_port | int }}"
                  username: "{{ better_stack_postgresql_target_username | string }}"
                  password: "{{ better_stack_postgresql_target_password | string }}"
                  ssl_mode: require
                status_code: [200]
                return_content: true
              loop: >-
                {{ better_stack_existing_collector_targets.json.data
                | selectattr('attributes', 'defined')
                | selectattr('attributes.kind', 'defined')
                | selectattr('attributes.kind', 'equalto', 'postgres') | list }}
              register: better_stack_postgresql_target_patch_prechart
              when: >-
                item.attributes.kind == 'postgres' and
                (not better_stack_postgresql_target_credentials_current
                or item.attributes.host != better_stack_postgresql_target_host
                or item.attributes.port | int != better_stack_postgresql_target_port | int
                or item.attributes.ssl_mode | default('') != 'require')
              no_log: true

            - name: Patch Better Stack proxy Prometheus target drift before chart mutation
              ansible.builtin.uri:
                url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets/{{ item.id }}"
                method: PATCH
                headers:
                  Authorization: "Bearer {{ better_stack_api_token }}"
                  Content-Type: application/json
                body_format: json
                body:
                  host: "{{ better_stack_proxy_target_host }}"
                  service: "{{ better_stack_proxy_target_service }}"
                  endpoint: "{{ better_stack_proxy_target_endpoint }}"
                status_code: [200]
              loop: >-
                {{ better_stack_existing_collector_targets.json.data
                | selectattr('attributes', 'defined')
                | selectattr('attributes.kind', 'defined')
                | selectattr('attributes.kind', 'equalto', 'prometheus')
                | selectattr('attributes.service', 'defined') | list }}
              when: >-
                item.attributes.kind == 'prometheus' and
                item.attributes.service == better_stack_proxy_target_service and
                (item.attributes.host != better_stack_proxy_target_host or
                item.attributes.endpoint != better_stack_proxy_target_endpoint)

            - name: Patch Better Stack backend Prometheus target drift before chart mutation
              ansible.builtin.uri:
                url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets/{{ item.id }}"
                method: PATCH
                headers:
                  Authorization: "Bearer {{ better_stack_api_token }}"
                  Content-Type: application/json
                body_format: json
                body:
                  host: "{{ better_stack_backend_target_host }}"
                  service: "{{ better_stack_backend_target_service }}"
                  endpoint: "{{ better_stack_backend_target_endpoint }}"
                status_code: [200]
              loop: >-
                {{ better_stack_existing_collector_targets.json.data
                | selectattr('attributes', 'defined')
                | selectattr('attributes.kind', 'defined')
                | selectattr('attributes.kind', 'equalto', 'prometheus')
                | selectattr('attributes.service', 'defined') | list }}
              when: >-
                item.attributes.kind == 'prometheus' and
                item.attributes.service == better_stack_backend_target_service and
                (item.attributes.host != better_stack_backend_target_host or
                item.attributes.endpoint != better_stack_backend_target_endpoint)

            - name: Select exact PostgreSQL mutation response identity before chart mutation
              ansible.builtin.set_fact:
                better_stack_postgresql_target_applied_id_prechart: >-
                  {{ better_stack_postgresql_target_creation_prechart.json.data.id
                  | default(better_stack_postgresql_target_patch_prechart.results | default([])
                  | selectattr('json.data.id', 'defined') | map(attribute='json.data.id') | first
                  | default(better_stack_existing_collector_targets.json.data
                  | selectattr('attributes', 'defined')
                  | selectattr('attributes.kind', 'defined')
                  | selectattr('attributes.kind', 'equalto', 'postgres') | map(attribute='id') | first | default(''), true), true) | string }}
              no_log: true

            - name: Read back PostgreSQL target mutation page one before chart mutation
              ansible.builtin.uri:
                url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets?per_page=100"
                method: GET
                headers:
                  Authorization: "Bearer {{ better_stack_api_token }}"
                status_code: [200]
                return_content: true
              register: better_stack_postgresql_target_readback_prechart
              no_log: true

            - name: Read back remaining PostgreSQL target mutation pagination before chart mutation
              ansible.builtin.uri:
                url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets?page={{ item }}&per_page=100"
                method: GET
                headers:
                  Authorization: "Bearer {{ better_stack_api_token }}"
                status_code: [200]
                return_content: true
              loop: >-
                {{ range(2, (better_stack_postgresql_target_readback_prechart.json.pagination.last
                | default('page=1', true) | string
                | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)') | first | default('1', true) | int) + 1) | list }}
              register: better_stack_postgresql_target_readback_pages_prechart
              no_log: true

            - name: Verify the exact PostgreSQL mutation response ID across every read back page before chart mutation
              ansible.builtin.assert:
                that: >-
                  ([better_stack_postgresql_target_readback_prechart.json.data | default([])]
                  + (better_stack_postgresql_target_readback_pages_prechart.results | default([]) | map(attribute='json.data') | list))
                  | flatten | selectattr('id', 'equalto', better_stack_postgresql_target_applied_id_prechart) | list | length == 1
              no_log: true

            - name: Persist the applied PostgreSQL target credential fingerprint before chart mutation
              ansible.builtin.copy:
                content: >-
                  {{ {'credential_fingerprint': better_stack_postgresql_target_credentials_desired_fingerprint,
                  'postgresql_target_id': (better_stack_postgresql_target_creation_prechart.json.data.id
                  | default(better_stack_postgresql_target_patch_prechart.results | default([])
                  | selectattr('json.data.id', 'defined') | map(attribute='json.data.id') | first
                  | default(better_stack_postgresql_target_applied_id_prechart, true), true) | string)} | to_nice_json }}
                dest: "{{ better_stack_postgresql_target_credentials_fingerprint_file }}"
                mode: "0600"
              no_log: true
          always:
            - name: Re-read the pre-chart lock owner immediately before cleanup
              ansible.builtin.slurp:
                src: /tmp/gam-better-stack-target-reconciliation.lock/owner.json
              register: better_stack_prechart_lock_owner_before_cleanup
              failed_when: false
              when:
                - better_stack_prechart_target_lock is defined
                - better_stack_prechart_target_lock.rc | default(1) == 0

            - name: Atomically release only this apply's pre-chart Better Stack target reconciliation lock
              ansible.builtin.command:
                argv:
                  - python3
                  - -c
                  - >-
                    import fcntl, json, os, shutil, sys;
                    path, expected, quarantine = sys.argv[1:];
                    guard_fd = os.open(path + '.guard', os.O_CREAT | os.O_RDWR, 0o600);
                    os.fchmod(guard_fd, 0o600);
                    fcntl.flock(guard_fd, fcntl.LOCK_EX);
                    directory_fd = os.open(path, os.O_RDONLY | os.O_DIRECTORY);
                    owned_inode = os.fstat(directory_fd).st_ino;
                    owner_path = os.path.join(path, 'owner.json');
                    current = json.load(open(owner_path, encoding='utf-8')).get('owner_token', '') if os.path.exists(owner_path) else '';
                    sys.exit(3) if current != expected else None;
                    os.rename(path, quarantine);
                    moved_inode = os.stat(quarantine, follow_symlinks=False).st_ino;
                    os.close(directory_fd);
                    shutil.rmtree(quarantine) if moved_inode != owned_inode and os.path.exists(path) else (os.rename(quarantine, path) if moved_inode != owned_inode else None);
                    sys.exit(3) if moved_inode != owned_inode else None;
                    remove_owned_lock = shutil.rmtree;
                    remove_owned_lock(quarantine)
                  - /tmp/gam-better-stack-target-reconciliation.lock
                  - "{{ inventory_hostname }}:{{ better_stack_prechart_lock_clock.stdout }}:prechart"
                  - >-
                    /tmp/gam-better-stack-target-reconciliation.lock.release-{{
                    (inventory_hostname ~ ':' ~ better_stack_prechart_lock_clock.stdout ~ ':prechart') | hash('sha256') }}
              register: better_stack_prechart_lock_release
              changed_when: false
              failed_when: better_stack_prechart_lock_release.rc not in [0, 3]
              no_log: true
              when:
                - better_stack_prechart_target_lock is defined
                - better_stack_prechart_target_lock.rc | default(1) == 0

    - name: Create declared Better Stack proxy, backend, PostgreSQL, and filesystem charts
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/dashboards/{{ better_stack_dashboard_id }}/charts"
        method: POST
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          name: "{{ item.name }}"
          chart_type: "{{ item.chart_type }}"
          queries:
            - query_type: sql_expression
              source_variable: "{{ item.queries[0].source_variable }}"
              sql_query: "{{ item.queries[0].sql_query }}"
        status_code: [201]
      loop: "{{ better_stack_chart_contracts }}"
      register: better_stack_production_chart_creation
      when: >-
        not (better_stack_existing_charts.json.data | default([])
        | selectattr('attributes.name', 'equalto', item.name)
        | list)
      no_log: true

    - name: Read back Better Stack charts after creation
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/dashboards/{{ better_stack_dashboard_id }}/charts?per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      register: better_stack_charts_readback
      no_log: true

    - name: Read remaining pages from Better Stack chart selection pagination
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/dashboards/{{ better_stack_dashboard_id }}/charts?page={{ item }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop: >-
        {{ range(2, (
        better_stack_charts_readback.json.pagination.last
        | default('page=1', true) | string
        | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)')
        | first | default('1', true) | int) + 1) | list }}
      register: better_stack_chart_selection_pages
      no_log: true

    - name: Merge every Better Stack chart selection page
      ansible.builtin.set_fact:
        better_stack_charts_readback:
          json:
            data: >-
              {{ ([better_stack_charts_readback.json.data | default([])]
              + (better_stack_chart_selection_pages.results | default([])
              | map(attribute='json.data') | list)) | flatten | list }}
      no_log: true

    - name: Select Better Stack production chart identities
      ansible.builtin.set_fact:
        better_stack_proxy_chart_id: >-
          {{ (better_stack_charts_readback.json.data | default([])
          | selectattr('attributes.name', 'equalto', better_stack_proxy_chart_name)
          | map(attribute='id') | first) }}
        better_stack_backend_chart_id: >-
          {{ (better_stack_charts_readback.json.data | default([])
          | selectattr('attributes.name', 'equalto', better_stack_backend_chart_name)
          | map(attribute='id') | first) }}
        better_stack_postgresql_chart_id: >-
          {{ (better_stack_charts_readback.json.data | default([])
          | selectattr('attributes.name', 'equalto', better_stack_postgresql_chart_name)
          | map(attribute='id') | first) }}
        better_stack_filesystem_chart_id: >-
          {{ (better_stack_charts_readback.json.data | default([])
          | selectattr('attributes.name', 'equalto', better_stack_filesystem_chart_name)
          | map(attribute='id') | first) }}

    - name: Reconcile drifted Better Stack production charts
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/dashboards/{{ better_stack_dashboard_id }}/charts/{{ item.id }}"
        method: PATCH
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          name: "{{ declared_chart.name }}"
          chart_type: "{{ declared_chart.chart_type }}"
          queries: "{{ declared_chart.queries }}"
        status_code: [200, 204]
      loop: "{{ better_stack_charts_readback.json.data | default([]) }}"
      vars:
        declared_chart: >-
          {{ (better_stack_chart_contracts
          | selectattr('name', 'equalto', item.attributes.name)
          | first) }}
      when:
        - item.attributes.name | default('') in (better_stack_chart_contracts | map(attribute='name') | list)
        - >-
          item.attributes.chart_type | default('') != declared_chart.chart_type
          or item.attributes.queries | default([]) | length != 1
          or item.attributes.queries[0].query_type | default('') != declared_chart.queries[0].query_type
          or item.attributes.queries[0].source_variable | default('') != declared_chart.queries[0].source_variable
          or item.attributes.queries[0].sql_query | default('') != declared_chart.queries[0].sql_query
      no_log: true

    - name: Read back reconciled Better Stack production charts
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/dashboards/{{ better_stack_dashboard_id }}/charts"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      register: better_stack_charts_final_readback
      no_log: true

    - name: Read remaining pages from Better Stack final chart pagination
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/dashboards/{{ better_stack_dashboard_id }}/charts?page={{ item }}"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop: >-
        {{ range(2, (
        better_stack_charts_final_readback.json.pagination.last
        | default('page=1', true) | string
        | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)')
        | first | default('1', true) | int) + 1) | list }}
      register: better_stack_final_chart_pages
      no_log: true

    - name: Merge every Better Stack final chart readback page
      ansible.builtin.set_fact:
        better_stack_charts_final_readback:
          json:
            data: >-
              {{ ([better_stack_charts_final_readback.json.data | default([])]
              + (better_stack_final_chart_pages.results | default([])
              | map(attribute='json.data') | list)) | flatten | list }}
      no_log: true

    - name: Verify Better Stack production chart provider state
      ansible.builtin.assert:
        that:
          - better_stack_chart_matches | length == 1
          - better_stack_chart_matches[0].attributes.chart_type == item.chart_type
          - better_stack_chart_matches[0].attributes.queries | length == 1
          - better_stack_chart_matches[0].attributes.queries[0].query_type == item.queries[0].query_type
          - better_stack_chart_matches[0].attributes.queries[0].source_variable == item.queries[0].source_variable
          - better_stack_chart_matches[0].attributes.queries[0].sql_query == item.queries[0].sql_query
        fail_msg: >-
          Better Stack chart readback must contain exactly one provider resource
          matching the complete declared chart contract.
      loop: "{{ better_stack_chart_contracts }}"
      vars:
        better_stack_chart_matches: >-
          {{ better_stack_charts_final_readback.json.data | default([])
          | selectattr('attributes.name', 'equalto', item.name)
          | list }}
      no_log: true

    - name: Configure the Better Stack collector source through the official API
      ansible.builtin.uri:
        url: "{# production default: https://telemetry.betterstack.com/api/v1/collectors #}{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}"
        method: PATCH
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          configuration:
            components:
              logs_docker: false
              logs_host: false
              logs_kubernetes: false
              logs_collector_internals: false
              ebpf_tracing_basic: false
              ebpf_tracing_full: false
              traces_opentelemetry: false
              ebpf_metrics: true
              ebpf_red_metrics: true
              metrics_databases: true
        status_code: [200]
      register: better_stack_collector_configuration
      when: >-
        better_stack_collector_provider_resource.attributes.configuration.components
        | default({}) != {
          'logs_docker': false,
          'logs_host': false,
          'logs_kubernetes': false,
          'logs_collector_internals': false,
          'ebpf_tracing_basic': false,
          'ebpf_tracing_full': false,
          'traces_opentelemetry': false,
          'ebpf_metrics': true,
          'ebpf_red_metrics': true,
          'metrics_databases': true
        }
      no_log: true

    - name: Read back the Better Stack collector source configuration
      ansible.builtin.uri:
        url: "{# production default: https://telemetry.betterstack.com/api/v1/collectors #}{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      register: better_stack_collector_source
      no_log: true

    - name: Verify the Better Stack collector remains metrics-only
      ansible.builtin.assert:
        that:
          - better_stack_collector_source.json.data.attributes.configuration.components.logs_docker is sameas false
          - better_stack_collector_source.json.data.attributes.configuration.components.logs_host is sameas false
          - better_stack_collector_source.json.data.attributes.configuration.components.logs_kubernetes is sameas false
          - better_stack_collector_source.json.data.attributes.configuration.components.logs_collector_internals is sameas false
          - better_stack_collector_source.json.data.attributes.configuration.components.ebpf_tracing_basic is sameas false
          - better_stack_collector_source.json.data.attributes.configuration.components.ebpf_tracing_full is sameas false
          - better_stack_collector_source.json.data.attributes.configuration.components.traces_opentelemetry is sameas false
          - better_stack_collector_source.json.data.attributes.configuration.components.ebpf_metrics is sameas true
          - better_stack_collector_source.json.data.attributes.configuration.components.ebpf_red_metrics is sameas true
          - better_stack_collector_source.json.data.attributes.configuration.components.metrics_databases is sameas true
        fail_msg: >-
          Better Stack provider-side collector configuration must keep all
          broad log and distributed-trace components disabled and all declared
          metric components enabled before the Docker collector starts.
      no_log: true

    - name: Hold one exclusive lock while reconciling the Better Stack PostgreSQL target
      when: better_stack_collector_id is defined
      no_log: true
      block:
        - name: Default the protected PostgreSQL target credential-state path for reconciliation
          ansible.builtin.set_fact:
            better_stack_postgresql_target_credentials_fingerprint_file: >-
              {{ ansible_user_dir | default(lookup('env', 'HOME'), true)
              }}/.local/state/gam/better-stack/postgresql-target-credentials.sha256
          when: better_stack_postgresql_target_credentials_fingerprint_file is not defined
          no_log: true

        - name: Inspect the exclusive reconciliation lock clock
          ansible.builtin.command: date +%s%N
          register: better_stack_lock_clock
          changed_when: false

        - name: Generate a unique reconciliation invocation nonce
          ansible.builtin.command:
            argv: [python3, -c, "import secrets; print(secrets.token_hex(16))"]
          register: better_stack_lock_nonce
          changed_when: false
          no_log: true

        - name: Bind the unique nonce to the reconciliation clock token
          ansible.builtin.set_fact:
            better_stack_lock_clock:
              stdout: "{{ better_stack_lock_clock.stdout }}-{{ better_stack_lock_nonce.stdout }}"
          no_log: true

        - name: Inspect a prior exclusive reconciliation lock
          ansible.builtin.stat:
            path: /tmp/gam-better-stack-target-reconciliation.lock
          register: better_stack_lock_directory

        - name: Inspect the prior reconciliation lock owner lease
          ansible.builtin.stat:
            path: /tmp/gam-better-stack-target-reconciliation.lock/owner.json
          register: better_stack_lock_owner_file
          when: better_stack_lock_directory.stat.exists

        - name: Read the prior reconciliation lock owner lease
          ansible.builtin.slurp:
            src: /tmp/gam-better-stack-target-reconciliation.lock/owner.json
          register: better_stack_lock_owner_content
          when:
            - better_stack_lock_directory.stat.exists
            - better_stack_lock_owner_file.stat.exists | default(false)

        - name: Determine whether the prior reconciliation lock owner is abandoned or its lease expired
          ansible.builtin.set_fact:
            better_stack_lock_stale: >-
              {% set owner = (better_stack_lock_owner_content.content
                | default('') | b64decode | trim) %}
              {% set lease = (owner | from_json) if owner is match('^\\{') else {} %}
              {{ better_stack_lock_directory.stat.exists and (
                (better_stack_lock_owner_file.stat.exists | default(false)
                and lease.lease_expires_epoch | default(0) | int
                < better_stack_lock_clock.stdout[0:10] | int)
                or (not (better_stack_lock_owner_file.stat.exists | default(false))
                and (better_stack_lock_clock.stdout[0:10] | int
                - better_stack_lock_directory.stat.mtime | default(0) | int) > 60)) }}

        - name: Re-read the stale reconciliation lock owner before removal
          ansible.builtin.slurp:
            src: /tmp/gam-better-stack-target-reconciliation.lock/owner.json
          register: better_stack_lock_owner_recheck
          failed_when: false
          when: better_stack_lock_stale | string | trim | bool

        - name: Re-inspect the stale reconciliation lock before removal
          ansible.builtin.stat:
            path: /tmp/gam-better-stack-target-reconciliation.lock/owner.json
          register: better_stack_lock_owner_recheck_stat
          when: better_stack_lock_stale | string | trim | bool

        - name: Confirm the same stale owner remains before removal
          ansible.builtin.set_fact:
            better_stack_lock_still_owned_by_observed_stale_owner: >-
              {{ ((better_stack_lock_owner_file.stat.exists | default(false))
              and better_stack_lock_owner_recheck.content is defined
              and (better_stack_lock_owner_recheck.content | b64decode | from_json).owner_token | default('')
              == (better_stack_lock_owner_content.content | default('') | b64decode | from_json).owner_token | default(''))
              or (not (better_stack_lock_owner_file.stat.exists | default(false))
              and not (better_stack_lock_owner_recheck_stat.stat.exists | default(false))) }}
          when: better_stack_lock_stale | string | trim | bool

        - name: Atomically claim and remove only the observed stale reconciliation lock
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - >-
                import fcntl, json, os, shutil, sys;
                path, expected, quarantine = sys.argv[1:];
                guard_fd = os.open(path + '.guard', os.O_CREAT | os.O_RDWR, 0o600);
                os.fchmod(guard_fd, 0o600);
                fcntl.flock(guard_fd, fcntl.LOCK_EX);
                directory_fd = os.open(path, os.O_RDONLY | os.O_DIRECTORY);
                owned_inode = os.fstat(directory_fd).st_ino;
                owner_path = os.path.join(path, 'owner.json');
                current = json.load(open(owner_path, encoding='utf-8')).get('owner_token', '') if os.path.exists(owner_path) else '__missing__';
                sys.exit(3) if current != expected else None;
                os.rename(path, quarantine);
                moved_inode = os.stat(quarantine, follow_symlinks=False).st_ino;
                os.close(directory_fd);
                shutil.rmtree(quarantine) if moved_inode != owned_inode and os.path.exists(path) else (os.rename(quarantine, path) if moved_inode != owned_inode else None);
                sys.exit(3) if moved_inode != owned_inode else None;
                remove_owned_lock = shutil.rmtree;
                remove_owned_lock(quarantine)
              - /tmp/gam-better-stack-target-reconciliation.lock
              - >-
                {{ (better_stack_lock_owner_content.content | b64decode | from_json).owner_token
                if better_stack_lock_owner_file.stat.exists | default(false)
                else '__missing__' }}
              - "/tmp/gam-better-stack-target-reconciliation.lock.stale-{{ better_stack_lock_nonce.stdout }}"
          register: better_stack_stale_lock_removal
          when:
            - better_stack_lock_stale | string | trim | bool
            - better_stack_lock_still_owned_by_observed_stale_owner | default(false) | bool
          changed_when: better_stack_stale_lock_removal.rc == 0
          failed_when: better_stack_stale_lock_removal.rc not in [0, 3]
          no_log: true

        - name: Acquire the exclusive reconciliation lock
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - >-
                import fcntl, os, sys;
                path = sys.argv[1];
                guard_fd = os.open(path + '.guard', os.O_CREAT | os.O_RDWR, 0o600);
                os.fchmod(guard_fd, 0o600);
                fcntl.flock(guard_fd, fcntl.LOCK_EX);
                os.mkdir(path, 0o700)
              - /tmp/gam-better-stack-target-reconciliation.lock
          register: better_stack_target_lock
          changed_when: false
          failed_when: false
          retries: 60
          delay: 1
          until: better_stack_target_lock.rc == 0

        - name: Require the Better Stack target reconciliation lock
          ansible.builtin.assert:
            that: better_stack_target_lock.rc == 0

        - name: Record the reconciliation lock owner and lease
          ansible.builtin.copy:
            content: >-
              {{ {'owner_token': inventory_hostname ~ ':' ~ better_stack_lock_clock.stdout ~ ':final',
              'lease_expires_epoch': (better_stack_lock_clock.stdout[0:10] | int) + 3600} | to_nice_json }}
            dest: /tmp/gam-better-stack-target-reconciliation.lock/owner.json
            mode: "0600"
          changed_when: false

        - name: Read existing Better Stack collector metric targets
          ansible.builtin.uri:
            url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets?per_page=100"
            method: GET
            headers:
              Authorization: "Bearer {{ better_stack_api_token }}"
              Content-Type: application/json
            status_code: [200]
            return_content: true
          register: better_stack_existing_collector_targets

        - name: Read remaining Better Stack collector target discovery pages
          ansible.builtin.uri:
            url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets?page={{ item }}&per_page=100"
            method: GET
            headers:
              Authorization: "Bearer {{ better_stack_api_token }}"
            status_code: [200]
            return_content: true
          loop: >-
            {{ range(2, (better_stack_existing_collector_targets.json.pagination.last
            | default('page=1', true) | string
            | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)') | first | default('1', true) | int) + 1) | list }}
          register: better_stack_existing_collector_target_pages

        - name: Merge all Better Stack collector target discovery pages
          ansible.builtin.set_fact:
            better_stack_existing_collector_targets:
              json:
                data: >-
                  {{ ([better_stack_existing_collector_targets.json.data | default([])]
                  + (better_stack_existing_collector_target_pages.results | default([])
                  | map(attribute='json.data') | list)) | flatten | list }}

        - name: Validate every managed Better Stack target input before reconciliation
          ansible.builtin.assert:
            that:
              - better_stack_proxy_target_host | length > 0
              - better_stack_proxy_target_service | length > 0
              - better_stack_proxy_target_endpoint is match('^https?://[^/]+/.+')
              - better_stack_backend_target_host | length > 0
              - better_stack_backend_target_service | length > 0
              - better_stack_backend_target_endpoint is match('^https?://[^/]+/.+')
              - better_stack_postgresql_target_host | length > 0
              - better_stack_postgresql_target_port | int > 0
              - better_stack_postgresql_target_username | length > 0
              - better_stack_postgresql_target_password | length > 0
            fail_msg: >-
              Every managed Better Stack target must have a nonempty identity,
              Prometheus endpoints must be absolute HTTP(S) URLs with paths,
              and PostgreSQL credentials and port must be valid before mutation.
          no_log: true

        - name: Reject duplicate Better Stack service targets
          ansible.builtin.assert:
            that:
              - >-
                better_stack_existing_collector_targets.json.data
                | selectattr('attributes', 'defined')
                | selectattr('attributes.kind', 'defined')
                | selectattr('attributes.kind', 'equalto', item.kind)
                | selectattr('attributes.host', 'defined')
                | selectattr('attributes.host', 'equalto', item.host)
                | list | length <= 1
          loop:
            - {kind: prometheus, host: "{{ better_stack_proxy_target_host }}"}
            - {kind: prometheus, host: "{{ better_stack_backend_target_host }}"}
            - {kind: postgres, host: "{{ better_stack_postgresql_target_host }}"}

        - name: Create Better Stack proxy Prometheus target
          ansible.builtin.uri:
            url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets"
            method: POST
            headers:
              Authorization: "Bearer {{ better_stack_api_token }}"
              Content-Type: application/json
            body_format: json
            body:
              kind: prometheus
              host: "{{ better_stack_proxy_target_host }}"
              service: "{{ better_stack_proxy_target_service }}"
              endpoint: "{{ better_stack_proxy_target_endpoint }}"
            status_code: [201]
          when: >-
            better_stack_existing_collector_targets.json.data
            | selectattr('attributes', 'defined')
            | selectattr('attributes.kind', 'defined')
            | selectattr('attributes.kind', 'equalto', 'prometheus')
            | selectattr('attributes.service', 'defined')
            | selectattr('attributes.service', 'equalto', better_stack_proxy_target_service)
            | list | length == 0

        - name: Create Better Stack backend Prometheus target
          ansible.builtin.uri:
            url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets"
            method: POST
            headers:
              Authorization: "Bearer {{ better_stack_api_token }}"
              Content-Type: application/json
            body_format: json
            body:
              kind: prometheus
              host: "{{ better_stack_backend_target_host }}"
              service: "{{ better_stack_backend_target_service }}"
              endpoint: "{{ better_stack_backend_target_endpoint }}"
            status_code: [201]
          when: >-
            better_stack_existing_collector_targets.json.data
            | selectattr('attributes', 'defined')
            | selectattr('attributes.kind', 'defined')
            | selectattr('attributes.kind', 'equalto', 'prometheus')
            | selectattr('attributes.service', 'defined')
            | selectattr('attributes.service', 'equalto', better_stack_backend_target_service)
            | list | length == 0

        - name: Patch Better Stack proxy Prometheus target drift
          ansible.builtin.uri:
            url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets/{{ item.id }}"
            method: PATCH
            headers:
              Authorization: "Bearer {{ better_stack_api_token }}"
              Content-Type: application/json
            body_format: json
            body:
              host: "{{ better_stack_proxy_target_host }}"
              service: "{{ better_stack_proxy_target_service }}"
              endpoint: "{{ better_stack_proxy_target_endpoint }}"
            status_code: [200]
          loop: >-
            {{ better_stack_existing_collector_targets.json.data
            | selectattr('attributes', 'defined')
            | selectattr('attributes.kind', 'defined')
            | selectattr('attributes.kind', 'equalto', 'prometheus')
            | selectattr('attributes.service', 'defined')
            | selectattr('attributes.service', 'equalto', better_stack_proxy_target_service)
            | list }}
          when: >-
            item.attributes.host | default('') != better_stack_proxy_target_host or
            item.attributes.endpoint | default('') != better_stack_proxy_target_endpoint

        - name: Patch Better Stack backend Prometheus target drift
          ansible.builtin.uri:
            url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets/{{ item.id }}"
            method: PATCH
            headers:
              Authorization: "Bearer {{ better_stack_api_token }}"
              Content-Type: application/json
            body_format: json
            body:
              host: "{{ better_stack_backend_target_host }}"
              service: "{{ better_stack_backend_target_service }}"
              endpoint: "{{ better_stack_backend_target_endpoint }}"
            status_code: [200]
          loop: >-
            {{ better_stack_existing_collector_targets.json.data
            | selectattr('attributes', 'defined')
            | selectattr('attributes.kind', 'defined')
            | selectattr('attributes.kind', 'equalto', 'prometheus')
            | selectattr('attributes.service', 'defined')
            | selectattr('attributes.service', 'equalto', better_stack_backend_target_service)
            | list }}
          when: >-
            item.attributes.host | default('') != better_stack_backend_target_host or
            item.attributes.endpoint | default('') != better_stack_backend_target_endpoint

        - name: Ensure the protected PostgreSQL target credential-state directory exists
          ansible.builtin.file:
            path: "{{ better_stack_postgresql_target_credentials_fingerprint_file | dirname }}"
            state: directory
            mode: "0700"

        - name: Derive the desired PostgreSQL target credential fingerprint
          ansible.builtin.set_fact:
            better_stack_postgresql_target_credentials_desired_fingerprint: >-
              {{ (better_stack_postgresql_target_username ~ ':' ~ better_stack_postgresql_target_password) | hash('sha256') }}
          no_log: true

        - name: Inspect protected PostgreSQL target credential state
          ansible.builtin.stat:
            path: "{{ better_stack_postgresql_target_credentials_fingerprint_file }}"
          register: better_stack_postgresql_target_credentials_state_stat
          no_log: true

        - name: Read protected PostgreSQL target credential state
          ansible.builtin.slurp:
            src: "{{ better_stack_postgresql_target_credentials_fingerprint_file }}"
          register: better_stack_postgresql_target_credentials_state_file
          when: better_stack_postgresql_target_credentials_state_stat.stat.exists
          no_log: true

        - name: Decode protected PostgreSQL target credential state
          ansible.builtin.set_fact:
            better_stack_postgresql_target_credentials_persisted_state: >-
              {%- set raw = (better_stack_postgresql_target_credentials_state_file.content
                | default('') | b64decode | trim) -%}
              {%- set fingerprints = raw | regex_findall('"credential_fingerprint"\\s*:\\s*"([0-9a-fA-F]{64})"') -%}
              {%- set target_ids = raw | regex_findall('"postgresql_target_id"\\s*:\\s*"([^"\\r\\n]+)"') -%}
              {%- if fingerprints | length == 1 and target_ids | length == 1 -%}
              {{ {'credential_fingerprint': fingerprints | first, 'postgresql_target_id': target_ids | first} }}
              {%- elif raw is match('^[0-9a-fA-F]{64}$') -%}{{ {'credential_fingerprint': raw} }}
              {%- else -%}{{ {} }}{%- endif -%}
          no_log: true

        - name: Determine whether PostgreSQL target credentials and provider identity are current
          ansible.builtin.set_fact:
            better_stack_postgresql_target_credentials_current: >-
              {{ better_stack_postgresql_target_credentials_persisted_state.credential_fingerprint | default('')
              == better_stack_postgresql_target_credentials_desired_fingerprint
              and (better_stack_postgresql_target_credentials_persisted_state.postgresql_target_id | default('') | string)
              == (better_stack_existing_collector_targets.json.data
              | selectattr('attributes', 'defined')
              | selectattr('attributes.kind', 'defined')
              | selectattr('attributes.kind', 'equalto', 'postgres')
              | map(attribute='id') | first | default('') | string) }}
          no_log: true

        - name: Create Better Stack PostgreSQL target
          ansible.builtin.uri:
            url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets"
            method: POST
            headers:
              Authorization: "Bearer {{ better_stack_api_token }}"
              Content-Type: application/json
            body_format: json
            body:
              kind: postgres
              host: "{{ better_stack_postgresql_target_host }}"
              port: "{{ better_stack_postgresql_target_port | int }}"
              username: "{{ better_stack_postgresql_target_username }}"
              password: "{{ better_stack_postgresql_target_password }}"
              ssl_mode: require
            status_code: [201]
            return_content: true
          register: better_stack_postgresql_target_creation
          when: >-
            better_stack_existing_collector_targets.json.data
            | selectattr('attributes', 'defined')
            | selectattr('attributes.kind', 'defined')
            | selectattr('attributes.kind', 'equalto', 'postgres')
            | list | length == 0
          no_log: true

        - name: Patch Better Stack PostgreSQL target credentials, identity, and drift
          ansible.builtin.uri:
            url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets/{{ item.id }}"
            method: PATCH
            headers:
              Authorization: "Bearer {{ better_stack_api_token }}"
              Content-Type: application/json
            body_format: json
            body:
              host: "{{ better_stack_postgresql_target_host }}"
              port: "{{ better_stack_postgresql_target_port | int }}"
              username: "{{ better_stack_postgresql_target_username }}"
              password: "{{ better_stack_postgresql_target_password }}"
              ssl_mode: require
            status_code: [200]
            return_content: true
          loop: >-
            {{ better_stack_existing_collector_targets.json.data
            | selectattr('attributes', 'defined')
            | selectattr('attributes.kind', 'defined')
            | selectattr('attributes.kind', 'equalto', 'postgres') | list }}
          register: better_stack_postgresql_target_patch
          when: >-
            item.attributes.kind == 'postgres' and
            (not better_stack_postgresql_target_credentials_current
            or item.attributes.host != better_stack_postgresql_target_host
            or item.attributes.port | int != better_stack_postgresql_target_port | int
            or item.attributes.ssl_mode | default('') != 'require')
          no_log: true

        - name: Select the exact successful PostgreSQL mutation response target ID
          ansible.builtin.set_fact:
            better_stack_postgresql_target_applied_id: >-
              {{ better_stack_postgresql_target_creation.json.data.id
              | default(better_stack_postgresql_target_patch.results | default([])
              | selectattr('json.data.id', 'defined') | map(attribute='json.data.id') | first
              | default(better_stack_existing_collector_targets.json.data
              | selectattr('attributes', 'defined')
              | selectattr('attributes.kind', 'defined')
              | selectattr('attributes.kind', 'equalto', 'postgres') | map(attribute='id') | first | default(''), true), true) | string }}
          no_log: true

        - name: Read back PostgreSQL target mutation page one
          ansible.builtin.uri:
            url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets?per_page=100"
            method: GET
            headers:
              Authorization: "Bearer {{ better_stack_api_token }}"
            status_code: [200]
            return_content: true
          register: better_stack_postgresql_target_readback
          no_log: true

        - name: Read back remaining PostgreSQL target mutation pagination
          ansible.builtin.uri:
            url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets?page={{ item }}&per_page=100"
            method: GET
            headers:
              Authorization: "Bearer {{ better_stack_api_token }}"
            status_code: [200]
            return_content: true
          loop: >-
            {{ range(2, (better_stack_postgresql_target_readback.json.pagination.last
            | default('page=1', true) | string
            | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)') | first | default('1', true) | int) + 1) | list }}
          register: better_stack_postgresql_target_readback_pages
          no_log: true

        - name: Verify exact PostgreSQL mutation response ID across every read back page
          ansible.builtin.assert:
            that: >-
              ([better_stack_postgresql_target_readback.json.data | default([])]
              + (better_stack_postgresql_target_readback_pages.results | default([]) | map(attribute='json.data') | list))
              | flatten | selectattr('id', 'equalto', better_stack_postgresql_target_applied_id) | list | length == 1
          no_log: true

        - name: Persist the applied PostgreSQL target credential fingerprint
          ansible.builtin.copy:
            content: >-
              {{ {'credential_fingerprint': better_stack_postgresql_target_credentials_desired_fingerprint,
              'postgresql_target_id': (better_stack_postgresql_target_creation.json.data.id
              | default(better_stack_postgresql_target_patch.results | default([])
              | selectattr('json.data.id', 'defined') | map(attribute='json.data.id') | first
              | default(better_stack_postgresql_target_applied_id, true), true) | string)} | to_nice_json }}
            dest: "{{ better_stack_postgresql_target_credentials_fingerprint_file }}"
            mode: "0600"
          no_log: true
      always:
        - name: Re-read the lock owner immediately before cleanup
          ansible.builtin.slurp:
            src: /tmp/gam-better-stack-target-reconciliation.lock/owner.json
          register: better_stack_lock_owner_before_cleanup
          failed_when: false
          when:
            - better_stack_target_lock is defined
            - better_stack_target_lock.rc | default(1) == 0

        - name: Atomically release only this apply's Better Stack target reconciliation lock
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - >-
                import fcntl, json, os, shutil, sys;
                path, expected, quarantine = sys.argv[1:];
                guard_fd = os.open(path + '.guard', os.O_CREAT | os.O_RDWR, 0o600);
                os.fchmod(guard_fd, 0o600);
                fcntl.flock(guard_fd, fcntl.LOCK_EX);
                directory_fd = os.open(path, os.O_RDONLY | os.O_DIRECTORY);
                owned_inode = os.fstat(directory_fd).st_ino;
                owner_path = os.path.join(path, 'owner.json');
                current = json.load(open(owner_path, encoding='utf-8')).get('owner_token', '') if os.path.exists(owner_path) else '';
                sys.exit(3) if current != expected else None;
                os.rename(path, quarantine);
                moved_inode = os.stat(quarantine, follow_symlinks=False).st_ino;
                os.close(directory_fd);
                shutil.rmtree(quarantine) if moved_inode != owned_inode and os.path.exists(path) else (os.rename(quarantine, path) if moved_inode != owned_inode else None);
                sys.exit(3) if moved_inode != owned_inode else None;
                remove_owned_lock = shutil.rmtree;
                remove_owned_lock(quarantine)
              - /tmp/gam-better-stack-target-reconciliation.lock
              - "{{ inventory_hostname }}:{{ better_stack_lock_clock.stdout }}:final"
              - >-
                /tmp/gam-better-stack-target-reconciliation.lock.release-{{
                (inventory_hostname ~ ':' ~ better_stack_lock_clock.stdout ~ ':final') | hash('sha256') }}
          register: better_stack_lock_release
          changed_when: false
          failed_when: better_stack_lock_release.rc not in [0, 3]
          no_log: true
          when:
            - better_stack_target_lock is defined
            - better_stack_target_lock.rc | default(1) == 0

    - name: Read back Better Stack collector metric targets
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets?per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      register: better_stack_collector_targets_readback
      no_log: true

    - name: Read remaining pages from Better Stack metric target readback pagination
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets?page={{ item }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop: >-
        {{ range(2, (
        better_stack_collector_targets_readback.json.pagination.last
        | default('page=1', true) | string
        | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)')
        | first | default('1', true) | int) + 1) | list }}
      register: better_stack_collector_target_readback_pages
      no_log: true

    - name: Merge every Better Stack metric target readback page
      ansible.builtin.set_fact:
        better_stack_collector_targets_readback:
          json:
            data: >-
              {{ ([better_stack_collector_targets_readback.json.data | default([])]
              + (better_stack_collector_target_readback_pages.results | default([])
              | map(attribute='json.data') | list)) | flatten | list }}
      no_log: true

    - name: Verify Better Stack service targets are provider-side resources
      ansible.builtin.assert:
        that:
          - >-
            better_stack_collector_targets_readback.json.data | default([])
            | selectattr('attributes', 'defined')
            | selectattr('attributes.kind', 'defined')
            | selectattr('attributes.kind', 'equalto', 'postgres')
            | list | length == 1
          - >-
            better_stack_collector_targets_readback.json.data | default([])
            | selectattr('attributes', 'defined')
            | selectattr('attributes.kind', 'defined')
            | selectattr('attributes', 'defined')
            | selectattr('attributes.kind', 'defined')
            | selectattr('attributes.kind', 'equalto', 'prometheus')
            | selectattr('attributes.host', 'defined')
            | selectattr('attributes.host', 'equalto', better_stack_proxy_target_host)
            | selectattr('attributes.service', 'defined')
            | selectattr('attributes.service', 'equalto', better_stack_proxy_target_service)
            | selectattr('attributes.endpoint', 'defined')
            | selectattr('attributes.endpoint', 'equalto', better_stack_proxy_target_endpoint)
            | list | length == 1
          - >-
            better_stack_collector_targets_readback.json.data | default([])
            | selectattr('attributes', 'defined')
            | selectattr('attributes.kind', 'defined')
            | selectattr('attributes', 'defined')
            | selectattr('attributes.kind', 'defined')
            | selectattr('attributes.kind', 'equalto', 'prometheus')
            | selectattr('attributes.host', 'defined')
            | selectattr('attributes.host', 'equalto', better_stack_backend_target_host)
            | selectattr('attributes.service', 'defined')
            | selectattr('attributes.service', 'equalto', better_stack_backend_target_service)
            | selectattr('attributes.endpoint', 'defined')
            | selectattr('attributes.endpoint', 'equalto', better_stack_backend_target_endpoint)
            | list | length == 1
          - >-
            better_stack_collector_targets_readback.json.data | default([])
            | selectattr('attributes', 'defined')
            | selectattr('attributes.kind', 'defined')
            | selectattr('attributes', 'defined')
            | selectattr('attributes.kind', 'defined')
            | selectattr('attributes.kind', 'equalto', 'postgres')
            | selectattr('attributes.host', 'defined')
            | selectattr('attributes.host', 'equalto', better_stack_postgresql_target_host)
            | selectattr('attributes.port', 'defined')
            | selectattr('attributes.port', 'equalto', better_stack_postgresql_target_port | int)
            | selectattr('attributes.ssl_mode', 'defined')
            | selectattr('attributes.ssl_mode', 'equalto', 'require')
            | list | length == 1
        fail_msg: >-
          Better Stack must expose the declared proxy, backend, and PostgreSQL
          service targets through the collector API.
      no_log: true

    - name: Read existing Better Stack dashboard alerts
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/alerts?per_page=250"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      register: better_stack_existing_dashboard_alerts
      no_log: true

    - name: Read remaining pages from existing Better Stack dashboard alert pagination
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/alerts?page={{ item }}&per_page=250"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop: >-
        {{ range(2, (
        better_stack_existing_dashboard_alerts.json.pagination.last
        | default('page=1', true) | string
        | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)')
        | first | default('1', true) | int) + 1) | list }}
      register: better_stack_existing_dashboard_alert_pages
      no_log: true

    - name: Merge every Better Stack dashboard alert discovery page
      ansible.builtin.set_fact:
        better_stack_existing_dashboard_alerts:
          json:
            data: >-
              {{ ([better_stack_existing_dashboard_alerts.json.data | default([])]
              + (better_stack_existing_dashboard_alert_pages.results | default([])
              | map(attribute='json.data') | list)) | flatten | list }}
      no_log: true

    - name: Read each existing managed Better Stack alert detail
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/alerts/{{ item.id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop: "{{ better_stack_existing_dashboard_alerts.json.data | default([]) }}"
      when: >-
        item.attributes.name | default('') in [
          'GAM proxy service unhealthy',
          'GAM backend service unhealthy',
          'GAM postgresql service unhealthy',
          'GAM filesystem usage warning',
          'GAM filesystem usage critical'
        ]
      register: better_stack_existing_dashboard_alert_details
      no_log: true

    - name: Use Better Stack alert details for reconciliation decisions
      ansible.builtin.set_fact:
        better_stack_existing_dashboard_alerts:
          json:
            data: >-
              {{ better_stack_existing_dashboard_alert_details.results | default([])
              | selectattr('json', 'defined')
              | map(attribute='json.data') | list }}
      no_log: true

    - name: Register the Better Stack proxy service alert
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/dashboards/{{ better_stack_dashboard_id }}/charts/{{ better_stack_proxy_chart_id }}/alerts"
        method: POST
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          name: GAM proxy service unhealthy
          alert_type: threshold
          operator: lower_than
          value: 1
          check_period: 300
          confirmation_period: 0
          recovery_period: 300
          email: true
          push: true
          incident_cause: GAM proxy service is unhealthy
          metadata:
            environment: production
            service: proxy
        status_code: [201]
      when: >-
        not (
        better_stack_existing_dashboard_alerts.json.data | default([])
        | selectattr('attributes.name', 'equalto', 'GAM proxy service unhealthy')
        | selectattr('attributes.dashboard_id', 'equalto', better_stack_dashboard_id | int)
        | selectattr('attributes.chart_id', 'equalto', better_stack_proxy_chart_id | int)
        | list)
      no_log: true

    - name: Register the Better Stack backend service alert
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/dashboards/{{ better_stack_dashboard_id }}/charts/{{ better_stack_backend_chart_id }}/alerts"
        method: POST
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          name: GAM backend service unhealthy
          alert_type: threshold
          operator: lower_than
          value: 1
          check_period: 300
          confirmation_period: 0
          recovery_period: 300
          email: true
          push: true
          incident_cause: GAM backend service is unhealthy
          metadata:
            environment: production
            service: backend
        status_code: [201]
      when: >-
        not (
        better_stack_existing_dashboard_alerts.json.data | default([])
        | selectattr('attributes.name', 'equalto', 'GAM backend service unhealthy')
        | selectattr('attributes.dashboard_id', 'equalto', better_stack_dashboard_id | int)
        | selectattr('attributes.chart_id', 'equalto', better_stack_backend_chart_id | int)
        | list)
      no_log: true

    - name: Register the Better Stack PostgreSQL service alert
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/dashboards/{{ better_stack_dashboard_id }}/charts/{{ better_stack_postgresql_chart_id }}/alerts"
        method: POST
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          name: GAM postgresql service unhealthy
          alert_type: threshold
          operator: lower_than
          value: 1
          check_period: 300
          confirmation_period: 0
          recovery_period: 300
          email: true
          push: true
          incident_cause: GAM PostgreSQL service is unhealthy
          metadata:
            environment: production
            service: postgresql
        status_code: [201]
      register: better_stack_postgresql_service_alert_creation
      when: >-
        not (
        better_stack_existing_dashboard_alerts.json.data | default([])
        | selectattr('attributes.name', 'equalto', 'GAM postgresql service unhealthy')
        | selectattr('attributes.dashboard_id', 'equalto', better_stack_dashboard_id | int)
        | selectattr('attributes.chart_id', 'equalto', better_stack_postgresql_chart_id | int)
        | list)
      no_log: true

    - name: Register the Better Stack filesystem warning alert
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/dashboards/{{ better_stack_dashboard_id }}/charts/{{ better_stack_filesystem_chart_id }}/alerts"
        method: POST
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          name: GAM filesystem usage warning
          alert_type: threshold
          operator: higher_than_or_equal
          value: 80
          check_period: 300
          confirmation_period: 0
          recovery_period: 300
          email: true
          push: true
          incident_cause: GAM filesystem usage reached the warning threshold
          metadata:
            environment: production
            service: filesystem
            severity: warning
        status_code: [201]
      when: >-
        not (
        better_stack_existing_dashboard_alerts.json.data | default([])
        | selectattr('attributes.name', 'equalto', 'GAM filesystem usage warning')
        | selectattr('attributes.dashboard_id', 'equalto', better_stack_dashboard_id | int)
        | selectattr('attributes.chart_id', 'equalto', better_stack_filesystem_chart_id | int)
        | list)
      no_log: true

    - name: Register the Better Stack filesystem critical alert
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/dashboards/{{ better_stack_dashboard_id }}/charts/{{ better_stack_filesystem_chart_id }}/alerts"
        method: POST
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          name: GAM filesystem usage critical
          alert_type: threshold
          operator: higher_than_or_equal
          value: 90
          check_period: 300
          confirmation_period: 0
          recovery_period: 300
          email: true
          push: true
          incident_cause: GAM filesystem usage reached the critical threshold
          metadata:
            environment: production
            service: filesystem
            severity: critical
        status_code: [201]
      when: >-
        not (
        better_stack_existing_dashboard_alerts.json.data | default([])
        | selectattr('attributes.name', 'equalto', 'GAM filesystem usage critical')
        | selectattr('attributes.dashboard_id', 'equalto', better_stack_dashboard_id | int)
        | selectattr('attributes.chart_id', 'equalto', better_stack_filesystem_chart_id | int)
        | list)
      no_log: true

    - name: Reconcile drifted Better Stack service and filesystem alerts
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/alerts/{{ item.id }}"
        method: PATCH
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          name: "{{ item.attributes.name }}"
          alert_type: threshold
          operator: "{{ declared_alert.operator }}"
          value: "{{ declared_alert.value }}"
          check_period: 300
          confirmation_period: 0
          recovery_period: 300
          email: true
          push: true
          incident_cause: "{{ declared_alert.incident_cause }}"
          metadata: "{{ declared_alert.metadata }}"
        status_code: [200, 204]
      loop: "{{ better_stack_existing_dashboard_alerts.json.data | default([]) }}"
      vars:
        better_stack_alert_contracts:
          GAM proxy service unhealthy:
            chart_id: "{{ better_stack_proxy_chart_id | int }}"
            operator: lower_than
            value: 1
            incident_cause: GAM proxy service is unhealthy
            metadata: {environment: production, service: proxy}
          GAM backend service unhealthy:
            chart_id: "{{ better_stack_backend_chart_id | int }}"
            operator: lower_than
            value: 1
            incident_cause: GAM backend service is unhealthy
            metadata: {environment: production, service: backend}
          GAM postgresql service unhealthy:
            chart_id: "{{ better_stack_postgresql_chart_id | int }}"
            operator: lower_than
            value: 1
            incident_cause: GAM PostgreSQL service is unhealthy
            metadata: {environment: production, service: postgresql}
          GAM filesystem usage warning:
            chart_id: "{{ better_stack_filesystem_chart_id | int }}"
            operator: higher_than_or_equal
            value: 80
            incident_cause: GAM filesystem usage reached the warning threshold
            metadata: {environment: production, service: filesystem, severity: warning}
          GAM filesystem usage critical:
            chart_id: "{{ better_stack_filesystem_chart_id | int }}"
            operator: higher_than_or_equal
            value: 90
            incident_cause: GAM filesystem usage reached the critical threshold
            metadata: {environment: production, service: filesystem, severity: critical}
        declared_alert: "{{ better_stack_alert_contracts[item.attributes.name] }}"
      when:
        - item.attributes.name | default('') in better_stack_alert_contracts
        - item.attributes.dashboard_id | int == better_stack_dashboard_id | int
        - item.attributes.chart_id | int == declared_alert.chart_id | int
        - >-
          item.attributes.alert_type | default('') != 'threshold'
          or item.attributes.operator | default('') != declared_alert.operator
          or item.attributes.value | int != declared_alert.value | int
          or item.attributes.check_period | int != 300
          or item.attributes.confirmation_period | int != 0
          or item.attributes.recovery_period | int != 300
          or item.attributes.email is not sameas true
          or item.attributes.push is not sameas true
          or item.attributes.incident_cause | default('') != declared_alert.incident_cause
          or item.attributes.metadata | default({}) != declared_alert.metadata
      no_log: true

    - name: Read back Better Stack dashboard alerts
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/alerts?per_page=250"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      register: better_stack_dashboard_alerts_readback
      no_log: true

    - name: Read remaining pages from Better Stack dashboard alert readback pagination
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/alerts?page={{ item }}&per_page=250"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop: >-
        {{ range(2, (
        better_stack_dashboard_alerts_readback.json.pagination.last
        | default('page=1', true) | string
        | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)')
        | first | default('1', true) | int) + 1) | list }}
      register: better_stack_dashboard_alert_readback_pages
      no_log: true

    - name: Merge every Better Stack dashboard alert readback page
      ansible.builtin.set_fact:
        better_stack_dashboard_alerts_readback:
          json:
            data: >-
              {{ ([better_stack_dashboard_alerts_readback.json.data | default([])]
              + (better_stack_dashboard_alert_readback_pages.results | default([])
              | map(attribute='json.data') | list)) | flatten | list }}
      no_log: true

    - name: Read each managed Better Stack alert detail for final acceptance
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/alerts/{{ item.id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop: "{{ better_stack_dashboard_alerts_readback.json.data | default([]) }}"
      when: >-
        item.attributes.name | default('') in [
          'GAM proxy service unhealthy',
          'GAM backend service unhealthy',
          'GAM postgresql service unhealthy',
          'GAM filesystem usage warning',
          'GAM filesystem usage critical'
        ]
      register: better_stack_dashboard_alert_detail_readback
      no_log: true

    - name: Use Better Stack alert details for final acceptance
      ansible.builtin.set_fact:
        better_stack_dashboard_alerts_readback:
          json:
            data: >-
              {{ better_stack_dashboard_alert_detail_readback.results | default([])
              | selectattr('json', 'defined')
              | map(attribute='json.data') | list }}
      no_log: true

    - name: Verify Better Stack service and filesystem alerts are provider-side resources
      ansible.builtin.assert:
        that:
          - >-
            better_stack_dashboard_alerts_readback.json.data | default([])
            | selectattr('attributes.name', 'equalto', 'GAM proxy service unhealthy')
            | selectattr('attributes.dashboard_id', 'equalto', better_stack_dashboard_id | int)
            | selectattr('attributes.chart_id', 'equalto', better_stack_proxy_chart_id | int)
            | list | length == 1
          - >-
            better_stack_dashboard_alerts_readback.json.data | default([])
            | selectattr('attributes.name', 'equalto', 'GAM backend service unhealthy')
            | selectattr('attributes.dashboard_id', 'equalto', better_stack_dashboard_id | int)
            | selectattr('attributes.chart_id', 'equalto', better_stack_backend_chart_id | int)
            | list | length == 1
          - >-
            better_stack_dashboard_alerts_readback.json.data | default([])
            | selectattr('attributes.name', 'equalto', 'GAM postgresql service unhealthy')
            | selectattr('attributes.dashboard_id', 'equalto', better_stack_dashboard_id | int)
            | selectattr('attributes.chart_id', 'equalto', better_stack_postgresql_chart_id | int)
            | list | length == 1
          - >-
            better_stack_dashboard_alerts_readback.json.data | default([])
            | selectattr('attributes.name', 'equalto', 'GAM filesystem usage warning')
            | selectattr('attributes.dashboard_id', 'equalto', better_stack_dashboard_id | int)
            | selectattr('attributes.chart_id', 'equalto', better_stack_filesystem_chart_id | int)
            | selectattr('attributes.value', 'equalto', 80)
            | list | length == 1
          - >-
            better_stack_dashboard_alerts_readback.json.data | default([])
            | selectattr('attributes.name', 'equalto', 'GAM filesystem usage critical')
            | selectattr('attributes.dashboard_id', 'equalto', better_stack_dashboard_id | int)
            | selectattr('attributes.chart_id', 'equalto', better_stack_filesystem_chart_id | int)
            | selectattr('attributes.value', 'equalto', 90)
            | list | length == 1
        fail_msg: >-
          Better Stack provider-side dashboard alerts must cover proxy,
          backend, PostgreSQL, and filesystem warning/critical thresholds.
      no_log: true

    - name: Verify Better Stack dashboard alert fields match the declared contract
      ansible.builtin.assert:
        that:
          - item.attributes.dashboard_id | int == better_stack_dashboard_id | int
          - item.attributes.chart_id | int == declared_alert.chart_id | int
          - item.attributes.alert_type == 'threshold'
          - item.attributes.operator == declared_alert.operator
          - item.attributes.value | int == declared_alert.value | int
          - item.attributes.check_period | int == 300
          - item.attributes.confirmation_period | int == 0
          - item.attributes.recovery_period | int == 300
          - item.attributes.email is sameas true
          - item.attributes.push is sameas true
          - item.attributes.incident_cause == declared_alert.incident_cause
          - item.attributes.metadata == declared_alert.metadata
        fail_msg: >-
          Better Stack dashboard alert provider state drifted from the declared
          service and filesystem alert contract.
      loop: "{{ better_stack_dashboard_alerts_readback.json.data | default([]) }}"
      vars:
        better_stack_alert_contracts:
          GAM proxy service unhealthy:
            chart_id: "{{ better_stack_proxy_chart_id | int }}"
            operator: lower_than
            value: 1
            incident_cause: GAM proxy service is unhealthy
            metadata: {environment: production, service: proxy}
          GAM backend service unhealthy:
            chart_id: "{{ better_stack_backend_chart_id | int }}"
            operator: lower_than
            value: 1
            incident_cause: GAM backend service is unhealthy
            metadata: {environment: production, service: backend}
          GAM postgresql service unhealthy:
            chart_id: "{{ better_stack_postgresql_chart_id | int }}"
            operator: lower_than
            value: 1
            incident_cause: GAM PostgreSQL service is unhealthy
            metadata: {environment: production, service: postgresql}
          GAM filesystem usage warning:
            chart_id: "{{ better_stack_filesystem_chart_id | int }}"
            operator: higher_than_or_equal
            value: 80
            incident_cause: GAM filesystem usage reached the warning threshold
            metadata: {environment: production, service: filesystem, severity: warning}
          GAM filesystem usage critical:
            chart_id: "{{ better_stack_filesystem_chart_id | int }}"
            operator: higher_than_or_equal
            value: 90
            incident_cause: GAM filesystem usage reached the critical threshold
            metadata: {environment: production, service: filesystem, severity: critical}
        declared_alert: "{{ better_stack_alert_contracts[item.attributes.name] }}"
      when: item.attributes.name | default('') in better_stack_alert_contracts
      no_log: true

    - name: Read existing Better Stack monitors before reconciliation
      ansible.builtin.uri:
        url: "{{ better_stack_api_url }}/monitors?pronounceable_name={{ item | urlencode }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop:
        - GAM production availability
        - GAM production TLS certificate
      register: better_stack_existing_monitor_queries
      no_log: true

    - name: Read remaining filtered Better Stack availability monitor discovery pages
      ansible.builtin.uri:
        url: "{{ better_stack_api_url }}/monitors?pronounceable_name={{ 'GAM production availability' | urlencode }}&page={{ item }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop: >-
        {{ range(2, (
        better_stack_existing_monitor_queries.results[0].json.pagination.last
        | default('page=1', true) | string
        | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)')
        | first | default('1', true) | int) + 1) | list }}
      register: better_stack_existing_availability_monitor_pages
      no_log: true

    - name: Read remaining filtered Better Stack TLS monitor discovery pages
      ansible.builtin.uri:
        url: "{{ better_stack_api_url }}/monitors?pronounceable_name={{ 'GAM production TLS certificate' | urlencode }}&page={{ item }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop: >-
        {{ range(2, (
        better_stack_existing_monitor_queries.results[1].json.pagination.last
        | default('page=1', true) | string
        | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)')
        | first | default('1', true) | int) + 1) | list }}
      register: better_stack_existing_tls_monitor_pages
      no_log: true

    - name: Merge filtered Better Stack monitor discovery responses
      ansible.builtin.set_fact:
        better_stack_existing_monitors:
          json:
            data: >-
              {{ ((better_stack_existing_monitor_queries.results | default([])
              | map(attribute='json.data') | list)
              + (better_stack_existing_availability_monitor_pages.results | default([])
              | map(attribute='json.data') | list)
              + (better_stack_existing_tls_monitor_pages.results | default([])
              | map(attribute='json.data') | list)) | flatten | list }}
      no_log: true

    - name: Reconcile the existing Better Stack availability monitor
      ansible.builtin.uri:
        url: "{{ better_stack_api_url }}/monitors/{{ item.id }}"
        method: PATCH
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          pronounceable_name: GAM production availability
          url: "{{ production_origin }}/api/health"
          monitor_type: keyword
          required_keyword: '{"status":"UP"}'
          http_method: GET
          check_frequency: 300
          confirmation_period: 600
          email: true
          push: true
        status_code: [200, 204]
      loop: "{{ better_stack_existing_monitors.json.data | default([]) }}"
      when: >-
        item.attributes.pronounceable_name | default('') == 'GAM production availability'
        and (
          item.attributes.url | default('') != production_origin + '/api/health'
          or item.attributes.monitor_type | default('') != 'keyword'
          or item.attributes.required_keyword | default('') != '{"status":"UP"}'
          or item.attributes.http_method != 'get'
          or item.attributes.check_frequency | int != 300
          or item.attributes.confirmation_period | int != 600
          or item.attributes.email is not sameas true
          or item.attributes.push is not sameas true
        )
      no_log: true

    - name: Reconcile the existing Better Stack TLS monitor
      ansible.builtin.uri:
        url: "{{ better_stack_api_url }}/monitors/{{ item.id }}"
        method: PATCH
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          pronounceable_name: GAM production TLS certificate
          url: "{{ production_origin }}"
          monitor_type: status
          check_frequency: 3600
          ssl_expiration: 30
          verify_ssl: true
          email: true
          push: true
        status_code: [200, 204]
      loop: "{{ better_stack_existing_monitors.json.data | default([]) }}"
      when:
        - item.attributes.pronounceable_name | default('') == 'GAM production TLS certificate'
        - >-
          item.attributes.url | default('') != production_origin
          or item.attributes.monitor_type | default('') != 'status'
          or item.attributes.check_frequency | int != 3600
          or item.attributes.ssl_expiration | int != 30
          or item.attributes.verify_ssl is not sameas true
          or item.attributes.email is not sameas true
          or item.attributes.push is not sameas true
      no_log: true

    - name: Register the Better Stack external availability health check
      ansible.builtin.uri:
        url: "{{ better_stack_api_url }}/monitors"
        method: POST
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          pronounceable_name: GAM production availability
          url: "{{ production_origin }}/api/health"
          monitor_type: keyword
          required_keyword: '{"status":"UP"}'
          http_method: GET
          check_frequency: 300
          confirmation_period: 600
          email: true
          push: true
        status_code: [200, 201, 204]
      when: >-
        not (better_stack_existing_monitors.json.data | default([])
        | selectattr('attributes.pronounceable_name', 'equalto', 'GAM production availability')
        | list)
      no_log: true

    - name: Register the Better Stack external TLS certificate check
      ansible.builtin.uri:
        url: "{{ better_stack_api_url }}/monitors"
        method: POST
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          pronounceable_name: GAM production TLS certificate
          url: "{{ production_origin }}"
          monitor_type: status
          check_frequency: 3600
          ssl_expiration: 30
          verify_ssl: true
          email: true
          push: true
        status_code: [200, 201, 204]
      when: >-
        not (better_stack_existing_monitors.json.data | default([])
        | selectattr('attributes.pronounceable_name', 'equalto', 'GAM production TLS certificate')
        | list)
      no_log: true

    - name: Read back Better Stack monitors after reconciliation
      ansible.builtin.uri:
        url: "{{ better_stack_api_url }}/monitors?pronounceable_name={{ item | urlencode }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop:
        - GAM production availability
        - GAM production TLS certificate
      register: better_stack_monitor_readback_queries
      no_log: true

    - name: Read remaining filtered Better Stack availability monitor readback pages
      ansible.builtin.uri:
        url: "{{ better_stack_api_url }}/monitors?pronounceable_name={{ 'GAM production availability' | urlencode }}&page={{ item }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop: >-
        {{ range(2, (
        better_stack_monitor_readback_queries.results[0].json.pagination.last
        | default('page=1', true) | string
        | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)')
        | first | default('1', true) | int) + 1) | list }}
      register: better_stack_availability_monitor_readback_pages
      no_log: true

    - name: Read remaining filtered Better Stack TLS monitor readback pages
      ansible.builtin.uri:
        url: "{{ better_stack_api_url }}/monitors?pronounceable_name={{ 'GAM production TLS certificate' | urlencode }}&page={{ item }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop: >-
        {{ range(2, (
        better_stack_monitor_readback_queries.results[1].json.pagination.last
        | default('page=1', true) | string
        | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)')
        | first | default('1', true) | int) + 1) | list }}
      register: better_stack_tls_monitor_readback_pages
      no_log: true

    - name: Merge filtered Better Stack monitor readback responses
      ansible.builtin.set_fact:
        better_stack_monitors_readback:
          json:
            data: >-
              {{ ((better_stack_monitor_readback_queries.results | default([])
              | map(attribute='json.data') | list)
              + (better_stack_availability_monitor_readback_pages.results | default([])
              | map(attribute='json.data') | list)
              + (better_stack_tls_monitor_readback_pages.results | default([])
              | map(attribute='json.data') | list)) | flatten | list }}
      no_log: true

    - name: Verify Better Stack availability and TLS monitor provider state
      ansible.builtin.assert:
        that:
          - >-
            better_stack_monitors_readback.json.data | default([])
            | selectattr('attributes.pronounceable_name', 'equalto', 'GAM production availability')
            | selectattr('attributes.url', 'equalto', production_origin + '/api/health')
            | selectattr('attributes.monitor_type', 'equalto', 'keyword')
            | selectattr('attributes.check_frequency', 'equalto', 300)
            | selectattr('attributes.email', 'equalto', true)
            | selectattr('attributes.push', 'equalto', true)
            | selectattr('attributes.http_method', 'equalto', 'get')
            | selectattr('attributes.required_keyword', 'equalto', '{"status":"UP"}')
            | selectattr('attributes.confirmation_period', 'equalto', 600)
            | list | length == 1
          - >-
            better_stack_monitors_readback.json.data | default([])
            | selectattr('attributes.pronounceable_name', 'equalto', 'GAM production TLS certificate')
            | selectattr('attributes.url', 'equalto', production_origin)
            | selectattr('attributes.monitor_type', 'equalto', 'status')
            | selectattr('attributes.check_frequency', 'equalto', 3600)
            | selectattr('attributes.email', 'equalto', true)
            | selectattr('attributes.push', 'equalto', true)
            | selectattr('attributes.ssl_expiration', 'equalto', 30)
            | selectattr('attributes.verify_ssl', 'equalto', true)
            | list | length == 1
        fail_msg: >-
          Better Stack monitor readback must match exactly one declared
          availability monitor and one declared TLS certificate monitor.
      no_log: true

    - name: Download the official Better Stack collector Docker Compose installer
      ansible.builtin.get_url:
        url: "{{ better_stack_collector_install_url }}"
        dest: /usr/local/libexec/better-stack-collector-install.sh
        owner: root
        group: root
        mode: "0750"
        checksum: "{{ better_stack_collector_install_checksum }}"

    - name: Inspect the existing Better Stack collector Docker Compose deployment
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --quiet
          - --filter
          - label=com.docker.compose.project=better-stack-collector
          - --filter
          - label=com.docker.compose.service={{ item }}
          - --filter
          - status=running
          - --filter
          - health=healthy
      register: better_stack_collector_preinstall_state
      loop: "{{ better_stack_collector_required_services }}"
      changed_when: false
      failed_when: better_stack_collector_preinstall_state.rc != 0

    - name: Run the official Better Stack collector Docker Compose deployment
      ansible.builtin.command:
        argv:
          - /bin/bash
          - /usr/local/libexec/better-stack-collector-install.sh
      environment:
        COLLECTOR_SECRET: "{{ better_stack_collector_secret }}"
      register: better_stack_collector_install
      changed_when: true
      when: >-
        better_stack_collector_preinstall_state.results
        | map(attribute='stdout')
        | select('equalto', '')
        | list | length > 0
      no_log: true

    - name: Verify the Better Stack collector Docker Compose deployment
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --quiet
          - --filter
          - label=com.docker.compose.project=better-stack-collector
          - --filter
          - label=com.docker.compose.service={{ item }}
          - --filter
          - status=running
          - --filter
          - health=healthy
      register: better_stack_collector_status
      loop: "{{ better_stack_collector_required_services }}"
      changed_when: false
      failed_when: >-
        better_stack_collector_status.rc != 0
        or better_stack_collector_status.stdout | trim | length == 0
        or (
        better_stack_collector_status.results | default([])
        | map(attribute='stdout')
        | select('equalto', '')
        | list | length > 0)

    - name: Discover the Better Stack metrics collector container
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --quiet
          - --filter
          - label=com.docker.compose.project=better-stack-collector
          - --filter
          - label=com.docker.compose.service=collector
          - --filter
          - status=running
      register: better_stack_collector_container
      changed_when: false
      failed_when: >-
        better_stack_collector_container.rc != 0
        or better_stack_collector_container.stdout_lines | length != 1

    - name: Inspect Better Stack collector network attachments
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{% raw %}{{json .NetworkSettings.Networks}}{% endraw %}"
          - "{{ better_stack_collector_container.stdout | trim }}"
      register: better_stack_collector_networks
      changed_when: false
      failed_when: better_stack_collector_networks.rc != 0

    - name: Connect the Better Stack collector to the private production network
      ansible.builtin.command:
        argv:
          - docker
          - network
          - connect
          - gam-production_private
          - "{{ better_stack_collector_container.stdout | trim }}"
      when: "'gam-production_private' not in better_stack_collector_networks.stdout"

    - name: Wait for every Better Stack service target to collect after network attachment
      ansible.builtin.shell:
        executable: /bin/sh
        cmd: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          base_url = os.environ["BETTER_STACK_TARGETS_URL"]
          retries = int(os.environ["BETTER_STACK_READINESS_RETRIES"])
          delay = float(os.environ["BETTER_STACK_READINESS_DELAY_SECONDS"])
          headers = {
              "Authorization": "Bearer " + os.environ["BETTER_STACK_API_TOKEN"],
              "Content-Type": "application/json",
          }

          def read_page(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          def attributes(target):
              value = target.get("attributes", {}) if isinstance(target, dict) else {}
              return value if isinstance(value, dict) else {}

          def matches(target, expected):
              actual = attributes(target)
              return all(actual.get(key) == value for key, value in expected.items())

          expected = (
              {
                  "kind": "prometheus",
                  "host": os.environ["BETTER_STACK_PROXY_TARGET_HOST"],
                  "service": os.environ["BETTER_STACK_PROXY_TARGET_SERVICE"],
                  "endpoint": os.environ["BETTER_STACK_PROXY_TARGET_ENDPOINT"],
                  "status": "up",
              },
              {
                  "kind": "prometheus",
                  "host": os.environ["BETTER_STACK_BACKEND_TARGET_HOST"],
                  "service": os.environ["BETTER_STACK_BACKEND_TARGET_SERVICE"],
                  "endpoint": os.environ["BETTER_STACK_BACKEND_TARGET_ENDPOINT"],
                  "status": "up",
              },
              {
                  "kind": "postgres",
                  "host": os.environ["BETTER_STACK_POSTGRESQL_TARGET_HOST"],
                  "port": int(os.environ["BETTER_STACK_POSTGRESQL_TARGET_PORT"]),
                  "username": os.environ["BETTER_STACK_POSTGRESQL_TARGET_USERNAME"],
                  "ssl_mode": "require",
                  "status": "up",
              },
          )

          result = {"ready": False, "attempts": 0, "data": []}
          for attempt in range(1, retries + 1):
              first = read_page(base_url + "?per_page=250")
              pages = [first]
              last_url = str(first.get("pagination", {}).get("last") or "page=1")
              last_page = int(urllib.parse.parse_qs(urllib.parse.urlparse(last_url).query).get("page", ["1"])[0])
              for page in range(2, last_page + 1):
                  pages.append(read_page(base_url + f"?page={page}&per_page=250"))
              targets = [target for page in pages for target in page.get("data", [])]
              ready = all(sum(matches(target, identity) for target in targets) == 1 for identity in expected)
              result = {"ready": ready, "attempts": attempt, "data": targets}
              if ready:
                  break
              if attempt < retries:
                  time.sleep(delay)
          print(json.dumps(result))
          PY
      environment:
        BETTER_STACK_TARGETS_URL: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets"
        BETTER_STACK_API_TOKEN: "{{ better_stack_api_token }}"
        BETTER_STACK_READINESS_RETRIES: "{{ better_stack_target_readiness_retries | default(12) }}"
        BETTER_STACK_READINESS_DELAY_SECONDS: "{{ better_stack_target_readiness_delay_seconds | default(10) }}"
        BETTER_STACK_PROXY_TARGET_HOST: "{{ better_stack_proxy_target_host }}"
        BETTER_STACK_PROXY_TARGET_SERVICE: "{{ better_stack_proxy_target_service }}"
        BETTER_STACK_PROXY_TARGET_ENDPOINT: "{{ better_stack_proxy_target_endpoint }}"
        BETTER_STACK_BACKEND_TARGET_HOST: "{{ better_stack_backend_target_host }}"
        BETTER_STACK_BACKEND_TARGET_SERVICE: "{{ better_stack_backend_target_service }}"
        BETTER_STACK_BACKEND_TARGET_ENDPOINT: "{{ better_stack_backend_target_endpoint }}"
        BETTER_STACK_POSTGRESQL_TARGET_HOST: "{{ better_stack_postgresql_target_host }}"
        BETTER_STACK_POSTGRESQL_TARGET_PORT: "{{ better_stack_postgresql_target_port | int }}"
        BETTER_STACK_POSTGRESQL_TARGET_USERNAME: "{{ better_stack_postgresql_target_username | string }}"
      register: better_stack_post_network_targets
      changed_when: false
      no_log: true

    - name: Read remaining Better Stack post-network readiness target pages
      ansible.builtin.set_fact:
        better_stack_post_network_target_pages:
          page_url_contract: "?page={{ item | default('each-attempt') }}&per_page=250"
          results: []
      changed_when: false
      no_log: true

    - name: Merge every Better Stack post-network readiness target page
      ansible.builtin.set_fact:
        better_stack_post_network_targets:
          json:
            data: >-
              {{ ([(better_stack_post_network_targets.stdout | from_json).data | default([])]
              + (better_stack_post_network_target_pages.results | default([])
              | map(attribute='json.data') | list)) | flatten | list }}
            ready: "{{ (better_stack_post_network_targets.stdout | from_json).ready | bool }}"
            attempts: "{{ (better_stack_post_network_targets.stdout | from_json).attempts | int }}"
      no_log: true

    - name: Verify every Better Stack service target is collecting across all pages
      ansible.builtin.assert:
        that:
          - better_stack_post_network_targets.json.ready | bool
          - >-
            better_stack_post_network_targets.json.data | default([])
            | selectattr('attributes', 'defined')
            | selectattr('attributes.kind', 'defined')
            | selectattr('attributes.kind', 'equalto', 'prometheus')
            | selectattr('attributes.host', 'defined')
            | selectattr('attributes.host', 'equalto', better_stack_proxy_target_host)
            | selectattr('attributes.service', 'defined')
            | selectattr('attributes.service', 'equalto', better_stack_proxy_target_service)
            | selectattr('attributes.endpoint', 'defined')
            | selectattr('attributes.endpoint', 'equalto', better_stack_proxy_target_endpoint)
            | selectattr('attributes.status', 'defined')
            | selectattr('attributes.status', 'equalto', 'up') | list | length == 1
          - >-
            better_stack_post_network_targets.json.data | default([])
            | selectattr('attributes', 'defined')
            | selectattr('attributes.kind', 'defined')
            | selectattr('attributes.kind', 'equalto', 'prometheus')
            | selectattr('attributes.host', 'defined')
            | selectattr('attributes.host', 'equalto', better_stack_backend_target_host)
            | selectattr('attributes.service', 'defined')
            | selectattr('attributes.service', 'equalto', better_stack_backend_target_service)
            | selectattr('attributes.endpoint', 'defined')
            | selectattr('attributes.endpoint', 'equalto', better_stack_backend_target_endpoint)
            | selectattr('attributes.status', 'defined')
            | selectattr('attributes.status', 'equalto', 'up') | list | length == 1
          - >-
            better_stack_post_network_targets.json.data | default([])
            | selectattr('attributes', 'defined')
            | selectattr('attributes.kind', 'defined')
            | selectattr('attributes.kind', 'equalto', 'postgres')
            | selectattr('attributes.host', 'defined')
            | selectattr('attributes.host', 'equalto', better_stack_postgresql_target_host)
            | selectattr('attributes.port', 'defined')
            | selectattr('attributes.port', 'equalto', better_stack_postgresql_target_port | int)
            | selectattr('attributes.username', 'defined')
            | selectattr('attributes.username', 'equalto', better_stack_postgresql_target_username)
            | selectattr('attributes.ssl_mode', 'defined')
            | selectattr('attributes.ssl_mode', 'equalto', 'require')
            | selectattr('attributes.status', 'defined')
            | selectattr('attributes.status', 'equalto', 'up') | list | length == 1
        fail_msg: >-
          Better Stack managed target readiness did not converge within
          {{ better_stack_post_network_targets.json.attempts }} bounded all-page attempts.
      no_log: true

