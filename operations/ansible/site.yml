    - name: Verify Better Stack service and filesystem alerts are provider-side resources
      ansible.builtin.assert:
        that:
          - >-
            better_stack_dashboard_alerts_readback.json.data | default([])
            | selectattr('attributes.name', 'equalto', 'GAM proxy service unhealthy')
            | selectattr('attributes.dashboard_id', 'equalto', better_stack_dashboard_id | int)
            | selectattr('attributes.chart_id', 'equalto', better_stack_proxy_chart_id | int)
            | list | length == 1
          - >-
            better_stack_dashboard_alerts_readback.json.data | default([])
            | selectattr('attributes.name', 'equalto', 'GAM backend service unhealthy')
            | selectattr('attributes.dashboard_id', 'equalto', better_stack_dashboard_id | int)
            | selectattr('attributes.chart_id', 'equalto', better_stack_backend_chart_id | int)
            | list | length == 1
          - >-
            better_stack_dashboard_alerts_readback.json.data | default([])
            | selectattr('attributes.name', 'equalto', 'GAM postgresql service unhealthy')
            | selectattr('attributes.dashboard_id', 'equalto', better_stack_dashboard_id | int)
            | selectattr('attributes.chart_id', 'equalto', better_stack_postgresql_chart_id | int)
            | list | length == 1
          - >-
            better_stack_dashboard_alerts_readback.json.data | default([])
            | selectattr('attributes.name', 'equalto', 'GAM filesystem usage warning')
            | selectattr('attributes.dashboard_id', 'equalto', better_stack_dashboard_id | int)
            | selectattr('attributes.chart_id', 'equalto', better_stack_filesystem_chart_id | int)
            | selectattr('attributes.value', 'equalto', 80)
            | list | length == 1
          - >-
            better_stack_dashboard_alerts_readback.json.data | default([])
            | selectattr('attributes.name', 'equalto', 'GAM filesystem usage critical')
            | selectattr('attributes.dashboard_id', 'equalto', better_stack_dashboard_id | int)
            | selectattr('attributes.chart_id', 'equalto', better_stack_filesystem_chart_id | int)
            | selectattr('attributes.value', 'equalto', 90)
            | list | length == 1
        fail_msg: >-
          Better Stack provider-side dashboard alerts must cover proxy,
          backend, PostgreSQL, and filesystem warning/critical thresholds.
      no_log: true

    - name: Verify Better Stack dashboard alert fields match the declared contract
      ansible.builtin.assert:
        that:
          - item.attributes.dashboard_id | int == better_stack_dashboard_id | int
          - item.attributes.chart_id | int == declared_alert.chart_id | int
          - item.attributes.alert_type == 'threshold'
          - item.attributes.operator == declared_alert.operator
          - item.attributes.value | int == declared_alert.value | int
          - item.attributes.check_period | int == 300
          - item.attributes.confirmation_period | int == 0
          - item.attributes.recovery_period | int == 300
          - item.attributes.email is sameas true
          - item.attributes.push is sameas true
          - item.attributes.incident_cause == declared_alert.incident_cause
          - item.attributes.metadata == declared_alert.metadata
        fail_msg: >-
          Better Stack dashboard alert provider state drifted from the declared
          service and filesystem alert contract.
      loop: "{{ better_stack_dashboard_alerts_readback.json.data | default([]) }}"
      vars:
        better_stack_alert_contracts:
          GAM proxy service unhealthy:
            chart_id: "{{ better_stack_proxy_chart_id | int }}"
            operator: lower_than
            value: 1
            incident_cause: GAM proxy service is unhealthy
            metadata: {environment: production, service: proxy}
          GAM backend service unhealthy:
            chart_id: "{{ better_stack_backend_chart_id | int }}"
            operator: lower_than
            value: 1
            incident_cause: GAM backend service is unhealthy
            metadata: {environment: production, service: backend}
          GAM postgresql service unhealthy:
            chart_id: "{{ better_stack_postgresql_chart_id | int }}"
            operator: lower_than
            value: 1
            incident_cause: GAM PostgreSQL service is unhealthy
            metadata: {environment: production, service: postgresql}
          GAM filesystem usage warning:
            chart_id: "{{ better_stack_filesystem_chart_id | int }}"
            operator: higher_than_or_equal
            value: 80
            incident_cause: GAM filesystem usage reached the warning threshold
            metadata: {environment: production, service: filesystem, severity: warning}
          GAM filesystem usage critical:
            chart_id: "{{ better_stack_filesystem_chart_id | int }}"
            operator: higher_than_or_equal
            value: 90
            incident_cause: GAM filesystem usage reached the critical threshold
            metadata: {environment: production, service: filesystem, severity: critical}
        declared_alert: "{{ better_stack_alert_contracts[item.attributes.name] }}"
      when: item.attributes.name | default('') in better_stack_alert_contracts
      no_log: true

    - name: Read existing Better Stack monitors before reconciliation
      ansible.builtin.uri:
        url: "{{ better_stack_api_url }}/monitors?pronounceable_name={{ item | urlencode }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop:
        - GAM production availability
        - GAM production TLS certificate
      register: better_stack_existing_monitor_queries
      no_log: true

    - name: Read remaining filtered Better Stack availability monitor discovery pages
      ansible.builtin.uri:
        url: "{{ better_stack_api_url }}/monitors?pronounceable_name={{ 'GAM production availability' | urlencode }}&page={{ item }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop: >-
        {{ range(2, (
        better_stack_existing_monitor_queries.results[0].json.pagination.last
        | default('page=1', true) | string
        | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)')
        | first | default('1', true) | int) + 1) | list }}
      register: better_stack_existing_availability_monitor_pages
      no_log: true

    - name: Read remaining filtered Better Stack TLS monitor discovery pages
      ansible.builtin.uri:
        url: "{{ better_stack_api_url }}/monitors?pronounceable_name={{ 'GAM production TLS certificate' | urlencode }}&page={{ item }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop: >-
        {{ range(2, (
        better_stack_existing_monitor_queries.results[1].json.pagination.last
        | default('page=1', true) | string
        | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)')
        | first | default('1', true) | int) + 1) | list }}
      register: better_stack_existing_tls_monitor_pages
      no_log: true

    - name: Merge filtered Better Stack monitor discovery responses
      ansible.builtin.set_fact:
        better_stack_existing_monitors:
          json:
            data: >-
              {{ ((better_stack_existing_monitor_queries.results | default([])
              | map(attribute='json.data') | list)
              + (better_stack_existing_availability_monitor_pages.results | default([])
              | map(attribute='json.data') | list)
              + (better_stack_existing_tls_monitor_pages.results | default([])
              | map(attribute='json.data') | list)) | flatten | list }}
      no_log: true

    - name: Reconcile the existing Better Stack availability monitor
      ansible.builtin.uri:
        url: "{{ better_stack_api_url }}/monitors/{{ item.id }}"
        method: PATCH
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          pronounceable_name: GAM production availability
          url: "{{ gam_public_origin }}/api/health"
          monitor_type: keyword
          required_keyword: '{"status":"UP"}'
          http_method: GET
          check_frequency: 300
          confirmation_period: 600
          email: true
          push: true
        status_code: [200, 204]
      loop: "{{ better_stack_existing_monitors.json.data | default([]) }}"
      when: >-
        item.attributes.pronounceable_name | default('') == 'GAM production availability'
        and (
          item.attributes.url | default('') != gam_public_origin + '/api/health'
          or item.attributes.monitor_type | default('') != 'keyword'
          or item.attributes.required_keyword | default('') != '{"status":"UP"}'
          or item.attributes.http_method != 'get'
          or item.attributes.check_frequency | int != 300
          or item.attributes.confirmation_period | int != 600
          or item.attributes.email is not sameas true
          or item.attributes.push is not sameas true
        )
      no_log: true

    - name: Reconcile the existing Better Stack TLS monitor
      ansible.builtin.uri:
        url: "{{ better_stack_api_url }}/monitors/{{ item.id }}"
        method: PATCH
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          pronounceable_name: GAM production TLS certificate
          url: "{{ gam_public_origin }}"
          monitor_type: status
          check_frequency: 3600
          ssl_expiration: 30
          verify_ssl: true
          email: true
          push: true
        status_code: [200, 204]
      loop: "{{ better_stack_existing_monitors.json.data | default([]) }}"
      when:
        - item.attributes.pronounceable_name | default('') == 'GAM production TLS certificate'
        - >-
          item.attributes.url | default('') != gam_public_origin
          or item.attributes.monitor_type | default('') != 'status'
          or item.attributes.check_frequency | int != 3600
          or item.attributes.ssl_expiration | int != 30
          or item.attributes.verify_ssl is not sameas true
          or item.attributes.email is not sameas true
          or item.attributes.push is not sameas true
      no_log: true

    - name: Register the Better Stack external availability health check
      ansible.builtin.uri:
        url: "{{ better_stack_api_url }}/monitors"
        method: POST
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          pronounceable_name: GAM production availability
          url: "{{ gam_public_origin }}/api/health"
          monitor_type: keyword
          required_keyword: '{"status":"UP"}'
          http_method: GET
          check_frequency: 300
          confirmation_period: 600
          email: true
          push: true
        status_code: [200, 201, 204]
      when: >-
        not (better_stack_existing_monitors.json.data | default([])
        | selectattr('attributes.pronounceable_name', 'equalto', 'GAM production availability')
        | list)
      no_log: true

    - name: Register the Better Stack external TLS certificate check
      ansible.builtin.uri:
        url: "{{ better_stack_api_url }}/monitors"
        method: POST
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          pronounceable_name: GAM production TLS certificate
          url: "{{ gam_public_origin }}"
          monitor_type: status
          check_frequency: 3600
          ssl_expiration: 30
          verify_ssl: true
          email: true
          push: true
        status_code: [200, 201, 204]
      when: >-
        not (better_stack_existing_monitors.json.data | default([])
        | selectattr('attributes.pronounceable_name', 'equalto', 'GAM production TLS certificate')
        | list)
      no_log: true

    - name: Read back Better Stack monitors after reconciliation
      ansible.builtin.uri:
        url: "{{ better_stack_api_url }}/monitors?pronounceable_name={{ item | urlencode }}&per_page=100"
        method: GET
