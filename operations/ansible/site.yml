    - name: Reconcile drifted Better Stack service and filesystem alerts
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v2/alerts/{{ item.id }}"
        method: PATCH
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          name: "{{ item.attributes.name }}"
          alert_type: threshold
          operator: "{{ declared_alert.operator }}"
          value: "{{ declared_alert.value }}"
          check_period: 300
          confirmation_period: 0
          recovery_period: 300
          email: true
          push: true
          incident_cause: "{{ declared_alert.incident_cause }}"
          metadata: "{{ declared_alert.metadata }}"
        status_code: [200, 204]
      loop: "{{ better_stack_existing_dashboard_alerts.json.data | default([]) }}"
      vars:
        better_stack_alert_contracts:
          GAM proxy service unhealthy:
            chart_id: "{{ better_stack_proxy_chart_id | int }}"
            operator: lower_than
            value: 1
            incident_cause: GAM proxy service is unhealthy
            metadata: {environment: production, service: proxy}
          GAM backend service unhealthy:
            chart_id: "{{ better_stack_backend_chart_id | int }}"
            operator: lower_than
            value: 1
            incident_cause: GAM backend service is unhealthy
            metadata: {environment: production, service: backend}
          GAM postgresql service unhealthy:
            chart_id: "{{ better_stack_postgresql_chart_id | int }}"
            operator: lower_than
            value: 1
            incident_cause: GAM PostgreSQL service is unhealthy
            metadata: {environment: production, service: postgresql}
          GAM filesystem usage warning:
            chart_id: "{{ better_stack_filesystem_chart_id | int }}"
            operator: higher_than_or_equal
            value: 80
            incident_cause: GAM filesystem usage reached the warning threshold
            metadata: {environment: production, service: filesystem, severity: warning}
          GAM filesystem usage critical:
