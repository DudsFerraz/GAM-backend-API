        | first | default('1', true) | int) + 1) | list }}
      register: better_stack_availability_monitor_readback_pages
      no_log: true

    - name: Read remaining filtered Better Stack TLS monitor readback pages
      ansible.builtin.uri:
        url: "{{ better_stack_api_url }}/monitors?pronounceable_name={{ 'GAM production TLS certificate' | urlencode }}&page={{ item }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop: >-
        {{ range(2, (
        better_stack_monitor_readback_queries.results[1].json.pagination.last
        | default('page=1', true) | string
        | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)')
        | first | default('1', true) | int) + 1) | list }}
      register: better_stack_tls_monitor_readback_pages
      no_log: true

    - name: Merge filtered Better Stack monitor readback responses
      ansible.builtin.set_fact:
        better_stack_monitors_readback:
          json:
            data: >-
              {{ ((better_stack_monitor_readback_queries.results | default([])
              | map(attribute='json.data') | list)
              + (better_stack_availability_monitor_readback_pages.results | default([])
              | map(attribute='json.data') | list)
              + (better_stack_tls_monitor_readback_pages.results | default([])
              | map(attribute='json.data') | list)) | flatten | list }}
      no_log: true

    - name: Verify Better Stack availability and TLS monitor provider state
      ansible.builtin.assert:
        that:
          - >-
            better_stack_monitors_readback.json.data | default([])
            | selectattr('attributes.pronounceable_name', 'equalto', 'GAM production availability')
            | selectattr('attributes.url', 'equalto', gam_public_origin + '/api/health')
            | selectattr('attributes.monitor_type', 'equalto', 'keyword')
            | selectattr('attributes.check_frequency', 'equalto', 300)
            | selectattr('attributes.email', 'equalto', true)
            | selectattr('attributes.push', 'equalto', true)
            | selectattr('attributes.http_method', 'equalto', 'get')
            | selectattr('attributes.required_keyword', 'equalto', '{"status":"UP"}')
            | selectattr('attributes.confirmation_period', 'equalto', 600)
            | list | length == 1
          - >-
            better_stack_monitors_readback.json.data | default([])
            | selectattr('attributes.pronounceable_name', 'equalto', 'GAM production TLS certificate')
            | selectattr('attributes.url', 'equalto', gam_public_origin)
            | selectattr('attributes.monitor_type', 'equalto', 'status')
            | selectattr('attributes.check_frequency', 'equalto', 3600)
            | selectattr('attributes.email', 'equalto', true)
            | selectattr('attributes.push', 'equalto', true)
            | selectattr('attributes.ssl_expiration', 'equalto', 30)
            | selectattr('attributes.verify_ssl', 'equalto', true)
            | list | length == 1
        fail_msg: >-
          Better Stack monitor readback must match exactly one declared
          availability monitor and one declared TLS certificate monitor.
      no_log: true

    - name: Download the official Better Stack collector Docker Compose installer
      ansible.builtin.get_url:
        url: "{{ better_stack_collector_install_url }}"
        dest: /usr/local/libexec/better-stack-collector-install.sh
        owner: root
        group: root
        mode: "0750"
        checksum: "{{ better_stack_collector_install_checksum }}"

    - name: Inspect the existing Better Stack collector Docker Compose deployment
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --quiet
          - --filter
          - label=com.docker.compose.project=better-stack-collector
          - --filter
          - label=com.docker.compose.service={{ item }}
          - --filter
          - status=running
          - --filter
          - health=healthy
      register: better_stack_collector_preinstall_state
      loop: "{{ better_stack_collector_required_services }}"
      changed_when: false
      failed_when: better_stack_collector_preinstall_state.rc != 0

    - name: Run the official Better Stack collector Docker Compose deployment
      ansible.builtin.command:
        argv:
          - /bin/bash
          - /usr/local/libexec/better-stack-collector-install.sh
      environment:
        COLLECTOR_SECRET: "{{ better_stack_collector_secret }}"
      register: better_stack_collector_install
      changed_when: true
      when: >-
        better_stack_collector_preinstall_state.results
        | map(attribute='stdout')
        | select('equalto', '')
        | list | length > 0
      no_log: true

    - name: Verify the Better Stack collector Docker Compose deployment
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --quiet
          - --filter
          - label=com.docker.compose.project=better-stack-collector
          - --filter
          - label=com.docker.compose.service={{ item }}
          - --filter
          - status=running
          - --filter
          - health=healthy
      register: better_stack_collector_status
      loop: "{{ better_stack_collector_required_services }}"
      changed_when: false
      failed_when: >-
        better_stack_collector_status.rc != 0
        or better_stack_collector_status.stdout | trim | length == 0
        or (
        better_stack_collector_status.results | default([])
        | map(attribute='stdout')
        | select('equalto', '')
        | list | length > 0)

    - name: Discover the Better Stack metrics collector container
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --quiet
          - --filter
          - label=com.docker.compose.project=better-stack-collector
          - --filter
          - label=com.docker.compose.service=collector
          - --filter
          - status=running
      register: better_stack_collector_container
      changed_when: false
      failed_when: >-
        better_stack_collector_container.rc != 0
        or better_stack_collector_container.stdout_lines | length != 1

    - name: Inspect Better Stack collector network attachments
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{% raw %}{{json .NetworkSettings.Networks}}{% endraw %}"
          - "{{ better_stack_collector_container.stdout | trim }}"
      register: better_stack_collector_networks
      changed_when: false
      failed_when: better_stack_collector_networks.rc != 0

    - name: Connect the Better Stack collector to the private production network
      ansible.builtin.command:
        argv:
          - docker
          - network
          - connect
          - gam-production_private
          - "{{ better_stack_collector_container.stdout | trim }}"
      when: "'gam-production_private' not in better_stack_collector_networks.stdout"

    - name: Wait for every Better Stack service target to collect after network attachment
      ansible.builtin.shell:
        executable: /bin/sh
        cmd: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          base_url = os.environ["BETTER_STACK_TARGETS_URL"]
          retries = int(os.environ["BETTER_STACK_READINESS_RETRIES"])
          delay = float(os.environ["BETTER_STACK_READINESS_DELAY_SECONDS"])
          headers = {
              "Authorization": "Bearer " + os.environ["BETTER_STACK_API_TOKEN"],
              "Content-Type": "application/json",
          }

          def read_page(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          def attributes(target):
              value = target.get("attributes", {}) if isinstance(target, dict) else {}
              return value if isinstance(value, dict) else {}

          def matches(target, expected):
              actual = attributes(target)
              return all(actual.get(key) == value for key, value in expected.items())

          expected = (
              {
                  "kind": "prometheus",
                  "host": os.environ["BETTER_STACK_PROXY_TARGET_HOST"],
                  "service": os.environ["BETTER_STACK_PROXY_TARGET_SERVICE"],
                  "endpoint": os.environ["BETTER_STACK_PROXY_TARGET_ENDPOINT"],
                  "status": "up",
              },
              {
                  "kind": "prometheus",
                  "host": os.environ["BETTER_STACK_BACKEND_TARGET_HOST"],
                  "service": os.environ["BETTER_STACK_BACKEND_TARGET_SERVICE"],
                  "endpoint": os.environ["BETTER_STACK_BACKEND_TARGET_ENDPOINT"],
                  "status": "up",
              },
              {
                  "kind": "postgres",
                  "host": os.environ["BETTER_STACK_POSTGRESQL_TARGET_HOST"],
                  "port": int(os.environ["BETTER_STACK_POSTGRESQL_TARGET_PORT"]),
                  "username": os.environ["BETTER_STACK_POSTGRESQL_TARGET_USERNAME"],
                  "ssl_mode": "require",
                  "status": "up",
              },
          )

          result = {"ready": False, "attempts": 0, "data": []}
          for attempt in range(1, retries + 1):
              first = read_page(base_url + "?per_page=250")
              pages = [first]
              last_url = str(first.get("pagination", {}).get("last") or "page=1")
              last_page = int(urllib.parse.parse_qs(urllib.parse.urlparse(last_url).query).get("page", ["1"])[0])
              for page in range(2, last_page + 1):
                  pages.append(read_page(base_url + f"?page={page}&per_page=250"))
              targets = [target for page in pages for target in page.get("data", [])]
              ready = all(sum(matches(target, identity) for target in targets) == 1 for identity in expected)
              result = {"ready": ready, "attempts": attempt, "data": targets}
              if ready:
                  break
              if attempt < retries:
                  time.sleep(delay)
          print(json.dumps(result))
          PY
      environment:
        BETTER_STACK_TARGETS_URL: "{{ better_stack_telemetry_api_url }}/api/v1/collectors/{{ better_stack_collector_id }}/targets"
        BETTER_STACK_API_TOKEN: "{{ better_stack_api_token }}"
        BETTER_STACK_READINESS_RETRIES: "{{ better_stack_target_readiness_retries | default(12) }}"
        BETTER_STACK_READINESS_DELAY_SECONDS: "{{ better_stack_target_readiness_delay_seconds | default(10) }}"
        BETTER_STACK_PROXY_TARGET_HOST: "{{ better_stack_proxy_target_host }}"
        BETTER_STACK_PROXY_TARGET_SERVICE: "{{ better_stack_proxy_target_service }}"
        BETTER_STACK_PROXY_TARGET_ENDPOINT: "{{ better_stack_proxy_target_endpoint }}"
        BETTER_STACK_BACKEND_TARGET_HOST: "{{ better_stack_backend_target_host }}"
        BETTER_STACK_BACKEND_TARGET_SERVICE: "{{ better_stack_backend_target_service }}"
        BETTER_STACK_BACKEND_TARGET_ENDPOINT: "{{ better_stack_backend_target_endpoint }}"
        BETTER_STACK_POSTGRESQL_TARGET_HOST: "{{ better_stack_postgresql_target_host }}"
        BETTER_STACK_POSTGRESQL_TARGET_PORT: "{{ better_stack_postgresql_target_port | int }}"
        BETTER_STACK_POSTGRESQL_TARGET_USERNAME: "{{ better_stack_postgresql_target_username | string }}"
      register: better_stack_post_network_targets
      changed_when: false
      no_log: true

    - name: Read remaining Better Stack post-network readiness target pages
      ansible.builtin.set_fact:
        better_stack_post_network_target_pages:
          page_url_contract: "?page={{ item | default('each-attempt') }}&per_page=250"
          results: []
      changed_when: false
      no_log: true

    - name: Merge every Better Stack post-network readiness target page
      ansible.builtin.set_fact:
        better_stack_post_network_targets:
          json:
            data: >-
              {{ ([(better_stack_post_network_targets.stdout | from_json).data | default([])]
              + (better_stack_post_network_target_pages.results | default([])
              | map(attribute='json.data') | list)) | flatten | list }}
            ready: "{{ (better_stack_post_network_targets.stdout | from_json).ready | bool }}"
            attempts: "{{ (better_stack_post_network_targets.stdout | from_json).attempts | int }}"
      no_log: true

    - name: Verify every Better Stack service target is collecting across all pages
      ansible.builtin.assert:
        that:
          - better_stack_post_network_targets.json.ready | bool
          - >-
            better_stack_post_network_targets.json.data | default([])
            | selectattr('attributes', 'defined')
            | selectattr('attributes.kind', 'defined')
            | selectattr('attributes.kind', 'equalto', 'prometheus')
            | selectattr('attributes.host', 'defined')
            | selectattr('attributes.host', 'equalto', better_stack_proxy_target_host)
            | selectattr('attributes.service', 'defined')
            | selectattr('attributes.service', 'equalto', better_stack_proxy_target_service)
            | selectattr('attributes.endpoint', 'defined')
            | selectattr('attributes.endpoint', 'equalto', better_stack_proxy_target_endpoint)
            | selectattr('attributes.status', 'defined')
            | selectattr('attributes.status', 'equalto', 'up') | list | length == 1
          - >-
            better_stack_post_network_targets.json.data | default([])
            | selectattr('attributes', 'defined')
            | selectattr('attributes.kind', 'defined')
            | selectattr('attributes.kind', 'equalto', 'prometheus')
            | selectattr('attributes.host', 'defined')
            | selectattr('attributes.host', 'equalto', better_stack_backend_target_host)
            | selectattr('attributes.service', 'defined')
            | selectattr('attributes.service', 'equalto', better_stack_backend_target_service)
            | selectattr('attributes.endpoint', 'defined')
            | selectattr('attributes.endpoint', 'equalto', better_stack_backend_target_endpoint)
            | selectattr('attributes.status', 'defined')
            | selectattr('attributes.status', 'equalto', 'up') | list | length == 1
          - >-
            better_stack_post_network_targets.json.data | default([])
            | selectattr('attributes', 'defined')
            | selectattr('attributes.kind', 'defined')
            | selectattr('attributes.kind', 'equalto', 'postgres')
            | selectattr('attributes.host', 'defined')
            | selectattr('attributes.host', 'equalto', better_stack_postgresql_target_host)
            | selectattr('attributes.port', 'defined')
            | selectattr('attributes.port', 'equalto', better_stack_postgresql_target_port | int)
            | selectattr('attributes.username', 'defined')
            | selectattr('attributes.username', 'equalto', better_stack_postgresql_target_username)
            | selectattr('attributes.ssl_mode', 'defined')
            | selectattr('attributes.ssl_mode', 'equalto', 'require')
            | selectattr('attributes.status', 'defined')
            | selectattr('attributes.status', 'equalto', 'up') | list | length == 1
        fail_msg: >-
          Better Stack managed target readiness did not converge within
          {{ better_stack_post_network_targets.json.attempts }} bounded all-page attempts.
      no_log: true

- name: Release the canonical production workflow lock after convergence or failure
  hosts: production
  remote_user: "{{ steady_state_user }}"
  become: true
  gather_facts: false
  vars:
    canonical_lock_cleanup_play: true
  vars_files:
    - group_vars/production.yml
  pre_tasks:
    - name: Clear failed-host state before terminal deployment-lock cleanup
      ansible.builtin.meta: clear_host_errors
  tasks:
    - name: Validate deployment lock ownership through steady-state operations access
      ansible.builtin.shell: |
        set -eu
        lock=/run/gam-production-deploy.lock
        expected_token="{{ deployment_lock_owner_token | default('') }}"
        if [ ! -e "$lock" ]; then
          printf '%s\n' absent
        elif [ -n "$expected_token" ] &&
             [ "$(sed -n '1p' "$lock/owner" 2>/dev/null || true)" = "owner_token=$expected_token" ]; then
          printf '%s\n' owned
        else
          printf '%s\n' foreign
        fi
      args:
        executable: /bin/sh
      changed_when: false
      register: steady_state_deployment_lock_ownership
      ignore_errors: true
      ignore_unreachable: true
      when: deployment_lock_acquired | default(false) | bool

    - name: Release deployment lock through steady-state operations access
      ansible.builtin.file:
        path: /run/gam-production-deploy.lock
        state: absent
      changed_when: false
      register: steady_state_deployment_lock_cleanup
      ignore_errors: true
      ignore_unreachable: true
      when:
        - deployment_lock_acquired | default(false) | bool
        - >-
          (deployment_lock_owner_token | default('') | length == 0) or
          (steady_state_deployment_lock_ownership.stdout | default('') | trim == 'owned')

    - name: Validate deployment lock ownership through acquiring root access
      ansible.builtin.shell: |
        set -eu
        lock=/run/gam-production-deploy.lock
        expected_token="{{ deployment_lock_owner_token | default('') }}"
        if [ ! -e "$lock" ]; then
          printf '%s\n' absent
        elif [ -n "$expected_token" ] &&
             [ "$(sed -n '1p' "$lock/owner" 2>/dev/null || true)" = "owner_token=$expected_token" ]; then
          printf '%s\n' owned
        else
          printf '%s\n' foreign
        fi
      args:
        executable: /bin/sh
      remote_user: root
      become: false
      changed_when: false
      register: root_deployment_lock_ownership
      ignore_errors: true
      ignore_unreachable: true
      when:
        - deployment_lock_acquired | default(false) | bool
        - >-
          steady_state_deployment_lock_ownership is failed or
          steady_state_deployment_lock_ownership is unreachable or
          steady_state_deployment_lock_cleanup is failed or
          steady_state_deployment_lock_cleanup is unreachable

    - name: Release deployment lock
      ansible.builtin.file:
        path: /run/gam-production-deploy.lock
        state: absent
      remote_user: root
      become: false
      changed_when: false
      when:
        - deployment_lock_acquired | default(false) | bool
        - >-
          steady_state_deployment_lock_ownership is failed or
          steady_state_deployment_lock_ownership is unreachable or
          steady_state_deployment_lock_cleanup is failed or
          steady_state_deployment_lock_cleanup is unreachable
        - >-
          (deployment_lock_owner_token | default('') | length == 0) or
          (root_deployment_lock_ownership.stdout | default('') | trim == 'owned')

