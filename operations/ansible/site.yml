---
- name: Authorize and lock the canonical production workflow before mutation
  hosts: gam_production
  become: false
  gather_facts: false
  vars_files:
    - group_vars/production.yml
  tasks:
    - name: Initialize deployment lock ownership
      ansible.builtin.set_fact:
        deployment_lock_acquired: false

    - name: Require explicit Developer approval
      ansible.builtin.assert:
        that:
          - lookup('env', 'GAM_DEPLOYMENT_APPROVAL') | lower == 'approved'
          - lookup('env', 'GAM_DEPLOYMENT_APPROVAL_RECORD') | length > 0
        fail_msg: A Developer approval token and approval record are required before mutation.
      no_log: true

    - name: Acquire exclusive deployment lock
      ansible.builtin.shell: |
        set -eu
        install -d -m 0750 /run
        owner_token="$(cat /proc/sys/kernel/random/uuid)"
        test -n "$owner_token"
        if ! mkdir "/run/gam-production-deploy.lock"; then
          echo "another production deployment already owns the exclusive deployment lock" >&2
          exit 75
        fi
        if ! (umask 077 && printf 'owner_token=%s\n' "$owner_token" > "/run/gam-production-deploy.lock/owner"); then
          rm -f -- "/run/gam-production-deploy.lock/owner"
          rmdir -- "/run/gam-production-deploy.lock"
          exit 1
        fi
        printf '%s\n' "$owner_token"
      args:
        executable: /bin/sh
      become: true
      register: production_configuration_lock_result
      changed_when: false

    - name: Mark deployment lock as acquired
      ansible.builtin.set_fact:
        deployment_lock_acquired: true
        deployment_lock_owner_token: >-
          {{ production_configuration_lock_result.stdout | default('') | trim }}

- import_playbook: playbooks/production-host-baseline.yml

- name: Provision AWS recovery resources and independent backup monitoring
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - group_vars/production.yml
  tasks:
    - name: Apply the AWS backup bucket, audit, and cost governance contract
      ansible.builtin.include_tasks: aws-resources.yml

    - name: Require nonempty machine writer credentials before production activation
      ansible.builtin.assert:
        that:
          - >-
            (backup_writer_access_key is defined
            and backup_writer_access_key is not skipped
            and (backup_writer_access_key.stdout | from_json).AccessKey.AccessKeyId | default('') | length > 0)
            or lookup('env', 'GAM_BACKUP_ACCESS_KEY_ID') | length > 0
          - >-
            (backup_writer_access_key is defined
            and backup_writer_access_key is not skipped
            and (backup_writer_access_key.stdout | from_json).AccessKey.SecretAccessKey | default('') | length > 0)
            or lookup('env', 'GAM_BACKUP_SECRET_ACCESS_KEY') | length > 0
        fail_msg: >-
          GAM_BACKUP_ACCESS_KEY_ID and GAM_BACKUP_SECRET_ACCESS_KEY must be
          nonempty after the machine writer bootstrap before activation.

    - name: Apply the AWS EventBridge and Lambda backup monitor contract
      ansible.builtin.include_tasks: backup-monitor.yml

- name: Prepare the production host for the approved release sequence
  hosts: production
  remote_user: "{{ steady_state_user }}"
  become: true
  vars_files:
    - group_vars/production.yml
  tasks:
    - name: Install PostgreSQL TLS validation dependencies
      ansible.builtin.package:
        name: openssl
        state: present

    - name: Create the restricted PostgreSQL TLS directory
      ansible.builtin.file:
        path: "{{ postgres_tls_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Create production Compose configuration directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ production_root }}"
          mode: "0750"
        - path: "{{ production_root }}/runtime"
          mode: "0750"
        - path: "{{ production_root }}/secrets"
          mode: "0700"

    - name: Install approved production inputs under the deployment lock
      block:
        - name: Install the externally custodied production secret input
          ansible.builtin.include_role:
            name: secret-inputs

        - name: Install the PostgreSQL TLS certificate from external custody
          ansible.builtin.copy:
            src: "{{ postgres_tls_certificate_source_file }}"
            dest: "{{ postgres_tls_directory }}/server.crt"
            owner: root
            group: root
            mode: "0644"
          no_log: true

        - name: Install the PostgreSQL TLS private key from external custody
          ansible.builtin.copy:
            src: "{{ postgres_tls_private_key_source_file }}"
            dest: "{{ postgres_tls_directory }}/server.key"
            owner: root
            group: "{{ postgres_container_group_id }}"
            mode: "0640"
          no_log: true

        - name: Read the PostgreSQL certificate public key
          ansible.builtin.command:
            argv:
              - openssl
              - x509
              - -in
              - "{{ postgres_tls_directory }}/server.crt"
              - -pubkey
              - -noout
              - -checkend
              - "0"
          register: postgres_tls_certificate_public_key
          changed_when: false
          no_log: true

        - name: Read the PostgreSQL private key public component
          ansible.builtin.command:
            argv:
              - openssl
              - pkey
              - -in
              - "{{ postgres_tls_directory }}/server.key"
              - -pubout
          register: postgres_tls_private_key_public_key
          changed_when: false
          no_log: true

        - name: Verify the PostgreSQL TLS certificate and private key match
          ansible.builtin.assert:
            that:
              - >-
                postgres_tls_certificate_public_key.stdout | trim
                == postgres_tls_private_key_public_key.stdout | trim
            fail_msg: The PostgreSQL TLS certificate and private key do not match.
          no_log: true

        - name: Install versioned production Compose configuration
          ansible.builtin.copy:
            src: "{{ item.src }}"
            dest: "{{ item.dest }}"
            owner: root
            group: root
            mode: "0644"
          loop:
            - src: "{{ playbook_dir }}/../../deploy/production/compose.yml"
              dest: "{{ production_compose_file }}"
            - src: "{{ playbook_dir }}/../../deploy/production/Caddyfile"
              dest: "{{ production_root }}/Caddyfile"
          register: production_compose_configuration_install
      rescue:
        - name: Remove deployment lock after release-input preparation failure
          ansible.builtin.shell: |
            set -eu
            lock=/run/gam-production-deploy.lock
            expected_token="{{ deployment_lock_owner_token | default('') }}"
            if [ ! -e "$lock" ]; then
              exit 0
            fi
            if [ -n "$expected_token" ]; then
              current_owner="$(sed -n '1p' "$lock/owner" 2>/dev/null || true)"
              if [ "$current_owner" != "owner_token=$expected_token" ]; then
                exit 0
              fi
            fi
            rm -rf -- "$lock"
          args:
            executable: /bin/sh
          changed_when: false
          when: >-
            deployment_lock_acquired | bool or
            (production_configuration_lock_result is defined and
             (production_configuration_lock_result.rc | default(1) | int) == 0)

        - name: Stop after locked versioned configuration convergence failure
          ansible.builtin.fail:
            msg: Versioned production Compose configuration did not converge under the exclusive deployment lock.

    - name: Install recoverable production Compose environment inputs
      ansible.builtin.copy:
        src: "{{ production_recoverable_secret_file }}"
        dest: "{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      loop:
        - "{{ production_root }}/secrets/postgres.env"
        - "{{ production_root }}/secrets/backend.env"
      register: production_secret_input_install
      failed_when: false
      no_log: true

    - name: Detect recoverable production secret-input installation failure
      ansible.builtin.set_fact:
        production_secret_input_install_failed: >-
          {{
            production_secret_input_install.results | default([])
            | selectattr('failed', 'defined')
            | selectattr('failed')
            | list
            | length > 0
          }}
      no_log: true

    - name: Remove deployment lock after secret-input installation failure
      ansible.builtin.shell: |
        set -eu
        lock=/run/gam-production-deploy.lock
        expected_token="{{ deployment_lock_owner_token | default('') }}"
        if [ ! -e "$lock" ]; then
          exit 0
        fi
        if [ -n "$expected_token" ]; then
          current_owner="$(sed -n '1p' "$lock/owner" 2>/dev/null || true)"
          if [ "$current_owner" != "owner_token=$expected_token" ]; then
            exit 0
          fi
        fi
        rm -rf -- "$lock"
      args:
        executable: /bin/sh
      changed_when: false
      when: production_secret_input_install_failed | bool

    - name: Stop after recoverable production secret-input installation failure
      ansible.builtin.fail:
        msg: Recoverable production secret inputs did not converge under the exclusive deployment lock.
      when: production_secret_input_install_failed | bool

- import_playbook: ../../deploy/production/ansible/deploy-release.yml

- name: Provision GAM production backup, recovery, AWS, and monitoring behavior
  hosts: production
  remote_user: "{{ steady_state_user }}"
  become: true
  vars_files:
    - group_vars/production.yml
  pre_tasks:
    - name: Default the protected PostgreSQL target credential-state path
      ansible.builtin.set_fact:
        better_stack_postgresql_target_credentials_fingerprint_file: >-
          {{ ansible_user_dir | default(lookup('env', 'HOME'), true)
          }}/.local/state/gam/better-stack/postgresql-target-credentials.sha256
      when: better_stack_postgresql_target_credentials_fingerprint_file is not defined
      no_log: true

    - name: Require parameterized deployment inputs
      ansible.builtin.assert:
        that:
          - aws_account_id | length > 0
          - vps_public_source_ip | length > 0
          - gam_public_origin | length > 0
          - developer_age_recipient | length > 0
          - client_age_recipient | length > 0
          - better_stack_api_url | length > 0
          - better_stack_api_token | length > 0
          - better_stack_collector_install_url | length > 0
          - better_stack_collector_install_checksum | length > 0
          - better_stack_proxy_target_host | length > 0
          - better_stack_proxy_target_service | length > 0
          - better_stack_proxy_target_endpoint | length > 0
          - better_stack_backend_target_host | length > 0
          - better_stack_backend_target_service | length > 0
          - better_stack_backend_target_endpoint | length > 0
          - better_stack_postgresql_target_host | length > 0
          - better_stack_postgresql_target_port | int > 0
          - better_stack_postgresql_target_username | length > 0
          - better_stack_postgresql_target_password | length > 0
          - postgres_tls_certificate_source_file | length > 0
          - postgres_tls_private_key_source_file | length > 0
        fail_msg: >-
          AWS account, VPS public source IP, production origin, and both public
          encryption recipients, Better Stack API token, service target
          connection inputs, PostgreSQL TLS certificate and key, and the
          verified vendor installer source must be supplied outside version
          control.
      no_log: true

    - name: Install production recovery dependencies
      ansible.builtin.package:
        name:
          - age
          - awscli
          - jq
          - openssl
          - postgresql-client-18
        state: present

  tasks:
    - name: Discover the running production PostgreSQL container
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --quiet
          - --filter
          - label=com.docker.compose.project=gam-production
          - --filter
          - label=com.docker.compose.service=postgres
          - --filter
          - status=running
      register: production_postgresql_container
      changed_when: false
      failed_when: >-
        production_postgresql_container.rc != 0
        or production_postgresql_container.stdout_lines | length != 1
      check_mode: false

    - name: Inspect PostgreSQL monitoring prerequisites before reconciliation
      ansible.builtin.shell:
        executable: /bin/sh
        cmd: |
          set -eu
          docker exec --interactive \
            --env GAM_MONITOR_USERNAME \
            --env GAM_MONITOR_CREDENTIAL_FINGERPRINT \
            "{{ production_postgresql_container.stdout | trim }}" \
            sh -ceu '
              exec psql \
                --username "$POSTGRES_USER" \
                --dbname "$POSTGRES_DB" \
                --tuples-only \
                --no-align \
                --set=ON_ERROR_STOP=1 \
                --set=monitor_username="$GAM_MONITOR_USERNAME" \
                --set=credential_comment="gam-monitor-credentials-sha256:$GAM_MONITOR_CREDENTIAL_FINGERPRINT"
            ' <<'SQL'
          SELECT concat_ws('|',
            CASE WHEN EXISTS (
              SELECT 1 FROM pg_roles WHERE rolname = :'monitor_username'
            ) THEN 'role=present' ELSE 'role=missing' END,
            CASE WHEN EXISTS (
              SELECT 1
              FROM pg_auth_members membership
              JOIN pg_roles member_role ON member_role.oid = membership.member
              JOIN pg_roles granted_role ON granted_role.oid = membership.roleid
              WHERE member_role.rolname = :'monitor_username'
                AND granted_role.rolname = 'pg_monitor'
            ) THEN 'pg_monitor=granted' ELSE 'pg_monitor=missing' END,
            CASE WHEN EXISTS (
              SELECT 1
              FROM pg_roles
              WHERE rolname = :'monitor_username'
                AND has_database_privilege(oid, current_database(), 'CONNECT')
            ) THEN 'connect=granted' ELSE 'connect=missing' END,
            CASE WHEN EXISTS (
              SELECT 1 FROM pg_extension WHERE extname = 'pg_stat_statements'
            ) THEN 'extension=present' ELSE 'extension=missing' END,
            CASE WHEN 'pg_stat_statements' = ANY (
              regexp_split_to_array(current_setting('shared_preload_libraries'), E'\\s*,\\s*')
            ) THEN 'preload=enabled' ELSE 'preload=missing' END,
            CASE WHEN EXISTS (
              SELECT 1
              FROM pg_roles
              WHERE rolname = :'monitor_username'
                AND coalesce(shobj_description(oid, 'pg_authid'), '') = :'credential_comment'
            ) THEN 'credentials=current' ELSE 'credentials=stale' END
          );
          SQL
      environment:
        GAM_MONITOR_USERNAME: "{{ better_stack_postgresql_target_username | string }}"
        GAM_MONITOR_CREDENTIAL_FINGERPRINT: >-
          {{ better_stack_postgresql_target_password | hash('sha256') }}
      register: postgresql_monitoring_state_before
      changed_when: false
      check_mode: false
      no_log: true

    - name: Reconcile PostgreSQL monitoring role, grants, extension, and credentials
      ansible.builtin.shell:
        executable: /bin/sh
        cmd: |
          set -eu
          docker exec --interactive \
            --env GAM_MONITOR_USERNAME \
            --env GAM_MONITOR_PASSWORD \
            --env GAM_MONITOR_CREDENTIAL_FINGERPRINT \
            "{{ production_postgresql_container.stdout | trim }}" \
            sh -ceu '
              exec psql \
                --username "$POSTGRES_USER" \
                --dbname "$POSTGRES_DB" \
                --set=ON_ERROR_STOP=1 \
                --set=monitor_username="$GAM_MONITOR_USERNAME" \
                --set=monitor_password="$GAM_MONITOR_PASSWORD" \
                --set=credential_comment="gam-monitor-credentials-sha256:$GAM_MONITOR_CREDENTIAL_FINGERPRINT"
            ' <<'SQL'
          BEGIN;
          SELECT format('CREATE ROLE %I LOGIN', :'monitor_username')
          WHERE NOT EXISTS (
            SELECT 1 FROM pg_roles WHERE rolname = :'monitor_username'
          ) \gexec
          SELECT format(
            'ALTER ROLE %I LOGIN PASSWORD %L',
            :'monitor_username',
            :'monitor_password'
          )
          WHERE NOT EXISTS (
            SELECT 1
            FROM pg_roles
            WHERE rolname = :'monitor_username'
              AND coalesce(shobj_description(oid, 'pg_authid'), '') = :'credential_comment'
          ) \gexec
          SELECT format(
            'COMMENT ON ROLE %I IS %L',
            :'monitor_username',
            :'credential_comment'
          )
          WHERE NOT EXISTS (
            SELECT 1
            FROM pg_roles
            WHERE rolname = :'monitor_username'
              AND coalesce(shobj_description(oid, 'pg_authid'), '') = :'credential_comment'
          ) \gexec
          SELECT format('GRANT pg_monitor TO %I', :'monitor_username')
          WHERE NOT EXISTS (
            SELECT 1
            FROM pg_auth_members membership
            JOIN pg_roles member_role ON member_role.oid = membership.member
            JOIN pg_roles granted_role ON granted_role.oid = membership.roleid
            WHERE member_role.rolname = :'monitor_username'
              AND granted_role.rolname = 'pg_monitor'
          ) \gexec
          SELECT format(
            'GRANT CONNECT ON DATABASE %I TO %I',
            current_database(),
            :'monitor_username'
          )
          WHERE NOT has_database_privilege(
            :'monitor_username', current_database(), 'CONNECT'
          ) \gexec
          CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
          COMMIT;
          SQL
      environment:
        GAM_MONITOR_USERNAME: "{{ better_stack_postgresql_target_username | string }}"
        GAM_MONITOR_PASSWORD: "{{ better_stack_postgresql_target_password | string }}"
        GAM_MONITOR_CREDENTIAL_FINGERPRINT: >-
          {{ better_stack_postgresql_target_password | hash('sha256') }}
      when: >-
        postgresql_monitoring_state_before.stdout | trim !=
        'role=present|pg_monitor=granted|connect=granted|extension=present|preload=enabled|credentials=current'
      changed_when: true
      no_log: true

    - name: Inspect PostgreSQL monitoring prerequisites after reconciliation
      ansible.builtin.shell:
        executable: /bin/sh
        cmd: |
          set -eu
          docker exec --interactive \
            --env GAM_MONITOR_USERNAME \
            --env GAM_MONITOR_CREDENTIAL_FINGERPRINT \
            "{{ production_postgresql_container.stdout | trim }}" \
            sh -ceu '
              exec psql \
                --username "$POSTGRES_USER" \
                --dbname "$POSTGRES_DB" \
                --tuples-only \
                --no-align \
                --set=ON_ERROR_STOP=1 \
                --set=monitor_username="$GAM_MONITOR_USERNAME" \
                --set=credential_comment="gam-monitor-credentials-sha256:$GAM_MONITOR_CREDENTIAL_FINGERPRINT"
            ' <<'SQL'
          SELECT concat_ws('|',
            CASE WHEN EXISTS (
              SELECT 1 FROM pg_roles WHERE rolname = :'monitor_username'
            ) THEN 'role=present' ELSE 'role=missing' END,
            CASE WHEN EXISTS (
              SELECT 1
              FROM pg_auth_members membership
              JOIN pg_roles member_role ON member_role.oid = membership.member
              JOIN pg_roles granted_role ON granted_role.oid = membership.roleid
              WHERE member_role.rolname = :'monitor_username'
                AND granted_role.rolname = 'pg_monitor'
            ) THEN 'pg_monitor=granted' ELSE 'pg_monitor=missing' END,
            CASE WHEN EXISTS (
              SELECT 1 FROM pg_roles WHERE rolname = :'monitor_username'
            ) AND has_database_privilege(
              :'monitor_username', current_database(), 'CONNECT'
            ) THEN 'connect=granted' ELSE 'connect=missing' END,
            CASE WHEN EXISTS (
              SELECT 1 FROM pg_extension WHERE extname = 'pg_stat_statements'
            ) THEN 'extension=present' ELSE 'extension=missing' END,
            CASE WHEN 'pg_stat_statements' = ANY (
              regexp_split_to_array(current_setting('shared_preload_libraries'), E'\\s*,\\s*')
            ) THEN 'preload=enabled' ELSE 'preload=missing' END,
            CASE WHEN EXISTS (
              SELECT 1
              FROM pg_roles
              WHERE rolname = :'monitor_username'
                AND coalesce(shobj_description(oid, 'pg_authid'), '') = :'credential_comment'
            ) THEN 'credentials=current' ELSE 'credentials=stale' END
          );
          SQL
      environment:
        GAM_MONITOR_USERNAME: "{{ better_stack_postgresql_target_username | string }}"
        GAM_MONITOR_CREDENTIAL_FINGERPRINT: >-
          {{ better_stack_postgresql_target_password | hash('sha256') }}
      register: postgresql_monitoring_state_after
      changed_when: false
      check_mode: false
      no_log: true

    - name: Verify PostgreSQL monitoring role, grants, extension, and preload state
      ansible.builtin.assert:
        that:
          - >-
            postgresql_monitoring_state_after.stdout | trim ==
            'role=present|pg_monitor=granted|connect=granted|extension=present|preload=enabled|credentials=current'
        fail_msg: >-
          PostgreSQL monitoring prerequisites must converge before the Better
          Stack database target is accepted.
      no_log: true

    - name: Report verified PostgreSQL monitoring state for commissioning evidence
      ansible.builtin.debug:
        msg: >-
          PostgreSQL monitoring state verified: pg_roles pg_auth_members
          pg_monitor has_database_privilege pg_extension pg_stat_statements
          shared_preload_libraries
      changed_when: false

    - name: Create the machine backup service group on a clean host
      ansible.builtin.group:
        name: "{{ backup_service_group }}"
        system: true

    - name: Create the non-login machine backup service user on a clean host
      ansible.builtin.user:
        name: "{{ backup_service_user }}"
        group: "{{ backup_service_group }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create backup runtime directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default(backup_service_user) }}"
        group: "{{ item.group | default(backup_service_group) }}"
        mode: "{{ item.mode | default('0700') }}"
      loop:
        - path: "{{ backup_state_directory }}"
        - path: "{{ backup_runtime_directory }}"
        - path: /etc/gam
          owner: root
          group: root
          mode: "0750"

    - name: Install backup environment inputs
      ansible.builtin.template:
        src: templates/backup.env.j2
        dest: "{{ backup_environment_file }}"
        owner: root
        group: "{{ backup_service_group }}"
        mode: "0640"

    - name: Install restricted machine backup-writer credentials
      ansible.builtin.template:
        src: templates/backup-writer.credentials.j2
        dest: "{{ backup_writer_credentials_file }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when:
        - lookup('env', 'GAM_BACKUP_ACCESS_KEY_ID') | length > 0
        - lookup('env', 'GAM_BACKUP_SECRET_ACCESS_KEY') | length > 0

    - name: Install versioned backup and restoration procedures
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0750"
      loop:
        - src: ../recovery/backup/backup.sh
          dest: /usr/local/libexec/gam-backup
        - src: ../recovery/restore/restore.sh
          dest: /usr/local/libexec/gam-restore
        - src: ../recovery/verify-restoration/verify-restoration.sh
          dest: /usr/local/libexec/gam-verify-restoration

    - name: Install persistent daily backup timer
      ansible.builtin.template:
        src: templates/gam-backup.service.j2
        dest: /etc/systemd/system/gam-backup.service
        owner: root
        group: root
        mode: "0644"

    - name: Install persistent daily backup schedule
      ansible.builtin.template:
        src: templates/gam-backup.timer.j2
        dest: /etc/systemd/system/gam-backup.timer
        owner: root
        group: root
        mode: "0644"

    - name: Enable daily backup schedule with reboot catch-up
      ansible.builtin.systemd:
        name: gam-backup.timer
        daemon_reload: true
        enabled: true
        state: started

    - name: Install the Better Stack metrics-only verification contract
      ansible.builtin.template:
        src: templates/better-stack-monitoring.yml.j2
        dest: /etc/gam/better-stack-monitoring-contract.yml
        owner: root
        group: root
        mode: "0600"

    - name: Discover Better Stack collectors by stable provider name
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors?name={{ better_stack_collector_name | urlencode }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      register: better_stack_existing_collectors
      no_log: true

    - name: Read remaining pages from filtered Better Stack collector discovery
      ansible.builtin.uri:
        url: "{{ better_stack_telemetry_api_url }}/api/v1/collectors?name={{ better_stack_collector_name | urlencode }}&page={{ item }}&per_page=100"
        method: GET
        headers:
          Authorization: "Bearer {{ better_stack_api_token }}"
          Content-Type: application/json
        status_code: [200]
        return_content: true
      loop: >-
        {{ range(2, (
        better_stack_existing_collectors.json.pagination.last
        | default('page=1', true) | string
        | regex_findall('(?:[?&]page=|^)([0-9]+)(?:&|$)')
        | first | default('1', true) | int) + 1) | list }}
      register: better_stack_existing_collector_pages
      no_log: true

    - name: Merge every filtered Better Stack collector discovery page
      ansible.builtin.set_fact:
        better_stack_existing_collectors:
          json:
            data: >-
