    - name: Select the Better Stack production dashboard
      ansible.builtin.set_fact:
        better_stack_dashboard_id: >-
          {{ (better_stack_dashboards_readback.json.data | default([])
          | selectattr('attributes.name', 'equalto', better_stack_dashboard_name)
          | map(attribute='id') | first) }}
        better_stack_dashboard_provider_resource: >-
