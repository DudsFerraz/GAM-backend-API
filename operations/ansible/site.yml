      register: better_stack_monitor_readback_queries
      no_log: true

    - name: Read remaining filtered Better Stack availability monitor readback pages
      ansible.builtin.uri:
        url: "{{ better_stack_api_url }}/monitors?pronounceable_name={{ 'GAM production availability' | urlencode }}&page={{ item }}&per_page=100"
