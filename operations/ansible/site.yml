          - better_stack_dashboard_readback.json.data.attributes.date_range_from == 'now-3h'
          - better_stack_dashboard_readback.json.data.attributes.date_range_to == 'now'
          - >-
            better_stack_dashboard_readback.json.data.attributes.variables | default([]) == [{
              'name': 'source',
              'variable_type': 'source',
              'values': [better_stack_dashboard_source_id],
              'default_values': [better_stack_dashboard_source_id]
