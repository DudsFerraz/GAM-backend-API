            operator: higher_than_or_equal
            value: 90
            incident_cause: GAM filesystem usage reached the critical threshold
            metadata: {environment: production, service: filesystem, severity: critical}
        declared_alert: "{{ better_stack_alert_contracts[item.attributes.name] }}"
      when:
        - item.attributes.name | default('') in better_stack_alert_contracts
        - item.attributes.dashboard_id | int == better_stack_dashboard_id | int
        - item.attributes.chart_id | int == declared_alert.chart_id | int
        - >-
          item.attributes.alert_type | default('') != 'threshold'
          or item.attributes.operator | default('') != declared_alert.operator
          or item.attributes.value | int != declared_alert.value | int
          or item.attributes.check_period | int != 300
          or item.attributes.confirmation_period | int != 0
          or item.attributes.recovery_period | int != 300
          or item.attributes.email is not sameas true
          or item.attributes.push is not sameas true
          or item.attributes.incident_cause | default('') != declared_alert.incident_cause
          or item.attributes.metadata | default({}) != declared_alert.metadata
