---
# All values below are deployment inputs.  Secrets and private recovery
# identities are supplied by the operator's external custody process.
aws_region: sa-east-1
aws_account_id: "{{ lookup('env', 'GAM_AWS_ACCOUNT_ID') }}"

vps_public_source_ip: "{{ lookup('env', 'GAM_VPS_PUBLIC_SOURCE_IP') }}"
production_origin: "{{ lookup('env', 'GAM_PRODUCTION_ORIGIN') }}"

backup_bucket_name: "gam-production-backups-{{ aws_account_id }}-sa-east-1"
backup_audit_bucket_name: "gam-production-backup-audit-{{ aws_account_id }}-sa-east-1"
backup_prefix: production/postgresql
backup_writer_name: gam-production-backup-writer
backup_access_key_rotation_days: 90
postgresql_major_version: "18"

backup_monitor_lambda_role_name: gam-production-backup-monitor-lambda
backup_monitor_scheduler_role_name: gam-production-backup-monitor-scheduler
backup_monitor_lambda_role_arn: "arn:aws:iam::{{ aws_account_id }}:role/{{ backup_monitor_lambda_role_name }}"
backup_monitor_scheduler_role_arn: "arn:aws:iam::{{ aws_account_id }}:role/{{ backup_monitor_scheduler_role_name }}"
backup_monitor_lambda_function_name: gam-production-backup-monitor
backup_monitor_lambda_arn: "arn:aws:lambda:{{ aws_region }}:{{ aws_account_id }}:function:{{ backup_monitor_lambda_function_name }}"

backup_schedule_timezone: America/Sao_Paulo
backup_schedule_local_time: "03:15"
backup_monitor_local_time: "04:30"
backup_escalation_local_time: "12:00"
backup_recovery_point_retention_days:
  daily: 31
  weekly: 85
  monthly: 370
backup_audit_retention_days: 400

# Public age recipients are configuration inputs, never private identities.
developer_age_recipient: "{{ lookup('env', 'GAM_DEVELOPER_AGE_RECIPIENT') }}"
client_age_recipient: "{{ lookup('env', 'GAM_CLIENT_AGE_RECIPIENT') }}"

# SNS topics and Better Stack credentials are external notification inputs.
# Subscription confirmation remains a manual account step.
developer_backup_alert_topic_arn: "{{ lookup('env', 'GAM_DEVELOPER_BACKUP_ALERT_TOPIC_ARN') }}"
client_custodian_backup_alert_topic_arn: "{{ lookup('env', 'GAM_CLIENT_CUSTODIAN_BACKUP_ALERT_TOPIC_ARN') }}"
budget_notification_topic_arn: "{{ lookup('env', 'GAM_BUDGET_NOTIFICATION_TOPIC_ARN') }}"
better_stack_api_url: >-
  {{ lookup('env', 'BETTER_STACK_API_URL')
  | default('https://uptime.betterstack.com/api/v2', true)
  | regex_replace('/+$', '') }}
better_stack_telemetry_api_url: >-
  {{ lookup('env', 'BETTER_STACK_TELEMETRY_API_URL')
  | default('https://telemetry.betterstack.com', true)
  | regex_replace('/+$', '') }}
better_stack_api_token: "{{ lookup('env', 'BETTER_STACK_API_TOKEN') }}"
better_stack_collector_secret: "{{ lookup('env', 'BETTER_STACK_COLLECTOR_SECRET') }}"
better_stack_collector_install_url: "{{ lookup('env', 'BETTER_STACK_COLLECTOR_INSTALL_URL') | default('https://raw.githubusercontent.com/BetterStackHQ/collector/main/install.sh', true) }}"
better_stack_collector_install_checksum: "{{ lookup('env', 'BETTER_STACK_COLLECTOR_INSTALL_CHECKSUM') }}"
better_stack_collector_required_services:
  - collector
  - ebpf

# Better Stack provider resources are selected by stable names and reconciled
# through the provider APIs. Service addresses default to versioned private
# network aliases and remain externally overrideable for controlled validation.
better_stack_collector_name: GAM production metrics
better_stack_dashboard_name: GAM production
better_stack_proxy_chart_name: GAM proxy health
better_stack_backend_chart_name: GAM backend health
better_stack_postgresql_chart_name: GAM PostgreSQL health
better_stack_filesystem_chart_name: GAM filesystem usage
better_stack_chart_contracts:
  - key: proxy
    name: "{{ better_stack_proxy_chart_name }}"
    chart_type: line_chart
    queries:
      - query_type: sql_expression
        source_variable: source
        sql_query: "{% raw %}SELECT {{time}} AS time, avgMerge(value_avg) AS value FROM {{source}} WHERE dt BETWEEN {{start_time}} AND {{end_time}} AND name = 'up' AND label('_service') = '{% endraw %}{{ better_stack_proxy_target_service }}{% raw %}' GROUP BY time{% endraw %}"
  - key: backend
    name: "{{ better_stack_backend_chart_name }}"
    chart_type: line_chart
    queries:
      - query_type: sql_expression
        source_variable: source
        sql_query: "{% raw %}SELECT {{time}} AS time, avgMerge(value_avg) AS value FROM {{source}} WHERE dt BETWEEN {{start_time}} AND {{end_time}} AND name = 'up' AND label('_service') = '{% endraw %}{{ better_stack_backend_target_service }}{% raw %}' GROUP BY time{% endraw %}"
  - key: postgresql
    name: "{{ better_stack_postgresql_chart_name }}"
    chart_type: line_chart
    queries:
      - query_type: sql_expression
        source_variable: source
        sql_query: "{% raw %}SELECT {{time}} AS time, avgMerge(value_avg) AS value FROM {{source}} WHERE dt BETWEEN {{start_time}} AND {{end_time}} AND name = 'up' AND label('_host') = '{% endraw %}{{ better_stack_postgresql_target_host }}{% raw %}' GROUP BY time{% endraw %}"
  - key: filesystem
    name: "{{ better_stack_filesystem_chart_name }}"
    chart_type: line_chart
    queries:
      - query_type: sql_expression
        source_variable: source
        sql_query: "{% raw %}SELECT {{time}} AS time, maxMerge(value_max) AS value FROM {{source}} WHERE dt BETWEEN {{start_time}} AND {{end_time}} AND name = 'node_filesystem_usage_percent'  GROUP BY time{% endraw %}"
better_stack_proxy_target_host: "{{ lookup('env', 'BETTER_STACK_PROXY_TARGET_HOST') | default('proxy.internal', true) }}"
better_stack_proxy_target_service: "{{ lookup('env', 'BETTER_STACK_PROXY_TARGET_SERVICE') }}"
better_stack_proxy_target_endpoint: "{{ lookup('env', 'BETTER_STACK_PROXY_TARGET_ENDPOINT') | default('http://proxy.internal:2019/metrics', true) }}"
better_stack_backend_target_host: "{{ lookup('env', 'BETTER_STACK_BACKEND_TARGET_HOST') | default('backend.internal', true) }}"
better_stack_backend_target_service: "{{ lookup('env', 'BETTER_STACK_BACKEND_TARGET_SERVICE') }}"
better_stack_backend_target_endpoint: "{{ lookup('env', 'BETTER_STACK_BACKEND_TARGET_ENDPOINT') | default('http://backend.internal:8080/actuator/prometheus', true) }}"
better_stack_postgresql_target_host: "{{ lookup('env', 'BETTER_STACK_POSTGRESQL_TARGET_HOST') | default('postgres.internal', true) }}"
better_stack_postgresql_target_port: 5432
# Better Stack treats the target password as write-only; both credentials are
# supplied for creation from approved external custody and are never committed.
better_stack_postgresql_target_username: "{{ lookup('env', 'BETTER_STACK_POSTGRESQL_TARGET_USERNAME') }}"
better_stack_postgresql_target_password: "{{ lookup('env', 'BETTER_STACK_POSTGRESQL_TARGET_PASSWORD') }}"
# PostgreSQL TLS identity remains in approved external secret custody. The
# official Alpine image assigns gid 70 to its postgres group; the root-owned
# 0640 key uses PostgreSQL's supported operating-system-managed key pattern.
postgres_tls_certificate_source_file: "{{ lookup('env', 'GAM_POSTGRES_TLS_CERTIFICATE_FILE') }}"
postgres_tls_private_key_source_file: "{{ lookup('env', 'GAM_POSTGRES_TLS_PRIVATE_KEY_FILE') }}"
postgres_tls_directory: /opt/gam/secrets/postgres-tls
postgres_container_group_id: 70

backup_state_directory: /var/lib/gam/backup
backup_runtime_directory: /var/lib/gam/backup/runtime
backup_environment_file: /etc/gam/backup.env
backup_writer_credentials_file: /etc/gam/backup-writer.credentials
backup_service_user: gam-backup
backup_service_group: gam-backup

cost_governance:
  project: GAM
  environment: production
  purpose: backup
  warning_usd: 5
  reassessment_usd: 10
  critical_usd: 25
  anomaly_impact_usd: 5
