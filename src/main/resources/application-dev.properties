spring.docker.compose.enabled=true
spring.docker.compose.lifecycle-management=start-only
spring.flyway.locations=classpath:db/migration,classpath:db/dev-migration
spring.config.import=optional:file:./application-local.properties

# WARNING: the development callback creates privileged Accounts and synthetic
# sensitive data. These gates must remain local-development-only and explicit.
spring.flyway.placeholders.gamDevFixtureExecutionEnabled=${gam.dev-fixture.execution-enabled:${GAM_DEV_FIXTURE_EXECUTION_ENABLED:}}
spring.flyway.placeholders.gamDevFixturePasswordHash=${gam.dev-fixture.password-hash:${GAM_DEV_FIXTURE_PASSWORD_HASH:}}

springdoc.swagger-ui.supported-submit-methods=get,post,patch,delete

jwt.secret-key=${JWT_SECRET_KEY}

app.auth.cookie.secure=false
GAM_PUBLIC_ORIGIN=http://localhost:3000
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
